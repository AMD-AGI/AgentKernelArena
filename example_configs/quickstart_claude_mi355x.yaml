# Minimal first-run example for Claude Code on MI355X (gfx950).
agent:
  template: claude_code

# The target language is selected by the run, not by the task.
target_language: triton   # triton | gluon | hip | flydsl | asm

tasks:
  - triton/normalization/rms_norm/bf16_h8192

target_gpu_model: MI355X
log_directory: logs
workspace_directory_prefix: workspace
