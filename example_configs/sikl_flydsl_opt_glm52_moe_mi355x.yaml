# SIKL same-language optimization task: the GLM-5.2 MXFP4 MoE FlyDSL kernels.
#
# The forge agent runs KernelForge's forge-loop over the aiter tree seeded into
# the workspace, so it optimizes the FlyDSL kernels aiter already ships. Its
# sibling config, sikl_rewrite_glm52_moe_mi355x.yaml, measures the same operator
# with the same inputs and baseline but rewrites it in FlyDSL from scratch.
#
# Requires KernelForge installed so `kernel-agents` is on PATH, and the LLM
# gateway environment (ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN /
# ANTHROPIC_CUSTOM_HEADERS).
agent:
  template: forge

# The schema carries six workload cases; swap in another shape.
# Available: t8, t16, t32, t64, t128, t256 (each with a _flydsl_opt task).
tasks:
  - SIKL-task/glm52_moe_mxfp4_per1x32_t64_flydsl_opt

target_gpu_model: MI355X
log_directory: logs
workspace_directory_prefix: workspace
