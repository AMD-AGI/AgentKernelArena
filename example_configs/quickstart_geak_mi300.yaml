# Minimal first-run example for GEAK on MI300/MI300X (gfx942).
# Complete agents/geak/README.md setup first, and export GEAK_HOME
# on the host (the Docker runner mounts/forwards it and installs the SDK).
agent:
  template: geak

tasks:
  - hip2hip/gpumode/GELU

target_gpu_model: MI300
log_directory: logs
workspace_directory_prefix: workspace
