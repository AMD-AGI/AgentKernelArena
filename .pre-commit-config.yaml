repos:
  - repo: local
    hooks:
      - id: check-perf-helpers
        name: audit task benchmark entrypoints
        entry: make check-perf-helpers
        language: system
        pass_filenames: false
        files: ^(src/tools/perf/|src/tools/sync_perf_helpers\.py|src/perf_helper_materialization\.py|src/serving_task_preparation\.py|tasks/.*/(task|config)\.yaml|tasks/.*/scripts/evaluate\.py)$
