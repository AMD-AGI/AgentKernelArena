name: post-merge

# 合入后 CI (post-merge / main validation)
# ---------------------------------------------------------------------------
# Heavier validation that runs AFTER changes land on `main`, on a nightly
# schedule, or on demand. The real functional checks (kernel compile /
# correctness / performance) require an AMD GPU + ROCm, which GitHub-hosted
# runners do not provide, so these jobs target *self-hosted* runners and are
# opt-in.
#
# To enable the GPU jobs:
#   1. Register a self-hosted runner on an AMD GPU host with labels:
#        self-hosted, linux, rocm
#      (Docker must be available; the Makefile drives a ROCm/SGLang container.)
#   2. Set the repository variable  ENABLE_GPU_CI = true
#        Settings -> Secrets and variables -> Actions -> Variables
#      Optionally provide agent credentials so `docker-check-agents` can pass.
#
# Until ENABLE_GPU_CI is set, the GPU jobs are skipped and the workflow stays
# green — this lets the pipeline be merged before any runner exists.

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 18:00 UTC (~02:00 CST), off-peak.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to run for the benchmark job"
        default: "config.yaml"
        required: false

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gpu-smoke:
    name: GPU smoke (self-hosted ROCm)
    if: ${{ vars.ENABLE_GPU_CI == 'true' }}
    runs-on: [self-hosted, linux, rocm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Verifies the Docker image can see Python, ROCm tools, imports and GPU.
      - name: Docker environment smoke test
        run: make docker-smoke
      # Agent-login reuse; may need mounted credentials, so it is non-blocking.
      - name: Verify agent CLIs are reachable
        run: make docker-check-agents
        continue-on-error: true

  nightly-benchmark:
    name: Nightly benchmark (self-hosted ROCm)
    if: ${{ vars.ENABLE_GPU_CI == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, linux, rocm]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark in Docker
        run: make docker-run CONFIG=${{ github.event.inputs.config || 'config.yaml' }} RUN_ARGS="--run-suffix ci-nightly"
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-run-${{ github.run_id }}
          path: |
            logs/**
            workspace*/**
          if-no-files-found: ignore
          retention-days: 14
