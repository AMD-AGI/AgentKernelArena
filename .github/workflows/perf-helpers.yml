name: perf-helpers

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10" "PyYAML>=6,<7"
      - run: make check-perf-helpers
      - run: make check-forge
