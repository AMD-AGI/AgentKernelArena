name: benchmark-integrity

# Run the full audit once per PR revision; branch pushes would duplicate it.
# Use manual dispatch to audit a branch before opening a PR. Main keeps its
# post-merge audit, and a new PR revision cancels only the outdated PR run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-and-helper-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration regressions compare task sources with committed ancestors.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # The full source audit includes Python 3.12 syntax and AST fixtures.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/perf-helpers.yml
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml numpy matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run benchmark helper audit
        run: make check-perf-helpers
      - name: Run CPU and mock unit tests
        run: python -m pytest -q tests --durations=25
      - name: Compile Python sources
        run: python -m compileall -q src tasks tests
