name: codeql

# Static security & quality analysis (post-merge / scheduled).
# CodeQL publishes findings to the repository "Security" tab; by default it does
# not fail the build on findings, so it is safe to run on main and on a schedule.

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday 20:00 UTC.
    - cron: "0 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
