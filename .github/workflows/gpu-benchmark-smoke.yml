name: benchmark-gpu-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gpu-benchmark-smoke.yml"
      - "src/tools/perf/**"
      - "tasks/hip2hip/gpumode/**"
      - "tasks/hip2hip/others/matrix_multiplication/**"
      - "tasks/hip2hip/others/mla_decode/**"
      - "tests/test_gpu_graph_smoke.py"

jobs:
  rocm-graph-replay:
    # Enable AKA_GPU_CI_ENABLED after registering an isolated ROCm runner.
    # Manual dispatch remains available while the repository is being wired.
    if: github.event_name == 'workflow_dispatch' || vars.AKA_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, rocm, gfx950]
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: ${{ runner.temp }}/gpu-smoke-artifacts-${{ github.run_id }}
      SMOKE_ROOT: ${{ runner.temp }}/aka-gpu-smoke-${{ github.run_id }}
      ROCM_IMAGE: lmsysorg/sglang-rocm@sha256:b435b508b5aa696abb25c909341ce73e41574c4271cf716bed72418dcea86b78
    steps:
      - uses: actions/checkout@v4
      - name: Run protected GPU smoke suite in the pinned ROCm image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR" "$SMOKE_ROOT"
          docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            --device=/dev/kfd --device=/dev/dri \
            --group-add video --group-add render \
            --network none --read-only --security-opt=no-new-privileges \
            --cap-drop=ALL --pids-limit=4096 --shm-size=8g \
            --tmpfs /tmp:exec,size=8g \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$ARTIFACT_DIR:/artifacts" \
            -v "$SMOKE_ROOT:/work" \
            -w /repo "$ROCM_IMAGE" bash -s <<'CONTAINER'
          set -euo pipefail
          python -m pytest -vv -p no:cacheprovider tests/test_gpu_graph_smoke.py \
            | tee /artifacts/python-graph-smoke.log

          MATRIX_DIR=/work/matrix_multiplication
          MLA_DIR=/work/mla_decode
          cp -a tasks/hip2hip/others/matrix_multiplication "$MATRIX_DIR"
          cp -a tasks/hip2hip/others/mla_decode "$MLA_DIR"
          python - "$MATRIX_DIR" "$MLA_DIR" <<'PY'
          import sys
          from pathlib import Path
          from src.perf_helper_materialization import materialize_perf_helpers_in_workspace

          for task_dir in sys.argv[1:]:
              materialize_perf_helpers_in_workspace(Path(task_dir))
          PY
          hipcc -std=c++17 -Wall -Wextra \
            -I "$MATRIX_DIR/Common" \
            "$MATRIX_DIR/scripts/native/benchmark_driver.hip" \
            -o "$MATRIX_DIR/native_graph_benchmark"
          hipcc -O3 -ffast-math -munsafe-fp-atomics -std=c++17 \
            --offload-arch=gfx950 --offload-arch=gfx942 \
            "$MLA_DIR/scripts/native/benchmark_driver.hip" \
            -o "$MLA_DIR/native_graph_benchmark"

          "$MATRIX_DIR/native_graph_benchmark" \
            --A_rows 64 --A_cols 64 --B_cols 64 --samples 5 \
            | tee /artifacts/native-matrix.log
          "$MLA_DIR/native_graph_benchmark" \
            --batch 1 --ctx 32 --samples 5 \
            | tee /artifacts/native-mla.log
          grep -F '"benchmark_method":"cuda_graph"' /artifacts/native-*.log
          CONTAINER
      - name: Upload GPU smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gpu-smoke-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
