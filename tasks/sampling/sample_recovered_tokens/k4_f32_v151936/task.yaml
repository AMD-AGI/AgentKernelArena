schema_version: 3
description: >-
  Recovered-token sampling of speculative-decoding rejection sampling, Gumbel-max form. Request r owns
  the draft positions cu_num_draft_tokens[r-1] .. cu_num_draft_tokens[r]-1 (4 per request). For a
  position t of request r the recovered distribution is max(target_probs[t] - draft_probs[t], 0);
  recovered_token_ids[t] = argmax over the vocabulary of that value times inv_q[r], where inv_q is the
  reciprocal of a per-request exponential race (one noise row per request, shared by its positions).
  The unnormalized distribution is enough because argmax is scale-invariant. Ties would take the lowest
  token id; the generator keeps every case clear of ties and near-ties.
operator:
  name: sample_recovered_tokens
  category: sampling
interface:
  axes:
    n_reqs: {kind: var, min: 1, max: 512, description: Requests of the verification step.}
    spec_len: {kind: const, value: 4, description: Draft tokens per request.}
    vocab_size: {kind: const, value: 151936, description: Vocabulary size (Qwen2/Qwen3 family).}
  derived_axes:
    n_tokens: n_reqs * spec_len
  inputs:
    cu_num_draft_tokens:
      kind: tensor
      shape: [n_reqs]
      dtype: int32
      role: index
      distribution: {kind: generator}
      description: Inclusive prefix sum of the number of draft tokens of each request (spec_len each).
    draft_token_ids:
      kind: tensor
      shape: [n_tokens]
      dtype: int32
      role: index
      distribution: {kind: randint, low: 0, high: 151936}
      description: Draft token ids; not read when draft probabilities are given, but part of the call.
    draft_probs:
      kind: tensor
      shape: [n_tokens, vocab_size]
      dtype: float32
      role: activation
      distribution: {kind: generator}
      description: Draft model probabilities of every draft position.
    target_probs:
      kind: tensor
      shape: [n_tokens, vocab_size]
      dtype: float32
      role: activation
      distribution: {kind: generator}
      description: Target model probabilities of every draft position.
    inv_q:
      kind: tensor
      shape: [n_reqs, vocab_size]
      dtype: float32
      role: activation
      distribution: {kind: generator}
      description: Reciprocal of exponential(1) noise, one row per request.
  outputs:
    recovered_token_ids: {shape: [n_tokens], dtype: int32}
  mutable: []
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: vllm-project/vllm
    revision: edbc4969a76b25c531f7b9bb16b79984e65ef023
    path: vllm/v1/sample/rejection_sampler.py
    license: Apache-2.0
    modifications: >-
      Only sample_recovered_tokens_kernel and the launch of sample_recovered_tokens were taken from the
      file; the launcher writes into the preallocated output, the noise tensor is an input (production
      draws it with exponential_ and takes its reciprocal), imports of the vLLM triton shim were
      replaced by triton directly, and a run() entry was added. The kernel is unchanged.
compare:
  recovered_token_ids: {bound: exact}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
