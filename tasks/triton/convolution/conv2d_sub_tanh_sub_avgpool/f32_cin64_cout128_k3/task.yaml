schema_version: 3
description: >-
  out = avg_pool2d(tanh(conv2d(x, conv_weight, conv_bias) - subtract1_value) - subtract2_value, 2)
  on a float32 NCHW batch: a 3x3 convolution from 64 to 128 channels (stride 1, no padding, no
  dilation, one group, with bias), a scalar subtraction, tanh, a second scalar subtraction and a
  2x2 average pool with stride 2 (floor mode). Products and accumulation are float32 (no TF32/XF32).
operator:
  name: conv2d_sub_tanh_sub_avgpool
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 128, description: Images in the batch.}
    height: {kind: var, min: 4, max: 256, description: Input image height.}
    width: {kind: var, min: 4, max: 256, description: Input image width.}
    in_channels: {kind: const, value: 64, description: Input channels.}
    out_channels: {kind: const, value: 128, description: Output channels.}
    kernel_size: {kind: const, value: 3, description: Square filter size.}
    pool_size: {kind: const, value: 2, description: Average-pool window and stride.}
  derived_axes:
    pooled_height: (height - kernel_size + 1) // pool_size
    pooled_width: (width - kernel_size + 1) // pool_size
  inputs:
    x:
      kind: tensor
      shape: [batch, in_channels, height, width]
      dtype: float32
      distribution: {kind: uniform, low: 0.0, high: 1.0}
    conv_weight:
      kind: tensor
      shape: [out_channels, in_channels, kernel_size, kernel_size]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.041666666666666664, high: 0.041666666666666664}
    conv_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.041666666666666664, high: 0.041666666666666664}
    subtract1_value: {kind: scalar, dtype: float32, default: 0.5, description: Subtracted from the convolution output before tanh.}
    subtract2_value: {kind: scalar, dtype: float32, default: 0.2, description: Subtracted from tanh before pooling.}
  outputs:
    out: {shape: [batch, out_channels, pooled_height, pooled_width], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: pytorch/pytorch
    revision: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
    path: torch/_inductor/kernel/conv.py
    license: BSD-3-Clause
    modifications: >-
      Triton rewrite of the kernels torch.compile(mode="max-autotune") builds for this module with
      Inductor's Triton convolution template: one implicit-GEMM kernel whose float32 reduction runs
      over (input channel, filter row, filter column) in OIHW weight order with IEEE float32 dot
      products, with the bias, both subtractions, tanh (libdevice) and the 2x2 average pool fused into
      its epilogue (Inductor emits the pool as a second kernel over a materialized intermediate). The
      M tile covers one pooled output row (two convolution rows) of 32 pooled columns so the pool
      reduces in registers. Fixed tile configuration (128 x 64 x 32, 4 warps, 2 stages), no
      autotuning; wrapped in the arena run() interface writing the preallocated output.
compare:
  out: {bound: sqnr, min_db: 130}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
