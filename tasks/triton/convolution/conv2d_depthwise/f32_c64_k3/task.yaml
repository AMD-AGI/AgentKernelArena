schema_version: 3
description: >-
  Depthwise 2-D convolution of a float32 NCHW batch with 64 channels (KernelBench level 1 #82):
  out[n, c, h, w] = sum over i, j < 3 of x[n, c, h + i, w + j] * weight[c, 0, i, j]; square 3x3 kernel,
  stride 1, no padding, no bias, groups = channels, computed in float32.
operator:
  name: conv2d_depthwise
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 64, description: Images in the batch.}
    height: {kind: var, min: 3, max: 512, description: Input height.}
    width: {kind: var, min: 3, max: 512, description: Input width.}
    channels: {kind: const, value: 64, description: Input and output channels (one filter per channel).}
    kernel_size: {kind: const, value: 3, description: Square convolution kernel size.}
  derived_axes:
    out_height: height - kernel_size + 1
    out_width: width - kernel_size + 1
  inputs:
    x:
      kind: tensor
      shape: [batch, channels, height, width]
      dtype: float32
      distribution: {kind: uniform, low: 0.0, high: 1.0}
    weight:
      kind: tensor
      shape: [channels, 1, kernel_size, kernel_size]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.33333334, high: 0.33333334}
  outputs:
    out: {shape: [batch, channels, out_height, out_width], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: pytorch/pytorch
    revision: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
    path: torch/_inductor/kernel/templates/triton_depthwise_conv.py.jinja
    license: BSD-3-Clause
    modifications: >-
      Triton rewrite of TorchInductor's direct depthwise convolution template (one multiply-add per tap
      into a float32 tile accumulator), extended from 1-D channels-last to 2-D NCHW with one output tile
      of one (image, channel) plane per program and unrolled 3x3 taps; fixed tile configuration; standalone,
      writes the preallocated output.
compare:
  out: {bound: sqnr, min_db: 130}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
