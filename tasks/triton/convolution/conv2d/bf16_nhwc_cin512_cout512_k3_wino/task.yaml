schema_version: 3
description: >-
  Two-dimensional 3x3 convolution of a bfloat16 channels-last (NHWC) feature map, 512 input to 512 output channels,
  stride 1, padding 1, dilation 1, one group, with a float32 bias, computed with the Winograd F(4x4, 3x3) algorithm:
  out[n, p, q, o] = bias[o] + sum over r, s, c of x[n, p + r - 1, q + s - 1, c] * g[o, c, r, s], with zero padding,
  rounded to bfloat16. The filter g is passed already transformed to the Winograd domain,
  weight[6 * i + j, o, c] = (G g[o, c] G^T)[i, j] rounded to bfloat16, with the 6x3 matrix G of F(4x4, 3x3) given in
  README.md, so that the operator is a 3x3 convolution whose filters arrive in that domain.
operator:
  name: conv2d
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 64, description: Images in the batch.}
    height: {kind: var, min: 40, max: 160, description: Feature-map height (the output has the same height).}
    width: {kind: var, min: 40, max: 160, description: Feature-map width (the output has the same width).}
    in_channels: {kind: const, value: 512, description: Input channels.}
    out_channels: {kind: const, value: 512, description: Output channels.}
  inputs:
    x:
      kind: tensor
      shape: [batch, height, width, in_channels]
      dtype: bfloat16
      distribution: {kind: generator}
      description: NHWC feature map, contiguous (channels-last); SiLU of a standard normal, as after GroupNorm + SiLU.
    weight:
      kind: tensor
      shape: [36, out_channels, in_channels]
      dtype: bfloat16
      role: weight
      distribution: {kind: generator}
      description: Winograd-domain filters U[6 * i + j, o, c] = (G g[o, c] G^T)[i, j]; the logical filters g are the OIHW tensor [out_channels, in_channels, 3, 3].
    bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.014731391274719742, high: 0.014731391274719742}
      description: Per-output-channel bias, drawn like nn.Conv2d's default init (bound 1/sqrt(512 * 9)).
  outputs:
    out:
      shape: [batch, height, width, out_channels]
      dtype: bfloat16
      description: NHWC output, contiguous.
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: ROCm/aiter
    revision: 652f2d4b768239aefd515c929e84817681ff598d
    path:
      - aiter/ops/triton/conv/conv2d.py
      - aiter/ops/triton/conv/_launch.py
      - aiter/ops/triton/conv/_prepack.py
      - aiter/ops/triton/conv/_utils.py
      - aiter/ops/triton/utils/conv_config_utils.py
      - aiter/ops/triton/utils/_triton/kernel_repr.py
      - aiter/ops/triton/_triton_kernels/conv/conv_3x3_winograd_f4x3.py
      - aiter/ops/triton/_triton_kernels/conv/helpers.py
      - aiter/ops/triton/_triton_kernels/activation.py
      - aiter/ops/triton/configs/conv/gfx950-CONV-WINO-F4X3-GEMM.json
      - aiter/ops/triton/configs/conv/gfx950-CONV-WINO-F4X3-INPUT.json
      - aiter/ops/triton/configs/conv/gfx950-CONV-WINO-F4X3-OUTPUT.json
    license: MIT
    modifications: >-
      Kernels (input transform, batched GEMM, output transform), launcher (_launch_winograd_f4x3 and its grid helpers)
      and kernel_repr.py are unchanged; the three import lines of conv_3x3_winograd_f4x3.py are made
      package-relative. The dispatcher of conv2d.py is collapsed to its NHWC Winograd route and the call wrapped in
      run() (padding 1, no activation, bias given in float32). The filter transform prepack_winograd_filter_f4x3
      (done once per weight and cached by aiter) is the layout transform of this task; with 512 channels (a multiple
      of the 64-channel pack block) it adds no padding. The gfx950 tuned-config tables (single "any" entries) are
      inlined in conv_config_utils.py and the lookup reduced to gfx950. helpers.py keeps the autotune switch off and
      drops its environment-variable read. activation.py is an excerpt of four unchanged activation helpers.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
