schema_version: 3
description: >-
  Pointwise (1x1) two-dimensional convolution of a bfloat16 channels-last (NHWC) feature map, 512 input to 256 output
  channels, stride 1, no padding, one group, with a float32 bias:
  out[n, h, w, o] = bias[o] + sum over c of x[n, h, w, c] * weight[o, c], with float32 accumulation, rounded to
  bfloat16. The weight is passed as the [out_channels, in_channels] matrix of the 1x1 filters.
operator:
  name: conv2d
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 16, description: Images in the batch.}
    height: {kind: var, min: 8, max: 512, description: Feature-map height.}
    width: {kind: var, min: 8, max: 512, description: Feature-map width.}
    in_channels: {kind: const, value: 512, description: Input channels.}
    out_channels: {kind: const, value: 256, description: Output channels.}
  inputs:
    x:
      kind: tensor
      shape: [batch, height, width, in_channels]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
      description: NHWC feature map, contiguous (channels-last).
    weight:
      kind: tensor
      shape: [out_channels, in_channels]
      dtype: bfloat16
      role: weight
      distribution: {kind: generator}
      description: 1x1 filters; the logical OIHW tensor [out_channels, in_channels, 1, 1] flattened by the layout transform.
    bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.04419417382415922, high: 0.04419417382415922}
      description: Per-output-channel bias, drawn like nn.Conv2d's default init (bound 1/sqrt(512)).
  outputs:
    out:
      shape: [batch, height, width, out_channels]
      dtype: bfloat16
      description: NHWC output, contiguous.
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: ROCm/aiter
    revision: 652f2d4b768239aefd515c929e84817681ff598d
    path:
      - aiter/ops/triton/conv/conv2d.py
      - aiter/ops/triton/conv/_launch.py
      - aiter/ops/triton/conv/_utils.py
      - aiter/ops/triton/utils/conv_config_utils.py
      - aiter/ops/triton/utils/_triton/kernel_repr.py
      - aiter/ops/triton/_triton_kernels/conv/conv_1x1.py
      - aiter/ops/triton/_triton_kernels/conv/helpers.py
      - aiter/ops/triton/_triton_kernels/activation.py
      - aiter/ops/triton/configs/conv/gfx950-CONV-1X1.json
    license: MIT
    modifications: >-
      Kernel (_conv2d_1x1_kernel), launcher (_launch_1x1, _make_mn_grid) and kernel_repr.py are unchanged; the three
      import lines of conv_1x1.py are made package-relative. The dispatcher of conv2d.py is collapsed to its 1x1 route
      and the call wrapped in run() (NHWC layout, no activation, bias given in float32). The gfx950 tuned-config table
      (a single "any" entry) is inlined in conv_config_utils.py and the lookup reduced to gfx950. helpers.py keeps the
      autotune switch off and drops its environment-variable read. activation.py is an excerpt of four unchanged
      activation helpers. The weight squeeze to [out_channels, in_channels] that production does per call is the
      first step of the layout transform (the launcher's own squeeze then sees a 2-D view).
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
