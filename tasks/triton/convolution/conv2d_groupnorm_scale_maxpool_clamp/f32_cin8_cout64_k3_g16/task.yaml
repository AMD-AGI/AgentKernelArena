schema_version: 3
description: >-
  out = clamp(max_pool2d(group_norm(conv2d(x, conv_weight, conv_bias), 16 groups, gn_weight,
  gn_bias, epsilon) * scale, 4), clamp_min, clamp_max) on float32 NCHW images: a valid stride-1
  3x3 convolution from 8 to 64 channels, GroupNorm over 16 groups of 4 channels (mean and biased
  variance over the whole convolution output of the group), a per-channel scale, 4x4 max pooling
  with stride 4 (floor mode), and a clamp to [clamp_min, clamp_max].
operator:
  name: conv2d_groupnorm_scale_maxpool_clamp
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 128, description: Images in the batch.}
    height: {kind: var, min: 6, max: 256, description: Input image height.}
    width: {kind: var, min: 6, max: 256, description: Input image width.}
    in_channels: {kind: const, value: 8, description: Input channels.}
    out_channels: {kind: const, value: 64, description: Convolution output channels.}
    kernel_size: {kind: const, value: 3, description: Square convolution kernel size.}
    num_groups: {kind: const, value: 16, description: GroupNorm groups (4 channels each).}
    pool_size: {kind: const, value: 4, description: Max-pool window and stride.}
  derived_axes:
    pooled_height: (height - kernel_size + 1) // pool_size
    pooled_width: (width - kernel_size + 1) // pool_size
  inputs:
    x:
      kind: tensor
      shape: [batch, in_channels, height, width]
      dtype: float32
      distribution: {kind: uniform, low: 0.0, high: 1.0}
    conv_weight:
      kind: tensor
      shape: [out_channels, in_channels, kernel_size, kernel_size]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.11785, high: 0.11785}
    conv_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.11785, high: 0.11785}
    gn_weight:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: 0.2, high: 0.5}
    gn_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: normal, mean: 0.3, std: 0.15}
    scale:
      kind: tensor
      shape: [out_channels, 1, 1]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.4, high: 1.0}
    epsilon: {kind: scalar, dtype: float32, default: 1.0e-5}
    clamp_min: {kind: scalar, dtype: float32, default: 0.0}
    clamp_max: {kind: scalar, dtype: float32, default: 1.0}
  outputs:
    out: {shape: [batch, out_channels, pooled_height, pooled_width], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: pytorch/pytorch
    revision: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
    path: >-
      torch/_inductor/kernel/conv.py (conv2d_template);
      torch/_inductor/runtime/triton_helpers.py (welford_reduce, welford_combine, maximum, minimum)
    license: BSD-3-Clause
    modifications: >-
      Triton rewrite of the TorchInductor lowering of this module (torch.compile with the Triton
      convolution template): the conv2d implicit-GEMM template specialized to contiguous NCHW,
      stride 1, no padding, one group and a fixed block configuration, with the bias fused into
      its store and fp32 (ieee) dot products; a looped Welford GroupNorm-statistics kernel; and a
      fused normalize/affine/scale/max-pool/clamp pointwise kernel; wrapped in the arena run()
      interface.
compare:
  out: {bound: sqnr, min_db: 126}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
