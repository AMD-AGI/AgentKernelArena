schema_version: 3
description: >-
  Conv2d -> BatchNorm2d (inference) -> scale on a float32 NCHW batch (KernelBench level 2 #73):
  z = conv2d(x, conv_weight, conv_bias) with a 3x3 kernel, stride 1, no padding, 8 -> 64 channels;
  out = scaling_factor * ((z - bn_running_mean[c]) * rsqrt(bn_running_var[c] + bn_eps) * bn_weight[c]
  + bn_bias[c]), computed in float32.
operator:
  name: conv2d_batchnorm_scale
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 128, description: Images in the batch.}
    height: {kind: var, min: 3, max: 512, description: Input height.}
    width: {kind: var, min: 3, max: 512, description: Input width.}
    in_channels: {kind: const, value: 8, description: Input channels.}
    out_channels: {kind: const, value: 64, description: Output channels (BatchNorm features).}
    kernel_size: {kind: const, value: 3, description: Square convolution kernel size.}
  derived_axes:
    out_height: height - kernel_size + 1
    out_width: width - kernel_size + 1
  inputs:
    x:
      kind: tensor
      shape: [batch, in_channels, height, width]
      dtype: float32
      distribution: {kind: uniform, low: 0.0, high: 1.0}
    conv_weight:
      kind: tensor
      shape: [out_channels, in_channels, kernel_size, kernel_size]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.11785113, high: 0.11785113}
    conv_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.11785113, high: 0.11785113}
    bn_weight:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: 0.5, high: 1.5}
    bn_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.25, high: 0.25}
    bn_running_mean:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.25, high: 0.25}
    bn_running_var:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: 0.05, high: 0.25}
    bn_eps: {kind: scalar, dtype: float32, default: 1.0e-5}
    scaling_factor: {kind: scalar, dtype: float32, default: 2.0}
  outputs:
    out: {shape: [batch, out_channels, out_height, out_width], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: pytorch/pytorch
    revision: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
    path: torch/_inductor/kernel/conv.py
    license: BSD-3-Clause
    modifications: >-
      Triton rewrite of the kernel TorchInductor's max-autotune generates with its Triton convolution
      backend: the convolution2d template rendered for groups 1, stride 1, padding 0 with unrolled taps,
      IEEE float32 dots, and the fused epilogue (conv bias, torch._decomp inference batch norm with rsqrt,
      scale); one fixed tile configuration from Inductor's conv config list with the
      matrix_instr_nonkdim 16 of Inductor's ROCm config finalization; standalone, writes the
      preallocated output.
compare:
  out: {bound: sqnr, min_db: 126}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
