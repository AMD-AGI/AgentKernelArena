schema_version: 3
description: >-
  A float32 NCHW 3x3 convolution with bias (64 to 128 channels, stride 1, no padding, one group),
  then the Mish activation m = y * tanh(softplus(y)) (softplus threshold 20), then eval-mode
  BatchNorm2d with running statistics:
  out = (m - running_mean[c]) / sqrt(running_var[c] + eps) * bn_weight[c] + bn_bias[c].
  Convolution products and accumulation are float32.
operator:
  name: conv2d_act_batchnorm
  category: convolution
interface:
  axes:
    batch: {kind: var, min: 1, max: 128, description: Images in the batch.}
    height: {kind: var, min: 3, max: 256, description: Input image height.}
    width: {kind: var, min: 3, max: 256, description: Input image width.}
    in_channels: {kind: const, value: 64, description: Input channels.}
    out_channels: {kind: const, value: 128, description: Output channels (filters and batch-norm features).}
    kernel_size: {kind: const, value: 3, description: Square filter height and width.}
  derived_axes:
    out_height: height - kernel_size + 1
    out_width: width - kernel_size + 1
  inputs:
    x:
      kind: tensor
      shape: [batch, in_channels, height, width]
      dtype: float32
      distribution: {kind: uniform, low: 0.0, high: 1.0}
      description: NCHW input images, contiguous.
    conv_weight:
      kind: tensor
      shape: [out_channels, in_channels, kernel_size, kernel_size]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.041666666666666664, high: 0.041666666666666664}
      description: OIHW filters, drawn like nn.Conv2d's default init (bound 1/sqrt(64 * 3 * 3)).
    conv_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.041666666666666664, high: 0.041666666666666664}
      description: Convolution bias, drawn like nn.Conv2d's default init.
    bn_weight:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: 0.5, high: 1.5}
      description: Batch-norm scale (gamma).
    bn_bias:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: normal, mean: 0.0, std: 0.2}
      description: Batch-norm shift (beta).
    running_mean:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: normal, mean: 0.0, std: 0.2}
      description: Batch-norm running mean used in eval mode.
    running_var:
      kind: tensor
      shape: [out_channels]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: 0.05, high: 0.5}
      description: Batch-norm running variance used in eval mode (positive).
    eps: {kind: scalar, dtype: float32, default: 1.0e-5, description: Batch-norm epsilon.}
  outputs:
    out:
      shape: [batch, out_channels, out_height, out_width]
      dtype: float32
      description: NCHW output, contiguous.
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: pytorch/pytorch (Inductor convolution2d Triton template with a fused pointwise epilogue)
    revision: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
    path: >-
      torch/_inductor/kernel/conv.py (template); torch/_decomp/decompositions.py (eval-mode
      batch norm); torch/_refs/nn/functional/__init__.py (softplus)
    license: BSD-3-Clause
    modifications: >-
      Triton rewrite of the Inductor convolution2d template (non-unrolled path, groups 1) with the
      conv bias, softplus/tanh/multiply and eval-mode batch-norm pointwise ops fused into its
      epilogue, as Inductor's epilogue fusion would emit them, as a standalone @triton.jit kernel:
      Jinja placeholders replaced by kernel arguments and constexprs, store_output replaced by a
      strided NCHW store, ALLOW_TF32 replaced by input_precision="ieee", Inductor's INDEX_DTYPE
      choice kept as an int64 switch for tensors of 2**31 or more elements, and the autotuned tile
      configuration fixed to one ROCm conv config (128x128x32, 2 stages, 4 warps). Wrapped in the
      run() interface writing into the preallocated output.
compare:
  out: {bound: sqnr, min_db: 124.0}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
