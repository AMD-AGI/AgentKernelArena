schema_version: 3
description: >-
  Sort each row of a float32 matrix into ascending order along the last axis (1024 elements per row).
  The output holds exactly the input values, reordered.
operator:
  name: sort_rows
  category: sorting
interface:
  axes:
    n_rows: {kind: var, min: 1, max: 262144, description: Independent rows to sort.}
    row_size: {kind: const, value: 1024, description: Elements per row.}
  inputs:
    x:
      kind: tensor
      shape: [n_rows, row_size]
      dtype: float32
      distribution: {kind: generator}
  outputs:
    out: {shape: [n_rows, row_size], dtype: float32}
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: AMD AgentKernelArena triton2triton task rocmbench/medium/test_triton_sort
    revision: c1dc5e0904714703c10d0bdcf9a3bf132c77c073
    path: tasks/triton2triton/rocmbench/medium/test_triton_sort/test_triton_sort.py (sort_kernel)
    license: task-original
    modifications: >-
      Added a program-id row offset so one program sorts each row, fixed ascending order, and wrapped
      the kernel in the arena run() interface.
compare:
  out: {bound: exact}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
