schema_version: 3
description: >-
  Single-token (decode) grouped-query attention over vLLM's paged KV cache (ROCm layout),
  out[s, h] = softmax(scale * q[s, h] . K_s^T) . V_s, where K_s and V_s are the first seq_lens[s]
  tokens of sequence s and token t lives in page block_table[s, t // 16] at slot t % 16. Each of the
  4 query heads attends to the single KV head (head size 256). Keys are stored as
  key_cache[page, kv_head, d // 8, slot, d % 8] and values as value_cache[page, kv_head, d, slot].
  Slots past a sequence's length, unreferenced pages and the reserved page 0 hold NaN and must not
  affect the result; block_table entries past a sequence's last page are 0. Queries and the cache are
  bfloat16 and the result is rounded to bfloat16.
operator:
  name: paged_attention_decode
  category: attention
interface:
  axes:
    num_seqs: {kind: var, min: 1, max: 1024, description: Sequences decoded in the step (one query token each).}
    max_seq_len: {kind: var, min: 1, max: 32768, description: 'Longest context in the batch; the others are between half of it and all of it.'}
    num_query_heads: {kind: const, value: 4, description: Query heads per tensor-parallel rank.}
    num_kv_heads: {kind: const, value: 1, description: KV heads per tensor-parallel rank (group size 4).}
    head_size: {kind: const, value: 256, description: Head dimension of queries and the KV cache.}
    block_size: {kind: const, value: 16, description: Tokens per KV-cache page.}
    x: {kind: const, value: 8, description: Head-dimension elements per 16-byte key vector.}
  derived_axes:
    max_blocks_per_seq: ceil_div(max_seq_len, block_size)
    num_blocks: num_seqs * max_blocks_per_seq + 1
  inputs:
    query:
      kind: tensor
      shape: [num_seqs, num_query_heads, head_size]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
    key_cache:
      kind: tensor
      shape: [num_blocks, num_kv_heads, head_size // x, block_size, x]
      dtype: bfloat16
      role: state
      distribution: {kind: generator}
      description: Paged keys, element d of the token in (page, slot) at [page, kv_head, d // x, slot, d % x].
    value_cache:
      kind: tensor
      shape: [num_blocks, num_kv_heads, head_size, block_size]
      dtype: bfloat16
      role: state
      distribution: {kind: generator}
      description: Paged values, element d of the token in (page, slot) at [page, kv_head, d, slot].
    block_table:
      kind: tensor
      shape: [num_seqs, max_blocks_per_seq]
      dtype: int32
      role: index
      distribution: {kind: generator}
      description: Physical page of each logical 16-token block of a sequence; 0 past its last page.
    seq_lens:
      kind: tensor
      shape: [num_seqs]
      dtype: int32
      role: metadata
      distribution: {kind: generator}
      description: Context length of each sequence, in [1, max_seq_len].
    scale: {kind: scalar, dtype: float32, default: 0.0625, description: 'Softmax scale, head_size ** -0.5.'}
  outputs:
    out: {shape: [num_seqs, num_query_heads, head_size], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: vllm-project/vllm
    revision: edbc4969a76b25c531f7b9bb16b79984e65ef023
    path: vllm/v1/attention/ops/chunked_prefill_paged_decode.py
    license: Apache-2.0
    modifications: >-
      kernel_paged_attention_2d and cdiv_fn are unchanged. run() is the decode-only Triton branch of
      chunked_prefill_paged_decode with its production dispatch constants (TRITON_BLOCK_SIZE rule,
      padded query group of at least 16, no ALiBi, sliding window, sinks or FP8 output); since every
      sequence has one query token it launches with filter_by_query_len=False rather than reading an
      arange query_start_loc. The prefill branch, the ROCm custom-paged-attention branch and the vLLM
      platform/logger imports were removed; FP8_MIN/MAX use gfx950's float8_e4m3fn.
compare:
  out: {bound: baseline_relative, k: 4}  # re-tiled bf16 probabilities; see README.md "Comparison"
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
