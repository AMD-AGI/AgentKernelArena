schema_version: 3
description: >-
  Causal paged attention over a block-table KV cache, vLLM's Triton unified attention for mixed decode and
  chunked-prefill batches. Sequence s owns num_tokens/num_seqs = q_len consecutive query tokens
  (cu_seqlens_q is arange * q_len) and seqused_k[s] cached-plus-new KV tokens, with seqused_k[s] >= q_len.
  The cache is vLLM's packed layout: KV token j of the sequence lives in page block_table[s, j // 16], slot
  j % 16, and kv_cache[page, slot, kv_head, :head_dim] is its key, kv_cache[page, slot, kv_head, head_dim:]
  its value. Query token i of the sequence sits at absolute position seqused_k[s] - q_len + i and attends to
  every KV token at or before that position (a decode token sees the whole sequence). Query head h reads KV head h // 4.
  out = softmax(scale * q . k) @ v per query head, scale = head_dim ** -0.5, scores and accumulation in
  float32, result rounded to bfloat16. Block-table entries past a sequence's last page and cache slots past
  seqused_k are never read.
operator: {name: unified_attention, category: attention}
interface:
  axes:
    num_seqs: {kind: var, min: 1, max: 1024, description: Sequences in the batch.}
    q_len: {kind: var, min: 1, max: 8192, description: New query tokens of every sequence (1 is decode).}
    ctx_len: {kind: var, min: 1, max: 65536, description: "Longest KV length in the batch (cached plus new tokens); at least q_len."}
    num_q_heads: {kind: const, value: 32, description: Query heads.}
    num_kv_heads: {kind: const, value: 8, description: KV heads.}
    head_dim: {kind: const, value: 128, description: Head dimension.}
    block_size: {kind: const, value: 16, description: Tokens per KV-cache page.}
  derived_axes:
    num_tokens: num_seqs * q_len
    pages_per_seq: ceil_div(ctx_len, block_size)
    num_blocks: num_seqs * ceil_div(ctx_len, block_size)
  inputs:
    q:
      kind: tensor
      shape: [num_tokens, num_q_heads, head_dim]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 2.0}
    kv_cache:
      kind: tensor
      shape: [num_blocks, block_size, num_kv_heads, 2 * head_dim]
      dtype: bfloat16
      role: state
      distribution: {kind: normal, mean: 0.0, std: 1.0}
    cu_seqlens_q:
      kind: tensor
      shape: [num_seqs + 1]
      dtype: int32
      role: metadata
      distribution: {kind: generator}
    seqused_k:
      kind: tensor
      shape: [num_seqs]
      dtype: int32
      role: metadata
      distribution: {kind: generator}
    block_table:
      kind: tensor
      shape: [num_seqs, pages_per_seq]
      dtype: int32
      role: index
      distribution: {kind: generator}
  outputs:
    out: {shape: [num_tokens, num_q_heads, head_dim], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: vllm-project/vllm
    revision: edbc4969a76b25c531f7b9bb16b79984e65ef023
    path:
      - vllm/v1/attention/ops/triton_unified_attention.py
      - vllm/v1/attention/ops/triton_attention_helpers.py
    license: Apache-2.0
    modifications: >-
      Kernels and device helpers unchanged. The host side keeps the dispatch decisions (tile sizes, 2D versus
      3D plus reduce_segments, the TritonAttentionImpl segment count and sequence threshold) and is reduced to
      the bfloat16 causal path without sinks, alibi, qq-bias, softcap, mm-prefix, r-swa, chunked attention,
      fp8 or int4 caches or tensor descriptors, and wrapped in the run() interface: the packed kv_cache is
      split into K and V views, the 3D segment buffers are allocated per call, and max_seqlen_q comes from
      the tensor shapes. The vllm.envs, logger and platform imports are replaced by their gfx950 values.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support: {required_arch: [gfx950]}
