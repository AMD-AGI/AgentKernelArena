    license: MIT
    modifications: >-
      Kernels unchanged (_fused_gemm_a16w16_quant_x_kernel, _mxfp8_quant_op, _gemm_splitk_reduce_kernel). The launcher
      fused_gemm_a16w16_quant_x is reduced to the no-bias, no-activation, reduce-enabled path writing into the preallocated
      outputs (float32 split-K partials are allocated per call, as upstream); the N=256, K=7168 gfx950 table of the
      GEMM-A16W16 family is inlined as a function of M in the get_gemm_config lookup order, followed by the upstream
      compute_splitk_params; the remap_xcd, pid_grid and make_kernel_repr helpers are inlined; imports, the logger and
      the shape asserts are removed.
