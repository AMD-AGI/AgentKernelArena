schema_version: 3
description: >-
  out = gelu((x @ weight.T + bias) / divisor): a float32 linear layer from 8192 to 8192 features
  (nn.Linear, weight [out_features, in_features] row-major), the result divided by the scalar
  divisor and passed through the exact erf GELU, 0.5 * y * (1 + erf(y / sqrt(2))). Products and
  accumulation in IEEE float32 (no TF32 or reduced-precision inputs), output float32.
operator:
  name: matmul_div_gelu
  category: gemm
interface:
  axes:
    batch: {kind: var, min: 1, max: 16384, description: Rows of x and out.}
    in_features: {kind: const, value: 8192, description: Contracted dimension K.}
    out_features: {kind: const, value: 8192, description: Output features N.}
  inputs:
    x:
      kind: tensor
      shape: [batch, in_features]
      dtype: float32
      distribution: {kind: uniform, low: 0.0, high: 1.0}
    weight:
      kind: tensor
      shape: [out_features, in_features]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.011048543456039806, high: 0.011048543456039806}
    bias:
      kind: tensor
      shape: [out_features]
      dtype: float32
      role: weight
      distribution: {kind: uniform, low: -0.011048543456039806, high: 0.011048543456039806}
    divisor: {kind: scalar, dtype: float32, default: 10.0, description: Scalar the linear output is divided by.}
  outputs:
    out: {shape: [batch, out_features], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: pytorch/pytorch
    revision: d0f2af8b66b20da4baa50644c0cd3f887a2eae2e
    path:
      - torch/_inductor/kernel/templates/triton_mm.py.jinja
      - torch/_inductor/kernel/mm.py
      - torch/_inductor/kernel/mm_common.py
      - torch/_inductor/heuristics/template/triton.py
      - torch/_inductor/fx_passes/post_grad.py
      - torch/_inductor/lowering.py
      - torch/_refs/nn/functional/__init__.py
    license: BSD-3-Clause
    modifications: >-
      Triton rewrite of the kernel TorchInductor generates for this module under
      torch.compile(mode="max-autotune"): the mm template rendered as a standalone @triton.jit
      kernel for contiguous x and weight.T (N, K and strides constexpr, the batch a runtime size)
      with Inductor's fused store epilogue (the bias add of the unfused addmm, multiplication by
      the reciprocal of the divisor, exact erf GELU), the mm_grid launch grid, a fixed per-batch
      choice among three ROCm mm_configs entries (BLOCK_M clamped to the batch) instead of
      autotuning, allow_tf32=False expressed as input_precision="ieee", wrapped in the run()
      interface.
compare:
  out: {bound: baseline_relative, k: 8, max_violation_fraction: 5.0e-3}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
