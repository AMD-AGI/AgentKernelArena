schema_version: 3
description: >-
  out = dequant(a) @ dequant(b)^T with float8_e4m3fn activations a [m, 8192] carrying one float32 scale per 1x128
  group (a_scale [m, 64]) and float8_e4m3fn weights b [4096, 8192] carrying one float32 scale per 128x128
  block (b_scale [32, 64]), accumulated in float32 and rounded to bfloat16. Kernel-facing layouts
  as production holds them: b is preshuffled with the aiter 16x16 shuffle_weight permutation (logical [n, k] ->
  [n/16, k/32, 2, 16, 16] tiles, n index inside a tile of 16 rows and k split in 32-wide halves), and
  a_scale is the column-major payload of the activation-quantization kernel, a buffer of shape
  [k/128, m] presented as [m, k/128] (the scale of row i and group j is at flat offset j * m + i).
operator: {name: gemm_a8w8_blockscale, category: gemm}
interface:
  axes:
    m: {kind: var, min: 1, max: 16384, description: Rows of the activation matrix (tokens in the batch).}
    n: {kind: const, value: 4096, description: Output channels.}
    k: {kind: const, value: 8192, description: Contracted dimension.}
  inputs:
    a: {kind: tensor, shape: [m, k], dtype: float8_e4m3fn, distribution: {kind: generator}}
    a_scale: {kind: tensor, shape: [m, k // 128], dtype: float32, distribution: {kind: generator}}
    b: {kind: tensor, shape: [n, k], dtype: float8_e4m3fn, role: weight, distribution: {kind: generator}}
    b_scale: {kind: tensor, shape: [n // 128, k // 128], dtype: float32, role: weight,
              distribution: {kind: generator}}
  outputs:
    out: {shape: [m, n], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
reference: {file: reference.py, symbol: reference}
