schema_version: 3
description: >-
  out = (a * a_scale) @ (b * b_scale)^T with int8 activations a [m, 2048] carrying one float32 scale per 1x128
  token group (a_scale [m, 16]) and int8 weights b [7168, 2048] carrying one float32 scale per 128x128 block
  (b_scale [56, 16]). Each 128-wide K block of the integer product is scaled by its activation and weight scales
  and the blocks are summed in float32; the result is rounded to bfloat16.
operator: {name: gemm_a8w8_blockscale, category: gemm}
interface:
  axes:
    m: {kind: var, min: 1, max: 262144, description: Rows (tokens) of the activation matrix.}
    n: {kind: const, value: 7168, description: Output channels.}
    k: {kind: const, value: 2048, description: Contracted dimension.}
  inputs:
    a: {kind: tensor, shape: [m, k], dtype: int8, distribution: {kind: generator}}
    a_scale: {kind: tensor, shape: [m, k // 128], dtype: float32, distribution: {kind: generator}}
    b: {kind: tensor, shape: [n, k], dtype: int8, role: weight, distribution: {kind: generator}}
    b_scale: {kind: tensor, shape: [n // 128, k // 128], dtype: float32, role: weight,
              distribution: {kind: generator}}
  outputs:
    out: {shape: [m, n], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: vllm-project/vllm
    revision: edbc4969a76b25c531f7b9bb16b79984e65ef023
    path: vllm/model_executor/layers/quantization/utils/int8_utils.py
    license: Apache-2.0
    modifications: >-
      Kernel copied unchanged; the launcher keeps the default-configuration branch of w8a8_block_int8_matmul
      (no tuned config file exists for this device) and writes into the preallocated output instead of
      allocating it. Shape asserts and the tuned-config lookup are removed.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
