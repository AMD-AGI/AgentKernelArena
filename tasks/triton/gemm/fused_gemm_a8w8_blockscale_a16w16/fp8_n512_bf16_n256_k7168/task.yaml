schema_version: 3
description: >-
  Two GEMMs over the same tokens in one operator. y_a8w8 = dequant(x_fp8) @ dequant(w_fp8)^T with float8_e4m3fn
  activations x_fp8 [m, 7168] (one float32 scale per 1x128 block, x_fp8_scale [m, 56]) and float8_e4m3fn weights w_fp8
  [512, 7168] (one float32 scale per 128x128 block, w_fp8_scale [4, 56]); y_a16w16 = x_bf16 @ w_bf16^T with bfloat16
  activations [m, 7168] and weights [256, 7168]. Both accumulate in float32 and round to bfloat16, no bias.
operator: {name: fused_gemm_a8w8_blockscale_a16w16, category: gemm}
interface:
  axes:
    m: {kind: var, min: 1, max: 65536, description: Rows (tokens) shared by both GEMMs.}
    n_fp8: {kind: const, value: 512, description: Output channels of the block-scaled fp8 GEMM.}
    n_bf16: {kind: const, value: 256, description: Output channels of the bf16 GEMM.}
    k: {kind: const, value: 7168, description: Contracted dimension of both GEMMs.}
  inputs:
    x_fp8: {kind: tensor, shape: [m, k], dtype: float8_e4m3fn, distribution: {kind: generator}}
    x_fp8_scale: {kind: tensor, shape: [m, k // 128], dtype: float32, distribution: {kind: generator}}
    w_fp8: {kind: tensor, shape: [n_fp8, k], dtype: float8_e4m3fn, role: weight, distribution: {kind: generator}}
    w_fp8_scale: {kind: tensor, shape: [n_fp8 // 128, k // 128], dtype: float32, role: weight,
                  distribution: {kind: generator}}
    x_bf16: {kind: tensor, shape: [m, k], dtype: bfloat16, distribution: {kind: normal, mean: 0.0, std: 1.0}}
    w_bf16: {kind: tensor, shape: [n_bf16, k], dtype: bfloat16, role: weight,
             distribution: {kind: normal, mean: 0.0, std: 0.02}}
  outputs:
    y_a8w8: {shape: [m, n_fp8], dtype: bfloat16}
    y_a16w16: {shape: [m, n_bf16], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: ROCm/aiter
    revision: 652f2d4b768239aefd515c929e84817681ff598d
    path:
      - aiter/ops/triton/_triton_kernels/gemm/fused/fused_gemm_a8w8_blockscale_a16w16.py
      - aiter/ops/triton/gemm/fused/fused_gemm_a8w8_blockscale_a16w16.py
      - aiter/ops/triton/utils/_triton/pid_preprocessing.py
      - aiter/ops/triton/configs/gemm/gfx950-FUSED-GEMM-A8W8_BLOCKSCALE-A16W16-N8=512-N16=256-K=7168.json
    license: MIT
    modifications: >-
      Kernel and split-K reduce kernel unchanged. The launcher fused_gemm_a8w8_blockscale_a16w16 is reduced to the
      no-bias, reduce-enabled path writing into the preallocated outputs (the float32 split-K partials are allocated per
      call, as upstream); the shape-specialized gfx950 table is inlined as a function of M in the get_gemm_config lookup
      order; the remap_xcd and pid_grid helpers are inlined; imports, the logger and the shape asserts are removed. One field of
      the table is corrected: the M_LEQ_256 row has BLOCK_SIZE_K 256 upstream, but the kernel applies one activation/weight scale
      pair per BLOCK_SIZE_K tile and so requires BLOCK_SIZE_K == GROUP_K (128); the row now has 128, and the launcher asserts
      the equality for every row.
compare:
  y_a8w8: {bound: baseline_relative}
  y_a16w16: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
