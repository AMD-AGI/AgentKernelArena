schema_version: 3
description: >-
  Residual add followed by RMS normalization of each token row: residual_out = x + residual rounded to
  float16, out = residual_out * rsqrt(mean(residual_out^2) + epsilon) * weight with the mean taken over
  the hidden axis in high precision and the result rounded to float16.
operator:
  name: fused_add_rms_norm
  category: normalization
interface:
  axes:
    n_tokens: {kind: var, min: 1, max: 262144, description: Tokens in the batch.}
    hidden_size: {kind: const, value: 4096, description: Normalized width.}
  inputs:
    x:
      kind: tensor
      shape: [n_tokens, hidden_size]
      dtype: float16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
    residual:
      kind: tensor
      shape: [n_tokens, hidden_size]
      dtype: float16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
    weight:
      kind: tensor
      shape: [hidden_size]
      dtype: float16
      role: weight
      distribution: {kind: uniform, low: 0.5, high: 1.5}
    epsilon: {kind: scalar, dtype: float32, default: 1.0e-6}
  outputs:
    out: {shape: [n_tokens, hidden_size], dtype: float16}
    residual_out: {shape: [n_tokens, hidden_size], dtype: float16}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: ROCm/aiter
    revision: 652f2d4b768239aefd515c929e84817681ff598d
    path: aiter/ops/triton/_triton_kernels/normalization/rmsnorm.py and aiter/ops/triton/normalization/rmsnorm.py
    license: MIT
    modifications: >-
      Kernel copied unchanged (_fused_add_rmsnorm_kernel); the launcher (rmsnorm2d_fwd_with_add) is inlined
      into run() with the SM-count helper replaced by a device-properties query, and the rsigma scratch
      buffer is allocated per call as upstream does.
compare:
  out: {bound: baseline_relative}
  residual_out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
