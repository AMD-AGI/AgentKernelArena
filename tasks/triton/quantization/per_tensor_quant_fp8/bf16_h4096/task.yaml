schema_version: 3
description: >-
  Dynamic per-tensor FP8 quantization of a bfloat16 activation: scale = max|x| / 448 over the whole
  tensor, qx = float8_e4m3fn(x / scale) with round-to-nearest-even and saturation. Returns the codes
  and the single float32 scale.
operator:
  name: per_tensor_quant_fp8
  category: quantization
interface:
  axes:
    n_tokens: {kind: var, min: 1, max: 262144, description: Tokens in the batch.}
    hidden_size: {kind: const, value: 4096, description: Quantized width.}
  inputs:
    x:
      kind: tensor
      shape: [n_tokens, hidden_size]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
  outputs:
    qx: {shape: [n_tokens, hidden_size], dtype: float8_e4m3fn}
    scale: {shape: [1], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: ROCm/aiter
    revision: 652f2d4b768239aefd515c929e84817681ff598d
    path: aiter/ops/triton/quant/quant.py, aiter/ops/triton/_triton_kernels/quant/quant.py
    license: MIT
    modifications: >-
      Wrapped in the run() interface; the tensor amax scale is zeroed by an added one-thread Triton
      kernel (the evaluator poisons outputs), the amax is converted to float32 before the division, and
      tl.assume(pid > 0) was removed because program 0 violates it.
compare:
  qx: {bound: baseline_relative}
  scale: {bound: tolerance, atol: 0.0, rtol: 2.5e-7}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
