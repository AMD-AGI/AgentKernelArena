schema_version: 3
description: >-
  Output pass of chunked gated delta rule attention (Gated DeltaNet prefill) for one sequence of
  n_tokens tokens in chunks of 64 (the last may be partial), with 16 query/key heads, 32 value heads
  and head dimensions 128. For every value head and chunk, o = scale * (exp(g) * (q h^T) +
  (tril(q k^T * exp(g_i - g_j))) v), where h is the chunk's start-of-chunk state and g the chunk-local
  cumulative log-decay; the inter-chunk and intra-chunk terms accumulate in float32 and o is rounded
  to bfloat16.
operator:
  name: gdn_chunk_fwd_o
  category: state_space
interface:
  axes:
    n_tokens: {kind: var, min: 1, max: 131072, description: Tokens of the sequence.}
    num_k_heads: {kind: const, value: 16, description: Query/key heads (grouped-value-attention groups).}
    num_heads: {kind: const, value: 32, description: Value heads.}
    head_dim_k: {kind: const, value: 128, description: Query/key head dimension.}
    head_dim_v: {kind: const, value: 128, description: Value head dimension.}
    chunk_size: {kind: const, value: 64, description: Tokens per chunk.}
  derived_axes:
    n_chunks: ceil_div(n_tokens, chunk_size)
  inputs:
    q:
      kind: tensor
      shape: [1, n_tokens, num_k_heads, head_dim_k]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 0.08838834764831845}
      description: Queries, L2-normalized in the model (element standard deviation 128^-1/2).
    k:
      kind: tensor
      shape: [1, n_tokens, num_k_heads, head_dim_k]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 0.08838834764831845}
      description: Keys, L2-normalized in the model (element standard deviation 128^-1/2).
    v:
      kind: tensor
      shape: [1, n_tokens, num_heads, head_dim_v]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
      description: Delta-rule corrected values (the v_new of the chunk state pass).
    h:
      kind: tensor
      shape: [1, n_chunks, num_heads, head_dim_v, head_dim_k]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 0.3}
      description: Recurrent state at the start of every chunk (the h of the chunk state pass).
    g:
      kind: tensor
      shape: [1, n_tokens, num_heads]
      dtype: float32
      role: metadata
      distribution: {kind: generator}
      description: Chunk-local cumulative log-decay (non-positive, restarts every 64 tokens).
    scale: {kind: scalar, dtype: float32, default: 0.08838834764831845}
  outputs:
    o: {shape: [1, n_tokens, num_heads, head_dim_v], dtype: bfloat16}
  mutable: []
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: sgl-project/sglang
    revision: 887c401e151e2d1b082d74ef8769a23eef5c465c
    path: python/sglang/kernels/ops/attention/fla/chunk_o.py
    license: Apache-2.0 (contains MIT-licensed flash-linear-attention code, see baseline/LICENSE)
    modifications: >-
      chunk_fwd_kernel_o reduced to the fixed-length, scalar-gate path (the variable-length option
      and the host-side chunk-index preparation are not used) with the production tile (BK 128,
      BV 64, 4 warps, 2 stages); the host wrapper became run() writing into the preallocated output.
compare:
  o: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
