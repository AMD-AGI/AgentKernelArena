schema_version: 2
description: >-
  Optimize upstream AITER FP8 block-scaled MLP down GEMM for GLM5.3-Flash TP8,
  concurrency64, input8192/output1024, under the declared fixed-batch scenario.
  Cases are N4096 K1536 with prefill M8192 and decode M64; weights are
  configuration-derived, not observed scheduler frequencies.
kernel_identity:
  logical_operator: glm53_flash_fp8_mlp_down_gemm
  source_owner: aiter
instructions: [README.md]
platform_support:
  required_arch: gfx950
candidate:
  language: gpu
  initial_language: gpu
  initial_state: implemented
  editable:
    - {path: source, scope: tree}
  entrypoints:
    - {file: source/kernel.py, kind: function, symbol: mlp_down_gemm}
baseline:
  kind: provided
  language: gpu
  correctness_policy: required
  source_files: [upstream/aiter/ops/gemm_op_a8w8.py]
workspace:
  sources:
    - kind: git
      url: https://github.com/ROCm/aiter.git
      revision: 2cb3d17589b9253ea3b3ef5222fc7f810a8f3ef0
      destination: upstream
  setup:
    - [python3, scripts/runtime.py]
evaluation:
  runner: [python3, scripts/evaluate.py]
  workloads: workloads.json
  timeout_s: 3600
  aggregation:
    method: weighted_total_time
    case_weights:
      prefill_m8192_n4096_k1536: 64
      decode_m64_n4096_k1536: 1024
    source:
      path: frequency_provenance.json
      sha256: e868e72a0b96357d31d7f6f7de5408d94a851a05b74562b422c4872b178839e9
