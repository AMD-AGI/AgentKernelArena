schema_version: 2
description: >-
  Optimize the DeepSeek V4 Pro FP8 block-scaled dense linear call at the
  rank-0 layer-0 attention wqkv_a site (already-quantized fp8 activation with
  per-1x128 scales, 128x128 block-scaled GEMM against a load-time preshuffled
  weight, bf16 out) for TP8 EP1, concurrency64, input8192/output1024. Case
  frequencies and authentic inputs are bound to this site; correctness and
  performance use the protected workload contract.
kernel_identity:
  logical_operator: deepseek_v4_pro_fp8_blockscale_linear
  source_owner: aiter
instructions: [README.md]
platform_support:
  required_arch: gfx950
candidate:
  language: gpu
  initial_language: gpu
  initial_state: implemented
  editable:
    - {path: source, scope: tree}
  entrypoints:
    - {file: source/kernel.py, kind: function, symbol: fp8_blockscale_linear}
baseline:
  kind: provided
  language: gpu
  correctness_policy: required
  source_files: [upstream/aiter/ops/quant.py, upstream/aiter/ops/gemm_op_a8w8.py]
workspace:
  sources:
    - kind: git
      url: https://github.com/ROCm/aiter.git
      revision: 2cb3d17589b9253ea3b3ef5222fc7f810a8f3ef0
      destination: upstream
  setup:
    - [python3, scripts/runtime.py]
evaluation:
  runner: [python3, scripts/evaluate.py]
  workloads: workloads.json
  timeout_s: 3600
  aggregation:
    method: weighted_total_time
    case_weights:
      prefill_m8192_n2048_k7168_fp8in: 64
      decode_m64_n2048_k7168_fp8in: 1024
    source:
      path: frequency_provenance.json
      sha256: 6665561edc3724474df177013843686e842e58cee7260e55b6b8a0d519d969bb
