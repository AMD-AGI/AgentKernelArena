schema_version: 2
description: Optimize the declared Triton implementation of mla_decode, preserving
  the protected operator and output contracts.
candidate:
  language: triton
  initial_state: implemented
  editable:
  - path: kernel.py
    scope: symbols
    symbols:
    - _decode_grouped_att_m_fwd_rope
    - _decode_softmax_reducev_fwd
    allow_new_helpers: true
  entrypoints:
  - file: kernel.py
    kind: function
    symbol: _decode_grouped_att_m_fwd_rope
  - file: kernel.py
    kind: function
    symbol: _decode_softmax_reducev_fwd
baseline:
  kind: initial_candidate
  language: triton
evaluation:
  runner:
  - python3
  - _arena_eval.py
  workloads: workloads.json
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter/aiter/ops/triton
    destination: dependencies/aiter_triton
    exclude:
    - __pycache__
  setup:
  - - python3
    - _aiter_dependency.py
    - --check
