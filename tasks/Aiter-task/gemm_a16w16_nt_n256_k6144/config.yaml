schema_version: 2
description: Implement gemm_a16w16_nt_n256_k6144 in FlyDSL over every declared case.
instructions:
- README.md
kernel_identity:
  logical_operator: gemm_a16w16_nt_n256_k6144
  source_owner: aiter
candidate:
  language: flydsl
  initial_state: unimplemented
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_gemm_a16w16_nt_n256_k6144_module
baseline:
  kind: provided
  source_files:
  - aiter_source/aiter/tuned_gemm.py
  correctness_policy: diagnostic
  diagnostic_reason: >-
    MI355X/gfx950 validation on 2026-10-09, request
    935989825de94f69b57ddb6f4314e058, completed all 13 baseline cases with
    image sha256:e20849665c105d389ef91d23c0dc73931aaa6f02056dd10e7b43e4f16c79df69.
    Nine cases (M=4 through M=1024) had finite numerical mismatches and all
    output contracts passed. README.md gives the per-case results and distinguishes
    this capture from the seven-case 2026-09-30 observation on image
    sha256:b435b508b5aa696abb25c909341ce73e41574c4271cf716bed72418dcea86b78.
    The completed correctness action supplies the numerical diagnostic evidence.
    Retain baseline numerical and timed-replay diagnostics; compilation,
    execution, coverage and output-contract errors are not exempt.
    Candidate correctness and timed replay retain the full original gate.
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter/aiter
    destination: aiter_source/aiter
    exclude:
    - jit/build
    - jit/flydsl_cache
    - __pycache__
evaluation:
