schema_version: 2
description: Implement gemm_a16w16_nt_n256_k6144 in FlyDSL over every declared case.
instructions:
- README.md
kernel_identity:
  logical_operator: gemm_a16w16_nt_n256_k6144
  source_owner: aiter
candidate:
  language: flydsl
  initial_state: unimplemented
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_gemm_a16w16_nt_n256_k6144_module
baseline:
  kind: provided
  source_files:
  - aiter_source/aiter/tuned_gemm.py
  correctness_policy: diagnostic
  diagnostic_reason: >-
    MI355X/gfx950 job 181463 on 2026-09-30 completed all 13 baseline cases with
    image sha256:b435b508b5aa696abb25c909341ce73e41574c4271cf716bed72418dcea86b78.
    Seven cases (M=4 through M=256) had finite numerical mismatches and all
    output contracts passed. README.md gives the per-case results, validation
    request identity and pinned-image reproduction commands. The current
    captured correctness action supplies the evidence; the older nine-case
    observation in README.md used a different image and is historical context.
    Retain baseline numerical and timed-replay diagnostics; compilation,
    execution, coverage and output-contract errors are not exempt.
    Candidate correctness and timed replay retain the full original gate.
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter/aiter
    destination: aiter_source/aiter
    exclude:
    - jit/build
    - jit/flydsl_cache
    - __pycache__
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workload.json
  timeout_s: 3600
  baseline:
    correctness:
      timeout_s: 1800
  candidate:
    correctness:
      timeout_s: 1800
platform_support:
  required_arch: gfx950
  status: active
exports:
- format: sikl-solution
  output: artifacts/solution.json
  command:
  - python3
  - scripts/export_solution.py
  timeout_s: 60
