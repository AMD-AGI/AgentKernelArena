  - python3
  - scripts/evaluate.py
  workloads: workload.json
  timeout_s: 3600
  baseline:
    correctness:
      timeout_s: 1800
  candidate:
    correctness:
      timeout_s: 1800
platform_support:
  required_arch: gfx950
  status: active
exports:
- format: sikl-solution
