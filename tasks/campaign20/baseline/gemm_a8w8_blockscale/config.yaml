source_file_path:
  - aiter/ops/triton/gemm/gemm_a8w8_blockscale.py

target_kernel_functions:
  - gemm_a8w8_blockscale

compile_command:
  - python3 scripts/task_runner.py compile

correctness_command:
  - python3 scripts/task_runner.py correctness

performance_command:
  - python3 scripts/task_runner.py performance

task_type: triton2triton

task_result_template: null

prompt:
  source_code: null
  instructions: |
    Optimize the MiniMax-M2.5 a8w8 block-scale FP8 GEMM used by the attention
    projections (qkv_proj K=3072 N=4096; o_proj K=3072 N=3072; M = prefill
    tokens 2048..17920).

    The production kernel is a hand-written aiter ASM kernel
    (`gemm_a8w8_blockscale_bpreshuffle_asm`, source
    aiter/csrc/py_itfs_cu/asm_a8w8_blockscale_bpreshuffle.cu). The ASM `.co`
    cannot be rebuilt, so the optimization entry is the **Triton equivalent**:
      aiter/ops/triton/gemm/gemm_a8w8_blockscale.py
    A/B the Triton candidate against the ASM baseline measured by the harness.

    Dtypes: fp8 e4m3fnuz in, 128x128 weight block scale + per-1x128 activation
    scale, B-preshuffle (16,16), x_scale stored transposed, output bf16
    (cast to fp16 downstream).

    Levers: MFMA tile/pipeline tuning for N in {4096,3072} at large M;
    blockscale dequant kept in registers in the MFMA loop; K-split / wave
    scheduling (K=3072=24x128); efficient bf16 epilogue.

    Constraints:
      - Reference = dequant + F.linear; correctness gate err_ratio <= 0.20 and
        cos_diff < 0.02 (fp8 block-scale tolerance).
      - Requires an environment with aiter installed (set GEAK_REPO_ROOT to the
        aiter source tree; default /sgl-workspace/aiter).
      - NOTE: as shipped, the harness measures the ASM baseline (the bar to
        beat). To score a Triton candidate, point the harness's run_kernel at
        the Triton entry above.
  cheatsheet: null

