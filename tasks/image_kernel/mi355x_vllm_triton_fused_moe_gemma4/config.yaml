schema_version: 2
description: Optimize the existing triton implementation; preserve the task-local operator and workload
  contracts.
candidate:
  language: triton
  initial_state: implemented
  editable:
  - vllm_fused_moe/fused_moe.py
  entrypoints:
  - file: vllm_fused_moe/fused_moe.py
    kind: function
    symbol: fused_moe_kernel
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe
    destination: vllm_fused_moe
    exclude:
    - __pycache__
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
kernel_identity:
  logical_operator: fused_moe
  source_owner: vllm
instructions:
- README.md
