prompt:
  source_code: null
  instructions: >-
    Optimize Kimi-K3 KDA (Kimi Delta Attention) linear attention on MI355X/gfx950.
    KDA is the Triton-JIT gated-delta-rule path used by K3's 69 linear-attention
    layers. The kernels are vendored per GPU vendor; the ROCm copy that
    kimi_gdn_linear_attn.py selects lives in models/kimi_k3/amd/ops/third_party/kda/
    (chunk.py, chunk_intra.py, chunk_intra_token_parallel.py, fused_recurrent.py)
    plus the shared FLA ops under third_party/flash_linear_attention/ops/.
    Two entry points are timed: fused_recurrent_kda_packed_decode (decode hot
    kernel k007, fused_recurrent_kda_packed_decode_kernel) and
    chunk_kda_with_fused_gate (the prefill chunk-KDA kernel group). Do NOT
    retarget anything at fused_recurrent_kda: that is the speculative-decode entry
    and K3 never executes it (num_nextn_predict_layers=0).
    Dims are the session's per-rank TP=8 shapes: num_heads=12, head_dim=128
    (d_k=d_v), chunk_size=64, gate_lower_bound=-5.0. That lower bound selects the
    safe-gate branch gate = -5.0 * sigmoid(exp(A_log) * (raw_g + dt_bias)) rather
    than the softplus branch, and raw_beta arrives pre-sigmoid because both kernels
    apply sigmoid internally. session_cases.json carries the session's real packed
    prefill token counts (7211 and 1080) plus long-sequence headroom up to T=32768.
    Correctness is numerical parity against an independent float64 golden
    (cos > 0.999 and normalized max error < 0.03). Preserve all correctness cases
    and improve the CUDA-graph measured performance, especially at long sequence
    length. Keep the public signatures of fused_recurrent_kda_packed_decode and
    chunk_kda_with_fused_gate unchanged.
  cheatsheet: null
