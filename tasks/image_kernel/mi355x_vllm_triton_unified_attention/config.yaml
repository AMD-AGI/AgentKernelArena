schema_version: 2
description: Optimize the existing triton implementation; preserve the task-local operator and workload
  contracts.
candidate:
  language: triton
  initial_state: implemented
  editable:
  - aiter/ops/triton/_triton_kernels/attention/unified_attention.py
  - aiter/ops/triton/attention/unified_attention.py
  entrypoints:
  - file: aiter/ops/triton/attention/unified_attention.py
    kind: function
    symbol: unified_attention
  - file: aiter/ops/triton/attention/unified_attention.py
    kind: function
    symbol: select_3d_config
  - file: aiter/ops/triton/attention/unified_attention.py
    kind: function
    symbol: use_2d_kernel
  - file: aiter/ops/triton/_triton_kernels/attention/unified_attention.py
    kind: function
    symbol: kernel_unified_attention_2d
  - file: aiter/ops/triton/_triton_kernels/attention/unified_attention.py
    kind: function
    symbol: kernel_unified_attention_3d
  - file: aiter/ops/triton/_triton_kernels/attention/unified_attention.py
    kind: function
    symbol: reduce_segments
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter/aiter
    destination: aiter
    exclude:
    - jit/build
    - jit/flydsl_cache
  - kind: image
    image_path: /sgl-workspace/aiter
    destination: aiter_meta
    exclude:
    - aiter/jit/build
    - aiter/jit/flydsl_cache
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
kernel_identity:
  logical_operator: unified_attention_with_output
  source_owner: aiter
instructions:
- README.md
