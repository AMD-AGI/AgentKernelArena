schema_version: 2
description: Optimize the existing tilelang implementation; preserve the task-local operator and
  workload contracts.
candidate:
  language: tilelang
  initial_state: implemented
  editable:
  - mhc/tilelang.py
  entrypoints:
  - file: mhc/tilelang.py
    kind: function
    symbol: mhc_fused_post_pre_tilelang
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/kernels/mhc
    destination: mhc
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
kernel_identity:
  logical_operator: mhc_fused_post_pre
  source_owner: vllm
instructions:
- README.md
