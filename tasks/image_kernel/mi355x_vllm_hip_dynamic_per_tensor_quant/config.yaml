schema_version: 2
description: Optimize the existing hip implementation; preserve the task-local operator and workload
  contracts.
candidate:
  language: hip
  initial_state: implemented
  editable:
  - aiter_meta/csrc/kernels/quant_kernels.cu
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /usr/local/lib/python3.12/dist-packages/aiter_meta
    destination: aiter_meta
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
kernel_identity:
  logical_operator: dynamic_per_tensor_quant
  source_owner: aiter
instructions:
- README.md
