schema_version: 2
description: Optimize the existing hip implementation; preserve the task-local operator and workload
  contracts.
candidate:
  language: hip
  initial_state: implemented
  editable:
  - aiter_meta/csrc/cpp_itfs/pa/pa_kernels.cuh
  - aiter_meta/csrc/cpp_itfs/pa/pa.cuh
  - aiter_meta/csrc/cpp_itfs/pa/pa_common.cuh
  - aiter_meta/csrc/cpp_itfs/pa/pa.cpp.jinja
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter/aiter
    destination: aiter
    exclude:
    - jit/build
    - jit/flydsl_cache
  - kind: image
    image_path: /sgl-workspace/aiter
    destination: aiter_meta
    exclude:
    - aiter/jit/build
    - aiter/jit/flydsl_cache
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
kernel_identity:
  logical_operator: paged_attention_rocm
  source_owner: aiter
instructions:
- README.md
