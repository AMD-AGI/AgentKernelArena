schema_version: 2
description: Optimize the existing hip implementation; preserve the task-local operator and workload
  contracts.
candidate:
  language: hip
  initial_state: implemented
  editable:
  - aiter/csrc/py_itfs_ck/mha_batch_prefill_kernels.cu
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter
    destination: aiter
    exclude:
    - aiter/jit/build
    - aiter/jit/flydsl_cache
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
instructions:
- README.md
