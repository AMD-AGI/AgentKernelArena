  instructions: Optimize the Triton decode paged-attention kernel kernel_paged_attention_2d
    (in chunked_prefill_paged_decode.py) on MI355X/gfx950. This kernel is the vLLM
    ROCm fallback path taken when head_size is not 64/128 (here head_size=256, GQA
    4:1, BF16), so the fast hand-written ROCm asm paged-attention does not apply and
    this Triton kernel dominates decode. The harness cases are reconstructed from
    the Qwen3.5-122B-A10B-FP8 Hyperloom 2026-07-24 session and stored in
    session_cases.json. Preserve all correctness cases and improve CUDA-graph
    measured performance. Do not change the public signature of
    chunked_prefill_paged_decode or kernel_paged_attention_2d.
