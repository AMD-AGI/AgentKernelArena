schema_version: 2
description: >-
  Optimize FlyDSL Kimi-K3 routed-expert MoE on the fixed synthetic workloads
  declared in workloads.json: M=7211 and M=62, with twelve additional
  correctness-only M buckets. Preserve the full operator, numerical and timing
  contracts. The protected case parameters define the scored problem.
  Historical kernel IDs provide provenance; the exact original decode-graph M
  is unknown, and these synthetic inputs make no historical trace-replay claim.
candidate:
  language: flydsl
  initial_state: implemented
  editable:
  - aiter/aiter/fused_moe.py
  - aiter/aiter/ops/flydsl/moe_kernels.py
  - aiter/aiter/ops/shuffle.py
  - aiter/aiter/configs/model_configs/kimik3_fp4_tuned_fmoe.csv
  - aiter/aiter/ops/flydsl/kernels/mixed_moe_gemm_2stage.py
  entrypoints:
  - file: aiter/aiter/fused_moe.py
    kind: function
    symbol: fused_moe
  - file: aiter/aiter/fused_moe.py
    kind: function
    symbol: _flydsl_stage1_wrapper
  - file: aiter/aiter/fused_moe.py
    kind: function
    symbol: _flydsl_stage2_wrapper
baseline:
  kind: initial_candidate
  correctness_policy: required
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter
    destination: aiter
    exclude:
    - __pycache__
    - aiter/jit/flydsl_cache
    - jit/build
  setup:
  - - python3
    - scripts/setup_task.py
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workloads.json
  timeout_s: 3600
  baseline:
    compile:
      timeout_s: 1800
    correctness:
      timeout_s: 3600
    performance:
      timeout_s: 1800
  candidate:
    compile:
      timeout_s: 1800
    correctness:
      timeout_s: 3600
    performance:
      timeout_s: 1800
kernel_identity:
  logical_operator: aiter_mxfp4_moe_2stage
  source_owner: aiter
platform_support:
  required_arch: gfx950
  status: active
instructions:
- README.md
