task_type: image_kernel
image_repo_path: /usr/local/lib/python3.12/dist-packages/aiter
repo_subdir: aiter
image_repo_exclude:
- __pycache__
- jit/build
# The compute cores are FlyDSL (flydsl_moe1_* / flydsl_moe2_*) and the edit
# surface includes ops/flydsl/moe_kernels.py. Must be one of the keys under
# `knowledge` in src/prompts/cheatsheet/default_cheatsheet.yaml (flydsl/hip/triton),
# which is also forge's fellow set -- 'python' hard-fails prompt_builder and makes
# forge fall back to the wrong fellow.
repository_language: flydsl
source_file_path:
- fused_moe.py
- ops/flydsl/moe_kernels.py
- ops/shuffle.py
editable_sources:
- configs/model_configs/kimik3_fp4_tuned_fmoe.csv
- ops/flydsl/kernels/mixed_moe_gemm_2stage.py
target_kernel_functions:
- fused_moe
- _flydsl_stage1_wrapper
- _flydsl_stage2_wrapper
kernel_identity:
  logical_operator: aiter_mxfp4_moe_2stage
  kernel_kind: flydsl
  source_owner: aiter
  workload:
    source: session_cases.json
    primary_case: kimi-k3-prefill-flydsl-k003-k006
compile_command:
- python3 scripts/task_runner.py compile
correctness_command:
- python3 scripts/task_runner.py correctness
performance_command:
- python3 scripts/task_runner.py performance
compile_timeout: 1800
correctness_timeout: 3600
performance_timeout: 1800
task_result_template: null
platform_support:
  required_arch: gfx950
  status: active
  skip_reason: null
prompt:
  source_code: null
  instructions: >-
    Faithful reproduction of the Kimi-K3 routed-expert MoE 2-stage GEMM as it
    actually executed in Hyperloom session 20260728T091437Z on MI355X/gfx950. This
    is the aiter MoE path behind hot kernels k001 (moe_gemm1_0, decode-graph stage1
    gate/up), k002 (moe_gemm2_0, decode-graph stage2 down), k003
    (moe_flydsl_stage1) and k006 (moe_flydsl_stage2, eager/prefill FlyDSL).
    Config: bf16 activation x fp4 (mxfp4-pack, group_size=32 -> QuantType.per_1x32)
    weight, g1u1, SiTUv2 activation with beta=4.0 / linear_beta=25.0, per-rank
    (TP=8) dims model_dim=3584 / inter_dim=384 / experts=896 / topk=16. Exact
    shapes and dtypes are trace-recorded in session_cases.json (from the forge
    invocation_spec); the harness reproduces the session's own FlyDSL kernel
    dispatch for both M buckets.
    The compute core is a FlyDSL MLIR builder
    (ops/flydsl/kernels/mixed_moe_gemm_2stage.py, compile_mixed_moe_gemm1_a16w4 /
    compile_mixed_moe_gemm2_a16w4) and is part of this task's edit surface. The
    full edit surface also includes the tuned Kimi-K3 CSV and the aiter Python
    dispatch in fused_moe.py, ops/flydsl/moe_kernels.py, and ops/shuffle.py.
    Useful levers are the MFMA pipeline, tile/block loop structure, LDS usage,
    stage2 atomic reduction, 2-stage kernel selection, and tuned-config lookup.
    The 864 a16w4 variants are keyed by tile_m/tile_n/tile_k plus
    w*/bnt*/xcd*/kw* suffixes. Preserve the per-M-bucket dispatch contract,
    block_m / ksplit semantics, and moe_sorting behavior. Do not edit the harness.
    The harness enforces five invariants that a valid patch must keep: correctness
    and performance must dispatch the same FlyDSL kernel pair; dispatch must stay
    on the tuned path rather than the heuristic fallback; w2_scale must use the
    same e8m0_shuffle path as vLLM; nLane must stay 16 (vLLM hardcodes it); and
    correctness is the worst of 3 runs because stage2 reduces with atomics. All
    14 reachable M buckets are correctness-checked.
    Two contract details that must be preserved: K3's SiTU a16w4 path runs
    GateMode.SEPARATED, so weights and scales are shuffled with gate_up=False
    (gate_up=True is the gpt-oss INTERLEAVE layout and silently produces garbage);
    and the SiTUv2 beta/linear_beta must stay at the session values, since aiter's
    kernel and torch-reference defaults disagree with each other and with K3.
    Correctness compares against aiter's dequantized torch_moe_stage1/stage2
    reference. Preserve all correctness cases and improve the CUDA-graph measured
    performance.
  cheatsheet: null
