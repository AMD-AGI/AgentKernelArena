schema_version: 2
description: "Optimize the FlyDSL Paged Attention Decode FP8 kernel for AMD MI300X GPU.\nThe kernel implements\
  \ paged KV-cache attention decode with FP8 quantized\nkeys/values, MFMA-based dot products, online softmax,\
  \ multi-partition\nreduce, and supports both one-shot and split-reduce modes.\nYou MUST keep the kernel\
  \ in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: compile_pa_decode_ps
  - file: kernel.py
    kind: function
    symbol: get_pa_metadata
  - file: kernel.py
    kind: function
    symbol: get_sw_ps_max_context_partition_num
  - file: kernel.py
    kind: function
    symbol: pa_decode_ps_launch
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
