schema_version: 2
description: "Optimize the FlyDSL blockscale preshuffle FP8 GEMM for AMD MI300X-class CDNA GPUs\n(per-block\
  \ scales, MFMA, optional async copy on supported arch).\nYou MUST keep the kernel in FlyDSL \u2014 do\
  \ NOT rewrite it in HIP, CUDA, or Triton.\nYou MUST NOT add FastLauncher, ctypes dispatch bypass, _call_state_cache\
  \ extraction,\nor any wrapper that bypasses JitFunction.__call__. Only optimize the GPU kernel\ncomputation\
  \ itself."
