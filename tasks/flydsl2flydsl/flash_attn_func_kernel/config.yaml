schema_version: 2
description: "Optimize the FlyDSL Flash Attention kernel for AMD MI300X GPU.\nThe\
  \ kernel implements fused multi-head attention with online softmax,\nMFMA32 register-level\
  \ GEMM, XOR-swizzled LDS, and DMA-to-LDS prefetch.\nIt supports causal masking,\
  \ f16/bf16 data types, and auto tile selection.\nYou MUST keep the kernel in FlyDSL\
  \ \u2014 do NOT rewrite it in HIP, CUDA, or Triton."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_flash_attn_func_module_primary
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
platform_support:
  required_arch: [gfx942, gfx950]
  status: active
