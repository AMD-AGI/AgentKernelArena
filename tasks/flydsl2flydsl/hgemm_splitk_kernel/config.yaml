schema_version: 2
description: "Optimize the FlyDSL HGEMM SplitK kernel for AMD MI300X GPU.\nThe kernel implements high-performance\
  \ half-precision GEMM with split-K\nparallelism, MFMA-based wave-level matrix multiply, double-buffered\
  \ LDS\nwith XOR swizzle, DMA-to-LDS async copy, and pre-shuffled B matrix layout.\nYou MUST keep the\
  \ kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: compile_hgemm_kernel
  - file: kernel.py
    kind: function
    symbol: hgemm_splitk_
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
