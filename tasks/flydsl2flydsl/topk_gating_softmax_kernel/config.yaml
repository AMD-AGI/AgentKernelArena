schema_version: 2
description: "Optimize the FlyDSL fused TopK gating softmax kernel for AMD MI300X-class CDNA GPUs.\nThe\
  \ kernel fuses softmax over expert logits, top-K expert selection, optional\nrenormalization of weights,\
  \ and token_expert_indices in FlyDSL.\nYou MUST keep the kernel in FlyDSL \u2014 do NOT rewrite it in\
  \ HIP, CUDA, or Triton.\nYou MUST NOT add FastLauncher, ctypes dispatch bypass, _call_state_cache extraction,\n\
  or any wrapper that bypasses JitFunction.__call__. Only optimize the GPU kernel\ncomputation itself\
  \ (e.g. tile sizes, vectorization, memory access patterns, math)."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_topk_gating_softmax_module
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
platform_support:
  required_arch: [gfx942, gfx950]
  status: active
