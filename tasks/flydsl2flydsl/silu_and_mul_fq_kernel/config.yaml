schema_version: 2
description: >-
  Optimize the declared FlyDSL SiLU-times-up MXFP4 workload with BF16 inputs,
  inter_dim=1024, topk=2, input-order payload and sorted-position block scales.
  Preserve the five scored cases in cases.json, the builder interface, and all numerical and timing
  rules documented in README.md. Keep the GPU computation in FlyDSL; do not
  add FastLauncher, ctypes dispatch, _call_state_cache extraction, or wrappers
  that bypass JitFunction.__call__.
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_silu_and_mul_fq_module
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
platform_support:
  required_arch: [gfx942, gfx950]
  status: active
