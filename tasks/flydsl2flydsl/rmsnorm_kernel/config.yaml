schema_version: 2
description: "Optimize the FlyDSL RMSNorm kernel for AMD MI300X and MI355X GPUs.\nThe kernel computes RMSNorm: y =\
  \ x / sqrt(mean(x^2) + eps) * gamma\nusing float32 accumulation for numerical stability.\nYou MUST keep\
  \ the kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_rmsnorm_module
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
