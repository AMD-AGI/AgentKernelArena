schema_version: 2
description: "Optimize the FlyDSL LayerNorm kernel for AMD MI300X GPU.\nThe kernel computes LayerNorm:\
  \ y = (x - mean) / sqrt(var + eps) * gamma + beta\nusing float32 accumulation for numerical stability.\n\
  You MUST keep the kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton."
