schema_version: 2
description: "Optimize the FlyDSL MoE token sorting kernels for AMD MI300X-class CDNA GPUs\n(oneshot and\
  \ multiphase paths). The kernel packs expert-grouped token indices\nand weights for downstream grouped\
  \ GEMM.\nYou MUST keep the kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton.\nYou MUST\
  \ NOT add FastLauncher, ctypes dispatch bypass, _call_state_cache extraction,\nor any wrapper that bypasses\
  \ JitFunction.__call__. Only optimize the GPU kernel\ncomputation itself (e.g. tile sizes, vectorization,\
  \ memory access patterns, math)."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: compile_moe_sorting
  - file: kernel.py
    kind: function
    symbol: moe_sorting_flydsl
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
platform_support:
  required_arch: [gfx942, gfx950]
  status: active
