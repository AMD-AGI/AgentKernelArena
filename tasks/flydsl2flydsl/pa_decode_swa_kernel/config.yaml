schema_version: 2
description: "Optimize the FlyDSL partitioned paged-attention decode kernel for sliding-window\nattention\
  \ on AMD CDNA GPUs.\nYou MUST keep the kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton.\n\
  You MUST NOT add FastLauncher, ctypes dispatch bypass, _call_state_cache extraction,\nor any wrapper\
  \ that bypasses JitFunction.__call__. Only optimize the GPU kernel\ncomputation itself."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: compile_pa_decode_sw
  - file: kernel.py
    kind: builder
    symbol: compile_pa_decode_sw_reduce
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
platform_support:
  required_arch: [gfx942, gfx950]
  status: active
