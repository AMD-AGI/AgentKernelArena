schema_version: 2
description: "Optimize the FlyDSL Fused RoPE + KV Cache kernel for AMD MI300X GPU.\nThe kernel fuses Q/K\
  \ RoPE rotation and KV cache writes into a single\nlaunch using NeoX-style rotation and ds_bpermute\
  \ for cross-lane exchange.\nYou MUST keep the kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA,\
  \ or Triton."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
