schema_version: 2
description: "Optimize the FlyDSL Softmax kernel for AMD MI300X GPU.\nThe kernel computes numerically\
  \ stable softmax using exp2(x * log2e)\nfor fast exponentiation and float32 accumulation.\nYou MUST\
  \ keep the kernel in FlyDSL \u2014 do NOT rewrite it in HIP, CUDA, or Triton."
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: flydsl
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_softmax_module
baseline:
  kind: initial_candidate
  language: flydsl
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
platform_support:
  required_arch: gfx942
  status: active
