task_type: rewrite_by_flydsl

# Generated by src/tools/generate_sikl_tasks.py from the workload schema bundle.
# Edit the gemm template task (gemm_a16w16_nt_n6144_k6144) or the generator, then regenerate.

# The agent-editable file: the FlyDSL port lands here. Everything else in the
# task (harness, driver, reference, baseline, input construction) is protected.
source_file_path:
  - kernel.py
target_kernel_functions:
  - build_gemm_a16w16_nt_n3584_k512_module

# ---------------------------------------------------------------------------
# Rewrite pipeline inputs (consumed by agents/forge_rewrite/launch_agent.py).
#
# port_source is the baseline implementation's entry file. It is read-only
# reference material for the PORT phase; the driver owns the interface and the
# measurement.
#
# logical_operator is the task's KB identity and is also what KernelForge
# derives the builder symbol above from. It must agree with workload.json's
# builder_symbol, which is what the harness scores against; a disagreement makes
# the harness find no factory and silently score the baseline as if the port had
# never happened.
# ---------------------------------------------------------------------------
rewrite:
  port_source: /sgl-workspace/aiter/aiter/tuned_gemm.py
  port_source_entry: gemm_a16w16
  port_target: kernel.py
  logical_operator: gemm_a16w16_nt_n3584_k512
  source_owner: aiter
  snr_threshold: 30.0
  max_port_attempts: 5

# The numeric contract (axes, dtypes, seed, gate policy, benchmark parameters)
# lives in workload.json and scripts/task_inputs.py as the single source of
# truth; duplicating it here would let the two drift.
workload:
  definition: gemm_a16w16_nt_n3584_k512
  cases: 13

compile_command:
  - python3 test_kernel_harness.py --compile
correctness_command:
  - python3 test_kernel_harness.py --correctness
performance_command:
  - python3 test_kernel_harness.py --full-benchmark

# Every command builds all 13 cases in its own process, and each build is a
# FlyDSL compilation, so these are set well above a single-case task's.
compile_timeout: 3600
correctness_timeout: 1800
performance_timeout: 3600
task_result_template: null

platform_support:
  required_arch: gfx950
  status: active
  skip_reason: null

prompt:
  source_code: null
  cheatsheet: null
  instructions: >-
    Implement a 16-bit GEMM in FlyDSL for MI355X/gfx950, replacing the
    production implementation the task measures as its baseline.

    The operator computes out = a @ b.T with bf16 in and out, a of shape
    [m, 512], b of shape [3584, 512] stored transposed, and out of shape
    [m, 3584]. One task scores all 13 workload cases, m from 1 to 4096 in
    powers of two, so a single tile or split-k choice will not do: the builder
    receives m and is called once per case, which is where the per-shape decision
    belongs.

    The baseline is aiter's tuned dispatch gemm_a16w16, not a single kernel. It
    resolves each M bucket separately out of aiter's merged bf16 tuned table, and
    depending on the shape it picks aiter's own FlyDSL kernels or torch's native
    matmul (hipBLASLt). Query aiter.tuned_gemm.get_GEMM_A16W16_config to see which
    bar a given case actually has to clear.

    The interface you must expose, the exact tensor layouts, and the file paths of
    the baseline implementation are all documented at the top of
    scripts/forge_driver.py. Read it first, then read the baseline sources it
    points at.

    Write the implementation in FlyDSL only. Do not import aiter, and do not
    compute the product with torch (no @, matmul, mm, bmm, einsum, addmm or
    F.linear) -- those resolve to the very implementations this task exists to
    replace, and both are rejected before scoring. Correctness is measured against
    scripts/task_reference.py, an fp32 matmul; the gate is derived at run time from
    how far the production implementation itself sits from that reference, so the
    bar is "no worse than what ships". Edit only kernel.py; the harness, driver,
    reference, baseline and input construction are protected.
