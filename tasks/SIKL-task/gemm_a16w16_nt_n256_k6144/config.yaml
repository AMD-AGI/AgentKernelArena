task_type: operator2flydsl

# Generated by generate_sikl_tasks.py from the workload schema bundle. The
# generator lives alongside the bundle, outside this repository, because it is
# tooling for one task suite rather than a framework feature.
# Edit the gemm template task (gemm_a16w16_nt_n6144_k6144) or the generator, then regenerate.

# The agent-editable file: the FlyDSL port lands here. Everything else in the
# task (harness, driver, reference, baseline, input construction) is protected.
source_file_path:
  - kernel.py
target_kernel_functions:
  - build_gemm_a16w16_nt_n256_k6144_module

# ---------------------------------------------------------------------------
# The production implementation is materialized into the task workspace before
# the agent starts, using Arena's existing in-image seeding. That is what keeps
# rewrite_source_file task-relative: an absolute image path would bind the task
# to one image layout, leave the aiter version it read unrecorded, and put the
# thing being handed to the agent somewhere a reviewer cannot see.
#
# jit/ is excluded because it is a build cache rather than source. Measured on
# the installed package it holds 1823 .pkl, 1823 .lock and 108 .so against 15
# .py, and accounts for 3.1 GB of a 3.2 GB tree; nothing the driver points at
# lives there. The seeded copy is read-only reference material either way -- the
# operator under test is still imported from the installed aiter, and a
# candidate may not import aiter at all.
#
# repo_subdir is deliberately not `aiter`: a directory of that name at the
# workspace root would sit on sys.path ahead of the real package for every
# command the task runs.
image_repo_path: /sgl-workspace/aiter
repo_subdir: aiter_source
image_repo_exclude:
  - jit
  - __pycache__

# The one field this task type adds. It names the production implementation the
# operator is ported from -- read-only reference material for the agent, while
# the driver owns the interface and the measurement.
#
# Everything else the agent needs is an existing Arena field: the port lands in
# source_file_path[0], and kernel_identity carries the operator's identity and
# owner. How a campaign searches -- attempt counts, coarse filters, budget --
# is agent configuration, not task data.
#
# The source's host entry point is deliberately not a field. KernelForge treats
# it as a hint for the port agent and does not fail without one, because the
# driver owns how the reference and the baseline are invoked. It is named in the
# instructions below and in the driver docstring, which is where prose belongs.
# ---------------------------------------------------------------------------
rewrite_source_file: aiter_source/aiter/tuned_gemm.py

# logical_operator is the task's KB identity and is also what KernelForge
# derives target_kernel_functions above from. It must agree with workload.json's
# builder_symbol, which is what the harness scores against; a disagreement makes
# the harness find no factory and silently score the baseline as if the port had
# never happened.
#
# source_owner is forwarded as the KB's owning framework. It is not decoration:
# KernelForge would otherwise read the owner out of the source file's path, and
# by the time it looks, the source is a copy in a scratch workspace with no
# framework in its path -- so the recipes this task produces would be filed
# under 'unknown'.
kernel_identity:
  logical_operator: gemm_a16w16_nt_n256_k6144
  source_owner: aiter

# The numeric contract (axes, dtypes, seed, benchmark parameters)
# lives in workload.json and scripts/task_inputs.py as the single source of
# truth; duplicating it here would let the two drift.
workload:
  definition: gemm_a16w16_nt_n256_k6144
  cases: 13

compile_command:
  - python3 test_kernel_harness.py --compile
correctness_command:
  - python3 test_kernel_harness.py --correctness
performance_command:
  - python3 test_kernel_harness.py --full-benchmark

# Every command builds all 13 cases in its own process, and each build is a
# FlyDSL compilation, so these are set well above a single-case task's.
compile_timeout: 3600
correctness_timeout: 1800
performance_timeout: 3600
task_result_template: null

platform_support:
  required_arch: gfx950
  status: active
  skip_reason: null

prompt:
  source_code: null
  cheatsheet: null
  instructions: >-
    Implement a 16-bit GEMM in FlyDSL for MI355X/gfx950, replacing the
    production implementation the task measures as its baseline.

    The operator computes out = a @ b.T with bf16 in and out, a of shape
    [m, 6144], b of shape [256, 6144] stored transposed, and out of shape
    [m, 256]. One task scores all 13 workload cases, m from 1 to 4096 in
    powers of two, so a single tile or split-k choice will not do: the builder
    receives m and is called once per case, which is where the per-shape decision
    belongs.

    The baseline is aiter's tuned dispatch gemm_a16w16, not a single kernel. It
    resolves each M bucket separately out of aiter's merged bf16 tuned table, and
    depending on the shape it picks aiter's own FlyDSL kernels or torch's native
    matmul (hipBLASLt). Query aiter.tuned_gemm.get_GEMM_A16W16_config to see which
    bar a given case actually has to clear.

    The interface you must expose, the exact tensor layouts, and the file paths of
    the baseline implementation are all documented at the top of
    scripts/forge_driver.py. Read it first, then read the baseline sources it
    points at.

    The kernels that compute the product are yours to write in FlyDSL, and how you
    get there is your call. The correctness suite checks that much: it rejects a
    candidate that imports aiter or hands the product to torch's matmul family,
    since both resolve to the implementation this task exists to replace.
    Correctness is scripts/task_compare.py against scripts/task_reference.py, an
    fp32 matmul. Both are the workload schema's own callbacks, as is
    scripts/task_initialize.py, which builds the inputs: the same three files
    decide whether your result is accepted after the run, so the bar here is the
    bar there. kernel.py is the file you edit; the harness, driver, reference,
    baseline, comparison and input construction are protected.
