    correctness:
      timeout_s: 1800
  candidate:
    correctness:
      timeout_s: 1800
platform_support:
  required_arch: gfx950
  status: active
exports:
- format: sikl-solution
  output: artifacts/solution.json
  command:
  - python3
  - scripts/export_solution.py
  timeout_s: 60
