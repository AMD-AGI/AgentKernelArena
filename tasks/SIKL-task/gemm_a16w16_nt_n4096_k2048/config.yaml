schema_version: 2
description: Implement gemm_a16w16_nt_n4096_k2048 in FlyDSL over every declared case.
instructions:
- README.md
kernel_identity:
  logical_operator: gemm_a16w16_nt_n4096_k2048
  source_owner: aiter
candidate:
  language: flydsl
  initial_state: unimplemented
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_gemm_a16w16_nt_n4096_k2048_module
baseline:
  kind: provided
  source_files:
  - aiter_source/aiter/tuned_gemm.py
  correctness_policy: diagnostic
  diagnostic_reason: Historical upstream commit 329bc9861f7199c4df4d6fc0fc0eb16353cfe995 identifies this
    task among baseline reference-replay failures on MI355X/gfx950 and reports repeat-call disagreements
    at m_1 and m_8. This is not fresh validation or evidence that every case fails. Record actual per-case
    PASS/FAIL, source hash, runtime and dispatch; only completed finite numerical mismatches are diagnostic.
    Candidate checks retain the full original gate.
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter
    destination: aiter_source
    exclude:
    - jit
    - __pycache__
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workload.json
  timeout_s: 3600
  baseline:
    correctness:
      timeout_s: 1800
  candidate:
    correctness:
      timeout_s: 1800
platform_support:
  required_arch: gfx950
  status: active
exports:
- format: sikl-solution
  output: artifacts/solution.json
  command:
  - python3
  - scripts/export_solution.py
  timeout_s: 60
