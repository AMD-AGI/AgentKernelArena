task_type: rewrite_by_flydsl

# Generated by src/tools/generate_sikl_tasks.py from the workload schema bundle.
# Edit the moe template task (mxfp4_moe_e257_i128) or the generator, then regenerate.

# The agent-editable file: the FlyDSL port lands here. Everything else in the
# task (harness, driver, reference, baseline, input construction) is protected.
source_file_path:
  - kernel.py
target_kernel_functions:
  - build_mxfp4_moe_e257_i256_module

# ---------------------------------------------------------------------------
# Rewrite pipeline inputs (consumed by agents/forge_rewrite/launch_agent.py).
#
# port_source is the baseline implementation's entry file. It is read-only
# reference material for the PORT phase; the driver owns the interface and the
# measurement.
#
# logical_operator is the task's KB identity and is also what KernelForge
# derives the builder symbol above from. It must agree with workload.json's
# builder_symbol, which is what the harness scores against; a disagreement makes
# the harness find no factory and silently score the baseline as if the port had
# never happened.
# ---------------------------------------------------------------------------
rewrite:
  port_source: /sgl-workspace/aiter/aiter/fused_moe.py
  port_source_entry: fused_moe
  port_target: kernel.py
  logical_operator: mxfp4_moe_e257_i256
  source_owner: aiter
  snr_threshold: 30.0
  max_port_attempts: 5

# The numeric contract (axes, dtypes, seed, gate policy, benchmark parameters)
# lives in workload.json and scripts/task_inputs.py as the single source of
# truth; duplicating it here would let the two drift.
workload:
  definition: aiter_fused_moe_per_1x32_d6144_e257_topk9_n1024_k3072_i256
  cases: 13

compile_command:
  - python3 test_kernel_harness.py --compile
correctness_command:
  - python3 test_kernel_harness.py --correctness
performance_command:
  - python3 test_kernel_harness.py --full-benchmark

# Every command builds all 13 cases in its own process, and each build is a
# FlyDSL compilation, so these are set well above a single-case task's.
compile_timeout: 3600
correctness_timeout: 10800
performance_timeout: 3600
task_result_template: null

platform_support:
  required_arch: gfx950
  status: active
  skip_reason: null

prompt:
  source_code: null
  cheatsheet: null
  instructions: >-
    Implement the GLM-5.2 routed-expert MoE layer in FlyDSL for MI355X/gfx950,
    replacing the production implementation the task measures as its baseline.

    Per-rank configuration: model_dim=6144, inter_dim=512,
    257 experts, topk=9, MXFP4 group_size=32 (QuantType.per_1x32),
    SiLU, bf16 in and out. This is the afp4_wfp4 path: BOTH operands are MXFP4. The
    weights arrive pre-quantized and preshuffled (shuffle_weight(w, (16,16)) on the
    packed weights, e8m0_shuffle on the scales); the activation must be quantized to
    MXFP4 twice, once into stage 1 and again on the stage-1 output going into
    stage 2.

    One task scores all 13 workload cases, num_tokens from 1 to 4096 in
    powers of two. The builder receives num_tokens and is called once per case, so
    the per-shape decision belongs there -- the production implementation picks a
    different tuned kernel per M bucket.

    The interface you must expose, the exact tensor layouts, and the file paths of
    the baseline implementation (aiter's entry, its FlyDSL stage kernels and its HIP
    quant/sort/reduce kernels) are all documented at the top of
    scripts/forge_driver.py. Read it first, then read the baseline sources it points
    at.

    Write the implementation in FlyDSL only. Do not import aiter or call any other
    GPU library to compute the result -- that defeats the rewrite, and it is
    rejected before scoring. Correctness is measured against
    scripts/task_reference.py; the gate is derived at run time from how far the
    production implementation itself sits from that reference, so the bar is "no
    worse than what ships". Edit only kernel.py; the harness, driver, reference,
    baseline and input construction are protected.
