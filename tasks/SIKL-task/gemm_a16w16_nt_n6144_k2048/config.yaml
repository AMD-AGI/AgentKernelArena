schema_version: 2
description: Implement gemm_a16w16_nt_n6144_k2048 in FlyDSL over every declared case.
instructions:
- README.md
kernel_identity:
  logical_operator: gemm_a16w16_nt_n6144_k2048
  source_owner: aiter
candidate:
  language: flydsl
  initial_state: unimplemented
  editable:
  - kernel.py
  entrypoints:
  - file: kernel.py
    kind: builder
    symbol: build_gemm_a16w16_nt_n6144_k2048_module
baseline:
  kind: provided
  source_files:
  - aiter_source/aiter/tuned_gemm.py
  correctness_policy: diagnostic
  diagnostic_reason: >-
    MI355X/gfx950 job 139315 on 2026-09-15 executed all 13 baseline cases with
    image sha256:106a7adbeec5554b6e66a4bda0b3694af442717b9fe92754a9885520077b6f93.
    Cases m_1, m_2 and m_4 completed with finite numerical mismatches; all
    output contracts passed. Baseline correctness action SHA256
    95770d8f910e865b28d493aa234cc3205a61fe4e1709cd84443761619c950e76.
    README.md records all cases and distinguishes these observations from
    task acceptance. Retain baseline numerical and timed-replay diagnostics;
    compilation, execution, coverage and output-contract errors are not exempt.
    Candidate correctness and timed replay retain the full original gate.
workspace:
  sources:
  - kind: image
    image_path: /sgl-workspace/aiter/aiter
    destination: aiter_source/aiter
    exclude:
    - jit/build
    - jit/flydsl_cache
    - __pycache__
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: workload.json
  timeout_s: 3600
  baseline:
    correctness:
      timeout_s: 1800
  candidate:
    correctness:
      timeout_s: 1800
platform_support:
  required_arch: gfx950
  status: active
exports:
- format: sikl-solution
  output: artifacts/solution.json
  command:
  - python3
  - scripts/export_solution.py
  timeout_s: 60
