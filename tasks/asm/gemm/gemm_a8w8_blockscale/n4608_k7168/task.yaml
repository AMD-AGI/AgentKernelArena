    license: MIT
    modifications: >-
      Code objects vendored byte for byte. The host side is translated to Python in baseline/kernel.py: the tuned
      lookup of gemm_a8w8_blockscale_bpreshuffle (get_CKGEMM_config with exact M, then getPaddedM granularity 0 and 1)
      over the gfx950 / 256-CU rows of the DeepSeek-V3 tuned table for N=4608, K=7168, M<=864, inlined as a dict of
      (tile_m, splitK); for the three padded-M rows whose tuned libtype is ck (192, 224, 832) the asm launcher's own
      get_heuristic_fp8_kernel (256 CUs, splitK 1) instead of the Composable Kernel instance; the split-K alignment
      check and the output zeroing before split-K atomic accumulation (hipMemsetAsync -> out.zero_()); the cached
      float32 zero bias of get_zero_bias_buf; the packed KernelArgs (16-byte fields) and grid
      ((N/128)*splitK, ceil(M/tile_m), 1) x 256 threads. AITER's shuffle_weight(layout=(16, 16)) is the task's
      layout function (inputs.py).
