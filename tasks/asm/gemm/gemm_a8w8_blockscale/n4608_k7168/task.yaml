schema_version: 3
description: >-
  out = dequant(a) @ dequant(b)^T with float8_e4m3fn activations a [m, 7168] carrying one float32 scale per 1x128
  group (a_scale [56, m], k-group-major as the per-token-group quantizer writes it) and float8_e4m3fn weights b
  [4608, 7168] (AITER 16x16-preshuffled) carrying one float32 scale per 128x128 block (b_scale [36, 56]), accumulated
  in float32 and rounded to bfloat16.
operator: {name: gemm_a8w8_blockscale, category: gemm}
interface:
  axes:
    m: {kind: var, min: 1, max: 864, description: Rows of the activation matrix (tokens in the batch).}
    n: {kind: const, value: 4608, description: Output channels (DeepSeek-R1 dense MLP gate_up at TP8).}
    k: {kind: const, value: 7168, description: Contracted dimension (hidden size).}
  inputs:
    a: {kind: tensor, shape: [m, k], dtype: float8_e4m3fn, distribution: {kind: generator}}
    a_scale: {kind: tensor, shape: [k // 128, m], dtype: float32, distribution: {kind: generator}}
    b: {kind: tensor, shape: [n, k], dtype: float8_e4m3fn, role: weight, distribution: {kind: generator}}
    b_scale: {kind: tensor, shape: [n // 128, k // 128], dtype: float32, role: weight,
              distribution: {kind: generator}}
  outputs:
    out: {shape: [m, n], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
reference: {file: reference.py, symbol: reference}
