schema_version: 2
description: Translate the declared mla implementation from Triton to FlyDSL while preserving all operator
  and evaluation contracts.
instructions:
- README.md
candidate:
  language: flydsl
  initial_state: implemented
  initial_language: triton
  editable:
  - mla.py
  entrypoints:
  - file: mla.py
    kind: function
    symbol: mla_decode_fwd
baseline:
  kind: initial_candidate
  language: triton
  correctness_policy: required
evaluation:
  runner:
  - python3
  - scripts/evaluate.py
  workloads: cases.json
  timeout_s: 3600
