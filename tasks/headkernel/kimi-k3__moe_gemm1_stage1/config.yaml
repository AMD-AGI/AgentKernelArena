    scales; outputs are FP8 payloads and native tiled E8M0 scales. Preserve
    SiTUv2 beta=4, linear_beta=25, topk=16, every captured scalar/layout/alias,
    all empirical work distributions and the complete observed frequencies.
    The protected oracle uses current raw captured fixtures on CPU and a
    separate frozen native source closure. Every replay refreshes legal inputs
    and checks outputs after CPU snapshots. Runtime reflection, arbitrary
    Python calls, module/object mutation and result/timer edits are forbidden.
    GPU and framework task-validator qualification are pending.
