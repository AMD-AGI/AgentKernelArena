# glm-5.3-flash__elementwise_copy_cluster
# Head kernel from the 2026-09-14 info table, rows: G53-5

source_file_path:
  - source/bpreshuffle_scale_impl.py

target_kernel_functions:
  - materialize_bpreshuffle_fp8_scale

compile_command:
  - python3 scripts/task_runner.py compile

correctness_command:
  - python3 scripts/task_runner.py correctness

performance_command:
  - python3 scripts/task_runner.py performance

task_type: triton2triton

task_result_template: null

prompt:
  source_code: null
  instructions: |
    Optimize the GLM-5.3-Flash head kernel `elementwise_kernel_manual_unroll` (ATen direct_copy_kernel_cuda) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 3.24% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 0.0006 of its empirical roofline.

    Edit only:
      source/bpreshuffle_scale_impl.py

    Entry points that must keep their signatures:
      materialize_bpreshuffle_fp8_scale

    The production seam is `sglang.srt.layers.quantization.fp8_utils:materialize_bpreshuffle_fp8_scale`; correctness is judged
    against a frozen live-server capture, not a re-derived reference, so the kernel
    must stay faithful to the deployed contract (dtypes, layouts, quantization).

    Note: 1.4253x isolated, e2e never measured. Correctness is two-part: values AND transposed-contiguous physical stride.
  cheatsheet: null

