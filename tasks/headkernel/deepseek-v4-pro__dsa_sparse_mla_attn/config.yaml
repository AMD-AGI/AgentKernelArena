# Provenance. Not read by the arena schema check; read by scripts/task_runner.py
# and by anyone auditing where these numbers came from.
headkernel:
  model: "DeepSeek-V4-Pro"
  owner: zihao
  docker: "harbor.crusoe.primus-safe.amd.com/hyperloom-image/sglang:v0.5.17-rocm720-mi35x-profilerfix"
  serving: ISL 8192 / OSL 1024 / CONC 64 / TP 8
  backend: tilelang
  regime: decode
  device_symbol: main_kernel
  target_callable: "sglang.kernels.ops.attention.dsa.tilelang_kernel:dpsk_v4_fp8_attention_fwd"
  tol: 0.02
  oracle: "frozen live-capture ut/reference_io.pt"
  source_package: "Z/DeepSeek-V4-Pro_dsa_sparse_mla_attn"
  source_seed: stock
  # 1 file(s) shipped pre-tuned by a previous GEAK run and were reset to baseline_ref/*.orig; the tuned version is kept at
  # _prior_solutions/deepseek-v4-pro__dsa_sparse_mla_attn/
  info_rows:
    - row: "DS-1"
      info_kernel: MLA
      gpu_pct: 44.9
      empirical_roofline: "18%"
      optimized_roofline: "18.1%"
      e2e_uplift: null
  symbol_locations:
    dpsk_v4_fp8_attention_fwd: source/tilelang_kernel.py
    sparse_mla_fwd_decode_partial: source/tilelang_kernel.py
    sparse_mla_fwd_decode_combine: source/tilelang_kernel.py
