# deepseek-v4-pro__dsa_sparse_mla_attn
# Head kernel from the 2026-09-14 info table, rows: DS-1

source_file_path:
  - source/tilelang_kernel.py

target_kernel_functions:
  - dpsk_v4_fp8_attention_fwd
  - sparse_mla_fwd_decode_partial
  - sparse_mla_fwd_decode_combine

compile_command:
  - python3 scripts/task_runner.py compile

correctness_command:
  - python3 scripts/task_runner.py correctness

performance_command:
  - python3 scripts/task_runner.py performance

task_type: triton2triton

task_result_template: null

prompt:
  source_code: null
  instructions: |
    Optimize the DeepSeek-V4-Pro head kernel `MLA` (tilelang) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 44.9% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 18% of its empirical roofline.

    Edit only:
      source/tilelang_kernel.py

    Entry points that must keep their signatures:
      dpsk_v4_fp8_attention_fwd
      sparse_mla_fwd_decode_partial
      sparse_mla_fwd_decode_combine

    The production seam is `sglang.kernels.ops.attention.dsa.tilelang_kernel:dpsk_v4_fp8_attention_fwd`; correctness is judged
    against a frozen live-server capture, not a re-derived reference, so the kernel
    must stay faithful to the deployed contract (dtypes, layouts, quantization).

    Note: chushi optimized ~5.90x roofline~0.31; zhuqiong optimized ~8.63x roofline~0.51
  cheatsheet: null

