    Optimize the Qwen3.8-2.4T-A95B-MXFP4 head kernel `Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs_MT256x240x64_MI -> MT256x256x64_MI` (hipBLASLt / Tensile) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 15.56% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 40.1% compute-bound of its empirical roofline.

    The profiler resolves several device symbols to this one seam, so a change here
    moves all of them:
      - Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs_MT256x240x64_MI -> MT256x256x64_MI  (15.56% GPU, roofline 40.1% compute-bound)
      - gemm_a16w16 M64 N32 K8192 - torch solution:0 -> native (retained control)  (21.43% GPU, roofline 1.95% memory-bound)
      - gemm_a16w16 M64 N512 K8192 - torch solution:0 -> flydsl t16x64x256 split-K8  (21.43% GPU, roofline 10.96% memory-bound)
      - gemm_a16w16 M64 N4608 K8192 - torch solution:0 -> bf16gemm_fp32bf16_tn_64x64_splitk_clean  (21.43% GPU, roofline 37.37% memory-bound)
      - gemm_a16w16 M64 N8192 K256 - torch solution:0 -> flydsl t32x64x64 split-K1  (21.43% GPU, roofline 9.23% memory-bound)

    Edit only:
      source/tuned_gemm_candidate.py

    Entry points that must keep their signatures:
      gemm_a16w16
      torch_gemm

    The production seam is `aiter.tuned_gemm:gemm_a16w16`; correctness is judged
    against a deterministic baseline regenerated from the live shapes, strides and
    dispatch selections that were actually observed in the serving profile, so the kernel
    must stay faithful to the deployed contract (dtypes, layouts, quantization).

    Note: Q38-4..Q38-8 are one aiter.tuned_gemm seam with five live shapes (ledger hk04-hk08): the M=16384 prefill GEMM plus the four M=64 decode shapes that share the 21.43% bucket. The oracle is a deterministic runtime torch.nn.functional.linear baseline, not a frozen tensor blob, so the performance leg uses the GEAK interleaved legs rather than record replay. gpu_pct 21.43 is a bucket SHARED by Q38-5..Q38-8 - one aiter.tuned_gemm seam, four decode shapes. It is not additive: do not sum it across those four rows. Identity caveat: this package's distinct_baseline_candidate gate compares the candidate against torch.nn.functional.linear rather than against the unshadowed aiter callable, and _callable_identity reports the decorator's source file, so the gate does not by itself prove the timed code is source/tuned_gemm_candidate.py. The overlay rebind IS observable in the run log ('[overlay] rebound aiter.tuned_gemm:gemm_a16w16 -> tuned_gemm_candidate.gemm_a16w16'); check for that line before trusting a speedup on this task.
