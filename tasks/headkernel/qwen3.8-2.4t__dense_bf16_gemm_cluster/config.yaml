prompt:
  source_code: null
  instructions: 'Tune native backend routing for the five preserved Qwen dense-BF16 GEMM geometries on
    MI355X/gfx950.


    Only the body of select_routes in source/routing.py is editable. It must return a literal mapping
    containing every existing case signature exactly once. Each value must be one of "recorded", "torch",
    or "triton". The selector is parsed as data and is never executed. Imports, calls, decorators, expressions,
    helper functions, missing cases, and edits to any other source or harness file are rejected.


    "recorded" uses the original native backend, solution index, split-K and kernel name in ut/meta.json.
    "torch" and "triton" select the corresponding existing image-native backend. All inputs, shapes, strides,
    BF16 dtype, bias/scaling settings, and tolerances stay frozen. Unsupported native routes fail the
    complete task; there is no fallback or case skipping.


    This task exposes native routing tuning, not GPU-source editing. The original SG520 native source
    is retained and hash-checked. Five complete cases use 10 warmups and 100 ordered CUDA/HIP graph samples,
    with fresh CPU-owned A/B inputs, poisoned outputs, and output/input validation for every invocation.
    Correctness uses an independent torch.nn.functional.linear execution after candidate observations
    are on CPU.


    The prefill shape is M16384/N4608/K8192. The four decode shapes are M64/N32/K8192, M64/N512/K8192,
    M64/N4608/K8192, and M64/N8192/K256. The four decode ledger rows share the historical21.43% profile
    bucket; do not add it four times. Current SG520 hardware/framework qualification is still required.
    No serving-workload or performance-gain claim follows from CPU tests.

    '
