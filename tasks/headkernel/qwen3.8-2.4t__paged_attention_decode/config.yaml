source_file_path:
  - source/attention_candidate.py

target_kernel_functions:
  - paged_attention_ragged

compile_command:
  - python3 scripts/task_runner.py compile

correctness_command:
  - python3 scripts/task_runner.py correctness

performance_command:
  - python3 scripts/task_runner.py performance

task_type: triton2triton

task_result_template: null

prompt:
  source_code: null
  instructions: |
    Optimize the Qwen3.8-2.4T-A95B-MXFP4 head kernel `paged_attention_ll4mi_QKV_mfma16_kernel` (AITER / CK asm) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 6.84% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 48.2% memory-bound of its empirical roofline.

    Edit only:
      source/attention_candidate.py

    Entry points that must keep their signatures:
      paged_attention_ragged

    Do NOT remove these - they are not optimization targets, but the two-leg unit
    test resolves its frozen baseline through them, and deleting one turns a
    working kernel into an unexplained correctness failure:
      baseline_callable
      _BASELINE
      direct_register_custom_op

    The production seam is `aiter.ops.attention:paged_attention_ragged`; correctness is judged
    against a frozen live-server capture, not a re-derived reference, so the kernel
    must stay faithful to the deployed contract (dtypes, layouts, quantization).

    Note: the live capture yielded exactly one decode geometry (M=64, 521351 referenced KV pages). The callable must return the supplied output buffer and leave query/KV/metadata/scales unchanged - the UT checks that, not just the values. source/ also stubs direct_register_custom_op so loading the overlay copy does not re-register the torch.library schemas the production module already owns; keep it.
  cheatsheet: null

