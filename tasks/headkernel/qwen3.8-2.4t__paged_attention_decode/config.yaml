prompt:
  source_code: null
  instructions: |
    Optimize the Qwen3.8-2.4T-A95B-MXFP4 head kernel `paged_attention_ll4mi_QKV_mfma16_kernel` (AITER / CK asm) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 6.84% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 48.2% memory-bound of its empirical roofline.

    Edit only the bodies of _paged_attention_kernel and
    _paged_attention_ll4mi_reduce_kernel in source/pa_kernels.cuh. These are the
    actual native HIP device implementations from the pinned SGLang 0.5.20
    image. Includes, preprocessing, declarations, signatures, host launch code,
    the Python ABI wrapper, oracle aliases and registration shims are frozen.
    The task-local source guard rejects host code or scope escapes before any
    candidate is compiled or invoked. A source-hash-specific native build must
    consume the submitted device header; using an unrelated cached binary is
    not a valid candidate run.

    The production seam is `aiter.ops.attention:paged_attention_ragged`; correctness is judged
    against a frozen live-server capture, not a re-derived reference, so the kernel
    must stay faithful to the deployed contract (dtypes, layouts, quantization).

    Note: the original TP8/EP8 page1 capture yielded exactly one decode geometry
    (M=64, 521351 referenced KV pages). The callable must return the supplied
    output buffer and leave query/KV/metadata/scales unchanged. Preserve the
    full recorded ABI; it is not the newer TP8/EP1 page16 unified-attention task.
  cheatsheet: null

