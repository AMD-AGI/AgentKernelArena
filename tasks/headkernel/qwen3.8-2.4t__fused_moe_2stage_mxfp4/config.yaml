# Provenance. Not read by the arena schema check; read by scripts/task_runner.py
# and by anyone auditing where these numbers came from.
headkernel:
  model: "Qwen3.8-2.4T-A95B-MXFP4"
  owner: "Li, Zeping <zepingl@amd.com>"
  docker: "harbor.crusoe.primus-safe.amd.com/hyperloom-image/sglang:v0.5.18-rocm720-mi35x-profilerfix"
  serving: ISL 8192 / OSL 1024 / CONC 64 / TP 8
  backend: AITER / FlyDSL
  regime: decode
  device_symbol: mfma_moe1_silu_mul_afp4_wfp4_bf16_t32x128x256_pm1_async_v32
  target_callable: "aiter.fused_moe:fused_moe"
  tol: 0.02
  oracle: "frozen live-capture ut/reference_io.pt"
  source_package: P/fused_moe_mxfp4_task
  source_seed: "stock+harness-shim"
  # Symbols the UT resolves its frozen baseline through. They are not
  # optimization targets, but deleting one turns a working kernel into an
  # opaque correctness FAIL, so scripts/task_runner.py compile checks them.
  preserve_symbols:
    - baseline_callable
    - _BASELINE
  # source/ is the stock runtime-image file plus 10 line(s) of UT harness shim (the two-leg
  # UT resolves its frozen baseline through them). Nothing has been pre-optimized.
  info_rows:
    - row: "Q38-1"
      info_kernel: "mfma_moe1_silu_mul_afp4_wfp4_bf16_t32x128x256_pm1_async_v32 -> t32x32x256"
      gpu_pct: 21.06
      empirical_roofline: "73.05% memory-bound"
      optimized_roofline: "82.37% memory-bound"
      e2e_uplift: "E1 FMoE 6-row +1.025%; E3 E1+E2 native stack +3.922%"
    - row: "Q38-2"
      info_kernel: "mfma_moe2_afp4_wfp4_bf16_cshuffle_t32x128x256 [atomic_bnt2 -> atomic]"
      gpu_pct: 11.58
      empirical_roofline: "75.47% memory-bound"
      optimized_roofline: "71.65% memory-bound"
      e2e_uplift: "E1 FMoE 6-row +1.025%; E3 E1+E2 native stack +3.922%"
    - row: "Q38-3"
      info_kernel: "FMoE 2-stage - S1 t64x128 + S2 atomic -> S1 t128x64 + S2 atomic_persist"
      gpu_pct: 15.73
      empirical_roofline: "22.6% memory-bound"
      optimized_roofline: "23.7% memory-bound"
      e2e_uplift: "E1 FMoE 6-row +1.025%; E3 E1+E2 native stack +3.922%"
