    Optimize the Qwen3.8-2.4T-A95B-MXFP4 head kernel `mfma_moe1_silu_mul_afp4_wfp4_bf16_t32x128x256_pm1_async_v32 -> t32x32x256` (AITER / FlyDSL) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 21.06% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 73.05% memory-bound of its empirical roofline.

    The profiler resolves several device symbols to this one seam, so a change here
    moves all of them:
      - mfma_moe1_silu_mul_afp4_wfp4_bf16_t32x128x256_pm1_async_v32 -> t32x32x256  (21.06% GPU, roofline 73.05% memory-bound)
      - mfma_moe2_afp4_wfp4_bf16_cshuffle_t32x128x256 [atomic_bnt2 -> atomic]  (11.58% GPU, roofline 75.47% memory-bound)
      - FMoE 2-stage - S1 t64x128 + S2 atomic -> S1 t128x64 + S2 atomic_persist  (15.73% GPU, roofline 22.6% memory-bound)

    This is a constrained native routing task. The SG520 device implementation is
    image-owned and verified against the protected native source checksum.
    Edit only source/routing.py. Keep the zero-argument select_routes signature
    and return a literal dictionary naming both captured cases exactly once.
    Each value must be captured, block32, block64, or block128. The latter three
    change only the native block_size_M hint. Unsupported native combinations
    fail the entire task; they are never skipped or replaced by a fallback.

    The file is parsed as data and is never imported or executed. Imports,
    callbacks, helper functions, decorators, expressions and module statements
    are outside the task boundary. Preserve the captured packed weights, scales,
    top-k routes, expert mask, shapes, strides, dtypes, activation and quantization.
    Both original cases must pass the captured oracle, three fresh hidden-input
    draws, fresh-output/input-immutability checks, two graph replay values,
    output corruption and no-op controls, and both native stage engagement checks.
    Performance uses 10 warmups and 100 ordered single-replay graph samples;
    every completed replay is checked using CPU-owned observations.
  cheatsheet: null

