# Head kernel from the 2026-09-14 info table, rows: Q38-1, Q38-2, Q38-3

source_file_path:
  - source/moe_candidate.py

target_kernel_functions:
  - fused_moe

compile_command:
  - python3 scripts/task_runner.py compile

correctness_command:
  - python3 scripts/task_runner.py correctness

performance_command:
  - python3 scripts/task_runner.py performance

task_type: triton2triton

task_result_template: null

prompt:
  source_code: null
  instructions: |
    Optimize the Qwen3.8-2.4T-A95B-MXFP4 head kernel `mfma_moe1_silu_mul_afp4_wfp4_bf16_t32x128x256_pm1_async_v32 -> t32x32x256` (AITER / FlyDSL) for maximum GPU
    throughput on MI355X (gfx950) while keeping it numerically correct.

    It is 21.06% of de-inflated GPU time in the serving profile
    (ISL 8192 / OSL 1024 / CONC 64 / TP 8), currently at 73.05% memory-bound of its empirical roofline.

    The profiler resolves several device symbols to this one seam, so a change here
    moves all of them:
      - mfma_moe1_silu_mul_afp4_wfp4_bf16_t32x128x256_pm1_async_v32 -> t32x32x256  (21.06% GPU, roofline 73.05% memory-bound)
      - mfma_moe2_afp4_wfp4_bf16_cshuffle_t32x128x256 [atomic_bnt2 -> atomic]  (11.58% GPU, roofline 75.47% memory-bound)
      - FMoE 2-stage - S1 t64x128 + S2 atomic -> S1 t128x64 + S2 atomic_persist  (15.73% GPU, roofline 22.6% memory-bound)

    Edit only:
      source/moe_candidate.py

    Entry points that must keep their signatures:
      fused_moe

    Do NOT remove these - they are not optimization targets, but the two-leg unit
    test resolves its frozen baseline through them, and deleting one turns a
    working kernel into an unexplained correctness failure:
      baseline_callable
      _BASELINE

    The production seam is `aiter.fused_moe:fused_moe`; correctness is judged
    against a frozen live-server capture, not a re-derived reference, so the kernel
    must stay faithful to the deployed contract (dtypes, layouts, quantization).
  cheatsheet: null

