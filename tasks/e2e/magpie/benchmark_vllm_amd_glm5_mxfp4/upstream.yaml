# vLLM Benchmark Configuration Example
# =====================================
# This example shows how to benchmark vLLM with the GLM-5 MXFP4 model.
#
# Usage:
#   python -m Magpie benchmark --benchmark-config examples/benchmarks/benchmark_vllm_glm5_fp4.yaml
#
# Prerequisites:
#   - Docker with GPU support
#   - HuggingFace token (HF_TOKEN) for gated models

benchmark:
  framework: vllm
  model: amd/GLM-5-MXFP4
  precision: mxfp4
  run_mode: docker

  # Environment variables
  envs:
    TP: 8
    CONC: 16
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 2248 # ISL + OSL + 200
    EXTRA_VLLM_ARGS: "--no-enable-prefix-caching --block-size 1 --trust-remote-code --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice"

    # AMD performance flags
    VLLM_ROCM_USE_AITER: 1

  profiler:
    torch_profiler:
      enabled: true
    system_profiler:
      enabled: false

  gap_analysis:
    enabled: true
    top_k: 100
    find_kernel_sources: false

  # amd/GLM-5-MXFP4 needs a recent vLLM ROCm build with MXFP4 + FP4BMM support.
  # The nightly image was validated on 2026-06-08 against GLM-5.1-MXFP4 (MI355X /
  # gfx950, AITER_MXFP4_MXFP4 MoE backend, VLLM_ROCM_USE_AITER=1). GLM-5 shares the
  # GLM-5.1 model/quant code path, so the same image is expected to work; it has
  # not been separately benchmarked here.
  docker_image: "vllm/vllm-openai-rocm:nightly"
  benchmark_script: "vllm_mi355x.sh"

  timeout_seconds: 3600
