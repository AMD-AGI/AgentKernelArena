schema_version: 3
description: >-
  AWQ int4 weight dequantization: eight 4-bit codes packed per int32 (AWQ interleaved order
  0,4,1,5,2,6,3,7) become out[k, n] = (code - zero) * scale in float16, with one zero point and
  one scale per group of 128 rows and per output column.
operator:
  name: awq_dequantize
  category: quantization
interface:
  axes:
    K: {kind: var, min: 128, max: 307200, multiple_of: 128, description: Input-channel rows of the quantized weight.}
    N: {kind: const, value: 4096, description: Output columns after unpacking.}
    group_size: {kind: const, value: 128, description: Rows sharing one scale and zero point.}
  derived_axes:
    num_groups: K // group_size
  inputs:
    qweight:
      kind: tensor
      shape: [K, N // 8]
      dtype: int32
      role: weight
      distribution: {kind: randint, low: -2147483648, high: 2147483648}
    scales:
      kind: tensor
      shape: [num_groups, N]
      dtype: float16
      role: weight
      distribution: {kind: uniform, low: 0.01, high: 0.2}
    zeros:
      kind: tensor
      shape: [num_groups, N // 8]
      dtype: int32
      role: weight
      distribution: {kind: randint, low: -2147483648, high: 2147483648}
  outputs:
    out: {shape: [K, N], dtype: float16}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: vllm-project/vllm
    revision: edbc4969a76b25c531f7b9bb16b79984e65ef023
    path: vllm/model_executor/layers/quantization/awq_triton.py
    license: Apache-2.0
    modifications: awq_dequantize_kernel unchanged; the awq_dequantize_triton wrapper became run(), writing into the preallocated output with the default 32x32 block.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
