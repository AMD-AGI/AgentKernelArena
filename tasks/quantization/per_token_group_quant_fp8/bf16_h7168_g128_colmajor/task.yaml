schema_version: 3
description: >-
  Per-token-group FP8 quantization of a bfloat16 activation: each contiguous group of 128 elements of a
  row gets scale = max(max|x|, 1e-10) / 448; codes = float8_e4m3fn(clamp(x / scale, -448, 448)) with
  round-to-nearest-even. Scales are float32 and stored column-major: x_s[g, t] is the scale of group g of token t, i.e. the
  [n_tokens, hidden_size / 128] scale matrix with strides (1, n_tokens), as DeepGEMM-style blockwise
  GEMMs read it.
operator:
  name: per_token_group_quant_fp8
  category: quantization
interface:
  axes:
    n_tokens: {kind: var, min: 1, max: 262144, description: Tokens in the batch.}
    hidden_size: {kind: const, value: 7168, description: Quantized width.}
    num_groups: {kind: const, value: 56, description: Groups of 128 per row.}
  inputs:
    x:
      kind: tensor
      shape: [n_tokens, hidden_size]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
  outputs:
    x_q: {shape: [n_tokens, hidden_size], dtype: float8_e4m3fn}
    x_s: {shape: [num_groups, n_tokens], dtype: float32}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: vllm-project/vllm
    revision: edbc4969a76b25c531f7b9bb16b79984e65ef023
    path: vllm/model_executor/layers/quantization/utils/fp8_utils.py
    license: Apache-2.0
    modifications: >-
      Wrapped in the run() interface; group size 128, eps 1e-10 and use_ue8m0 False are fixed by the
      scenario, the FP8 range comes from the output dtype, the scale column stride is the stride of the
      contiguous [num_groups, n_tokens] output, and the output allocations moved to the evaluator.
compare:
  x_q: {bound: baseline_relative}
  x_s: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
