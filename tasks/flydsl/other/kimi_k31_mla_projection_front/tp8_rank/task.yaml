      baseline/LICENSE.
    notes: >-
      SGLang ROCm images pin sgl-amd-mono e52803f9 (11 commits older); the baseline is vendored from
      52486703. The kernel is the MLA projection front SGLang runs once per DSA layer of Kimi-K3.1
      (23 of 93 layers) in every narrow verify step (kimi_k31/spec.py: one request, L = 6 or 8), built
      as spec._mla_build builds it for a non-block-write layer with the absorb on; this task is one
      such launch on synthetic weights. ops.py, buffer_ops.py and dpp_utils.py are the files the
      QA-passed tasks/flydsl/other/qwen38_flash_next_decoder/verify_gdn3_qsa1 baseline bundles
      (ops.py there carries the FlyDSL 0.3.2 bridge of muse_spark/gfx950/compat.py on llvm-dialect
      ops).
    modifications: >-
      mla_pre.py, gemv.py, seam.py, tag.py: imports are package-relative, otherwise unchanged.
      stamps.py: clock from ops (the timeline build, whose stamp_flush needs FlyDSL >= 0.3.4, is
      never built). plan.py keeps the execution constants, first_task, pair_layout and key_tuple
      (dataclasses only), with a constant source tag for kernel_sources (all helpers sit in the
      kernel's directory). sync.py keeps the scratch-space tagged Mailbox and publish, Addr as a
      dataclass, and _spin's unguarded loop only (these launches open no guard scope, so upstream's
      guarded branches are never traced). ops.py: global_ptr / global_load on llvm-dialect ops for
      FlyDSL 0.3.2, KernArgs dropped. kernel.py is new: spec._mla_core's host side for one layer (the
      build key _mla_build makes, w_kc in its [heads x kv_lora, nope] view), with a zeroed scratch
      and epoch per call instead of the runner's persistent scratch and host-bumped epoch.
