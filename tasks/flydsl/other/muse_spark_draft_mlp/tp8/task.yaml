schema_version: 3
description: >-
  The Muse Spark DFlash2 draft's D-MLP launch (one draft layer's MLP half) for a draft step of `rows` rows
  (rows / 8 requests, a block of 8 rows each), on one rank of a TP8 group (8 GPUs; the tensor-parallel
  all-reduce runs inside the kernel over peer memory). Per rank: the post-attention fused add and RMSNorm,
  the convolution's kernel projection (per-token tap coefficients of 512 groups of 16 channels), the grouped
  two-tap convolution within each 8-row block, the rank's 3584 gate and 3584 up rows of the 28672-wide MLP,
  silu(g) u, the rank's down K shard, all-reduced over the ranks, and the finish convolution. Every rank
  writes the whole residual and output. See README.md for the exact semantics, layouts and shards.
operator: {name: muse_spark_draft_mlp, category: other}
interface:
  axes:
    rows: {kind: var, min: 8, max: 64, multiple_of: 8,
           description: "Draft-step rows: requests x an 8-row block (the compiled widths 8, 16, 32, 64)."}
    hidden: {kind: const, value: 8192, description: "Draft model width."}
    coef_rows: {kind: const, value: 2048, description: "Kernel projection rows: 2 sides x 2 taps x 512 groups."}
    sides: {kind: const, value: 2, description: "Convolutions around the MLP (before gate / up, after down)."}
    taps: {kind: const, value: 2, description: "Taps a convolution (this row, the block's previous row)."}
    gate_up_rows: {kind: const, value: 7168, description: "The rank's gate (3584) then up (3584) rows."}
    inter_rank: {kind: const, value: 3584, description: "The rank's intermediate columns (28672 / 8)."}
    guard_words: {kind: const, value: 8, description: "The launch's epoch / guard-word buffer (int32)."}
  inputs:
    res: {kind: tensor, shape: [rows, hidden], dtype: bfloat16, distribution: {kind: generator},
          description: "The residual stream entering the post-attention norm."}
    attn_out: {kind: tensor, shape: [rows, hidden], dtype: bfloat16, distribution: {kind: generator},
               description: "The attention half's output."}
    w_post: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    w_kp: {kind: tensor, shape: [coef_rows, hidden], dtype: bfloat16, role: weight, distribution: {kind: generator},
           description: "The MLP convolution's kernel projection, rows (side, tap, group)."}
    base: {kind: tensor, shape: [sides, taps, hidden], dtype: bfloat16, role: weight, distribution: {kind: generator},
           description: "The MLP convolution's base kernel (side, tap, channel)."}
    w_gu: {kind: tensor, shape: [gate_up_rows, hidden], dtype: bfloat16, role: weight, distribution: {kind: generator},
           description: "gate_up_proj, the rank's gate rows then up rows."}
    w_down: {kind: tensor, shape: [hidden, inter_rank], dtype: bfloat16, role: weight, distribution: {kind: generator},
             description: "down_proj, the rank's input columns (out x in)."}
    guard: {kind: tensor, shape: [guard_words], dtype: int32, role: state, distribution: {kind: generator},
            description: "The baseline's epoch / wait-deadline / error words (read-only unless a wait fails)."}
  outputs:
    res_out: {shape: [rows, hidden], dtype: bfloat16, description: "bf16(res + attn_out): the updated residual."}
    out: {shape: [rows, hidden], dtype: bfloat16, description: "The MLP half's output (after the finish convolution)."}
  mutable: []
  generator: {file: inputs.py, symbol: make_inputs}
distributed:
  world_size: 8
  # the baseline's peer region and flags (draft_mlp.dm_sym_bytes(8) + guard.FLAG_BYTES = 16,777,472 bytes,
  # rounded up to 16,781,312) followed by its local D-MLP mailbox scratch (108,929,024 bytes): all of it is
  # zeroed before every call (baseline/kernel.py)
  symmetric_bytes: 125710336
  shard: {file: inputs.py, symbol: shard_inputs}
  expected: {file: inputs.py, symbol: rank_expected}
  ranks_agree: [res_out, out]
reference: {file: reference.py, symbol: reference}
baseline:
  language: flydsl
  entry: baseline/kernel.py
  provenance:
    source: sgl-project/sgl-amd-mono
    revision: 52486703fbf27e77f05b573e4d931d4eec87118d
    path: >-
      sgl_amd_mono/muse_spark/gfx950/{draft_mlp,compat,config,layout,device}.py,
      sgl_amd_mono/muse_spark/gfx950/stages/{post_attn,ffn,mxfp4}.py,
      sgl_amd_mono/common/{guard,epoch,ops,plan,sync,mx}.py; buffer_ops.py from ROCm/aiter
      652f2d4b768239aefd515c929e84817681ff598d aiter/ops/flydsl/kernels/buffer_ops.py (the copy of
      tasks/flydsl/attention/paged_mqa_logits); dpp_utils.py from ROCm/FlyDSL
      dd8373349e33638c8d158a9ea009b7b28598984a kernels/common/dpp_utils.py (the copy of
      tasks/flydsl/attention/paged_attention_decode)
    license: Apache-2.0 AND MIT (common/ files adapted from ROCm/ATOM, see baseline/LICENSE)
    modifications: >-
      Flattened into one package (imports made relative; the stages/ and common/ modules sit beside
      draft_mlp.py, which imports post_attn.sigmoid and with it ffn.py and mxfp4.py as upstream). FlyDSL
      0.3.2: compat.py keeps the upstream bridge's llvm-dialect global pointer, load, store and launch stop
      as plain functions, which ops.global_ptr / ops.global_load, epoch.gstore and guard.stop_launch call
      directly instead of compat.install() patching flydsl.expr and the common modules at import (draft_mlp
      no longer calls compat.install()). msgspec (not a candidate dependency) is replaced by frozen
      dataclasses for the build keys (DMLPBuild among them) and a slotted class for sync.Addr;
      plan.kernel_sources (which reads module files to digest the transitive sources) is dropped, as FlyDSL
      hashes the helpers of a kernel's own directory and this package is flat; epoch.kernel_symbol uses a
      local stand-in for aiter's kernels_common.kernel_signature; the environment reads
      (SGLANG_AMD_MONO_MUSE_WIDTHS, SGLANG_AMD_MONO_FAULT_INJECT) are replaced by their defaults; the unused
      ops.KernArgs is removed. No kernel or stage code changes. The vendored modules other than draft_mlp.py
      are the ones of tasks/flydsl/other/muse_spark_layer/tp8. kernel.py is new: run() makes
      DraftRunner.kernel's build (DMLPBuild(tokens, npes=8), every stage) and passes DraftRunner.launch's
      arguments, with the framework's symmetric buffer as the peer buffer and, past the peer region, as the
      local scratch (the runner's ordinary device buffer; here uncached memory that the framework zeroes
      before every call, in place of the runner's per-step epoch advance).
compare:
  res_out: {bound: baseline_relative}
  # accumulation-order outliers of the bf16 intermediates: see README.md (Comparison)
  out: {bound: baseline_relative, max_violation_fraction: 1.0e-3}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
