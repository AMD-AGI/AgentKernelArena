schema_version: 3
description: >-
  One Kimi-K3 decoder layer from the attention's core output to the layer output, for a narrow step of
  `rows` <= 8 token rows, on one rank of a TP8 group (8 GPUs; every tensor-parallel collective runs inside
  the kernel over peer memory). Per rank: o_proj of its 12 heads' core columns, all-reduced over the ranks
  (bf16 partials, rank order), added to the residual prefix; the MLP attention-residual seam (the 4 live
  bank rows and the updated prefix scored, softmax-mixed, then post_attention_layernorm); the sigmoid
  router's top-16 of 896 experts with the score-correction bias, weights renormalized; the latent down
  projection 7168 -> 3584 and its MXFP4 quantization; the shared experts' TP slice (gate | up, SiTU, down);
  the routed experts' TP slices on MXFP4 (E2M1 x E8M0) weights in aiter's A16W4 gate / up interleaved
  layout, SiTUv2 and the MXFP4 requantization of its output, the weighted sum over the picks; the latent
  all-reduce and RMSNorm; the latent up projection of the rank's 896 hidden columns plus the shared
  partial; and the final all-reduce, written with the updated prefix added. See README.md.
operator: {name: kimi_k3_layer_post, category: other}
interface:
  axes:
    rows: {kind: var, min: 1, max: 8, description: "Token rows of the step (the launch's widths 1 .. 8)."}
    hidden: {kind: const, value: 7168, description: "Model width."}
    core_k: {kind: const, value: 1536, description: "The rank's attention core columns (12 heads x 128)."}
    max_blocks: {kind: const, value: 8, description: "Attention-residual bank rows allocated (4 are live)."}
    experts: {kind: const, value: 896, description: "Routed experts."}
    latent: {kind: const, value: 3584, description: "Routed-expert (latent) width."}
    shared_gu: {kind: const, value: 1536, description: "The rank's shared gate | up rows (2 x 768)."}
    shared_inter: {kind: const, value: 768, description: "The rank's shared intermediate columns."}
    expert_gu: {kind: const, value: 768, description: "The rank's gate | up rows of an expert (2 x 384)."}
    w13_bytes: {kind: const, value: 1792, description: "E2M1 bytes of a 3584-wide gate / up row."}
    w13_scales: {kind: const, value: 112, description: "E8M0 scales of a 3584-wide gate / up row."}
    w2_bytes: {kind: const, value: 192, description: "E2M1 bytes of the rank's 384-wide down row."}
    w2_scales: {kind: const, value: 16, description: "E8M0 scales of a down row (12, padded to 16 by aiter)."}
    up_rows: {kind: const, value: 896, description: "The rank's hidden columns of the latent up projection."}
    guard_words: {kind: const, value: 8, description: "The launch's epoch / guard-word buffer (int32)."}
  inputs:
    core: {kind: tensor, shape: [rows, core_k], dtype: bfloat16, distribution: {kind: generator},
           description: "The attention's core output of the rank's heads (o_proj's input)."}
    w_o: {kind: tensor, shape: [hidden, core_k], dtype: bfloat16, role: weight, distribution: {kind: generator},
          description: "o_proj, the rank's input columns."}
    prefix_in: {kind: tensor, shape: [rows, hidden], dtype: bfloat16, distribution: {kind: generator},
                description: "The residual stream the seam reads (SGLang's written residual)."}
    blocks: {kind: tensor, shape: [rows, max_blocks, hidden], dtype: bfloat16, distribution: {kind: generator},
             description: "The attention-residual bank (block_residual); rows 0 .. 3 live."}
    ares_nw: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight,
              distribution: {kind: normal, mean: 1.0, std: 0.1}, description: "mlp_res_norm.weight."}
    ares_qk: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight,
              distribution: {kind: normal, mean: 0.0, std: 0.02}, description: "mlp_res_proj.weight."}
    in_nw: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight,
            distribution: {kind: normal, mean: 1.0, std: 0.1}, description: "post_attention_layernorm.weight."}
    w_gate: {kind: tensor, shape: [experts, hidden], dtype: bfloat16, role: weight,
             distribution: {kind: generator}, description: "The router (gate.weight)."}
    bias: {kind: tensor, shape: [experts], dtype: float32, role: weight,
           distribution: {kind: generator}, description: "gate.e_score_correction_bias."}
    w_ld: {kind: tensor, shape: [latent, hidden], dtype: bfloat16, role: weight,
           distribution: {kind: normal, mean: 0.0, std: 0.02}, description: "routed_expert_down_proj (replicated)."}
    w_sgu: {kind: tensor, shape: [shared_gu, hidden], dtype: bfloat16, role: weight,
            distribution: {kind: generator}, description: "shared_experts.gate_up_proj, the rank's gate | up rows."}
    w_sd: {kind: tensor, shape: [hidden, shared_inter], dtype: bfloat16, role: weight,
           distribution: {kind: generator}, description: "shared_experts.down_proj, the rank's input columns."}
    w13: {kind: tensor, shape: [experts, expert_gu, w13_bytes], dtype: uint8, role: weight,
          distribution: {kind: generator},
          description: "The routed experts' gate | up E2M1 codes, the rank's TP slice, aiter shuffle_weight_a16w4(gate_up=True)."}
    w13s: {kind: tensor, shape: [experts, expert_gu, w13_scales], dtype: uint8, role: weight,
           distribution: {kind: generator},
           description: "E8M0 scales of w13, aiter shuffle_scale_a16w4(gate_up=True)."}
    w2: {kind: tensor, shape: [experts, latent, w2_bytes], dtype: uint8, role: weight,
         distribution: {kind: generator},
         description: "The routed experts' down E2M1 codes, the rank's TP slice, aiter shuffle_weight_a16w4(gate_up=False)."}
    w2s: {kind: tensor, shape: [experts, latent, w2_scales], dtype: uint8, role: weight,
          distribution: {kind: generator},
          description: "E8M0 scales of w2, aiter shuffle_scale_a16w4(gate_up=False)."}
    ln_w: {kind: tensor, shape: [latent], dtype: bfloat16, role: weight,
           distribution: {kind: normal, mean: 1.0, std: 0.1}, description: "routed_expert_norm.weight."}
    w_up: {kind: tensor, shape: [up_rows, latent], dtype: bfloat16, role: weight, distribution: {kind: generator},
           description: "routed_expert_up_proj, the rank's 896 output rows."}
    guard: {kind: tensor, shape: [guard_words], dtype: int32, role: state, distribution: {kind: generator},
            description: "The runner's epoch / guard-word buffer (read-only unless a wait fails)."}
  outputs:
    out: {shape: [rows, hidden], dtype: bfloat16,
          description: "The layer output: the MoE output plus the updated prefix (the residual stream)."}
    prefix: {shape: [rows, hidden], dtype: bfloat16, description: "The updated attention-residual prefix."}
  mutable: []
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
distributed:
  world_size: 8
  # the baseline's two epoch-parity peer halves at the widest width and the guard flags
  # (layer.flags_offset() + FLAG_BYTES = 10,049,792 bytes, rounded up to 10,051,584), then its launch scratch
  # (layer.scratch_alloc_bytes() = 770,048 bytes): all of it is zeroed before every call (baseline/kernel.py)
  symmetric_bytes: 10821632
  shard: {file: inputs.py, symbol: shard_inputs}
  expected: {file: inputs.py, symbol: rank_expected}
  ranks_agree: [out, prefix]
reference: {file: reference.py, symbol: reference}
baseline:
  language: flydsl
  entry: baseline/kernel.py
  provenance:
    source: sgl-project/sgl-amd-mono
    revision: 52486703fbf27e77f05b573e4d931d4eec87118d
    path: >-
      sgl_amd_mono/kimi_k3/gfx950/{layer,stamps,tag}.py, sgl_amd_mono/kimi_k3/gfx950/stages/{moe,oproj,seam,gemv,dims}.py,
      sgl_amd_mono/kimi_k3/__init__.py (as model.py), sgl_amd_mono/common/{ops,sync,plan,guard,mx}.py and
      sgl_amd_mono/muse_spark/gfx950/compat.py, as adapted for FlyDSL 0.3.2 by tasks/flydsl/other/muse_spark_layer/tp8;
      buffer_ops.py from ROCm/aiter 652f2d4b768239aefd515c929e84817681ff598d aiter/ops/flydsl/kernels/buffer_ops.py
      and dpp_utils.py from ROCm/FlyDSL dd8373349e33638c8d158a9ea009b7b28598984a kernels/common/dpp_utils.py
      (the copies of tasks/flydsl/other/muse_spark_layer/tp8)
    license: Apache-2.0 AND MIT (common/ files adapted from ROCm/ATOM, see baseline/LICENSE)
    modifications: >-
      Flattened into one package (relative imports; the stages/ modules beside layer.py; kimi_k3/__init__.py's
      constants as model.py). The common/ modules are the FlyDSL 0.3.2 copies of the muse_spark_layer/tp8
      task (compat.py's llvm-dialect pointer, load, store and launch stop called directly instead of
      compat.install() patching modules; msgspec replaced by frozen dataclasses / a slotted class; no
      plan.kernel_sources digest). In the Kimi-K3 files: K2Build, MoeBuild and AttnPostBuild are frozen
      dataclasses; SOURCES is a constant; the route table's LDS atomic OR (fx.llvm.atomic_or, FlyDSL >= 0.3.4)
      goes through a new compat.lds_atomic_or on the llvm dialect; layer.tag_offset() sizes the tagged-x region
      past this launch's own scratch layouts (upstream also takes Kimi-K3's K1 and MLA-front launches, which
      this package does not hold, into the maximum); the host-side init_peer / SENT_READY sentinel arming and
      the k2_launch wrapper are removed, and so are the test-only standalone MoE launch (moe.build / moe.moe,
      take / reset_queues, QUEUE_BYTES) and the never-called standalone attn_post launch (oproj.build). No
      kernel or stage code changed. kernel.py is new: run() makes spec._weights' K2Build for a plain covered
      layer (nblocks 4, reset False, fold, reduce, guint) with K2_OPT minus the three sentinel all-reduces
      (OPT_SENTS; the framework zeroes the symmetric buffer before every call, which would disarm their 0xFF
      sentinels; upstream's check_k2.py checks each OPT bit bit for bit against the launch without it) and
      passes k2_launch's arguments, with the framework's symmetric buffer as the peer buffer and, past the peer
      regions, as the runner's launch scratch (an uncached one-rank buffer upstream too).
compare:
  # downstream of the MXFP4 quantizations of the latent and of the experts' SiTUv2 output, which turn one
  # rounding flip of a bf16 hand-off into ~25 dB row errors: see README.md (Comparison)
  out: {bound: sqnr, min_db: 18}
  prefix: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
