schema_version: 3
description: >-
  One MiniMax-M3 sparse MoE decoder layer (decode / EAGLE3 verify step) on a tensor-parallel-4 group, as one launch
  per rank. Per row: acc = ar + res, h_out = bf16(acc); Gemma RMSNorm, per-token FP8 (amax / 448), the rank's fused
  FP8 q (16 heads) | k | v | index q | index k projection (per-channel FP8 weights, bf16 outputs); per-head Gemma
  norm and partial NeoX RoPE (64 of 128 dims); K -> E4M3(bf16(k) / k_scale) and V -> E4M3(v / v_scale) into the
  rank's page-16 SHUFFLE K / V caches, index k -> E4M3 into the index cache. Indexer: per 128-key block of the
  request's context, max over its causal keys of bf16(index k) . index q, times fp32(sm_scale * log2 e); the 15
  best blocks by (score, block id) plus the block of the row's last key (a context of <= 16 blocks keeps all).
  Sparse attention over those keys: FP8 q x E4M3 K (k_scale), 256-key splits each with its own max and FP8
  probabilities (448 / v_scale scaled) x E4M3 V, merged by log-sum-exp, bf16. Per-token FP8, the rank's FP8 o_proj
  columns, bf16 partial rows summed over the 4 ranks in rank order: a = bf16(sum), h_mid = bf16(a + h_out).
  Router: Gemma RMSNorm of a + h_out to bf16, bf16 logits of the bf16 gate, top 4 of sigmoid + bias, weights =
  the picks' sigmoids renormalized x 2. MoE on the rank's intermediate slice (768 of 3072): MXFP8 activations x
  MXFP4 gate / up (AITER-shuffled, 128 routed experts + the fused shared expert 128 with weight 1),
  swiglu (alpha 1.702, limit 7, up + 1) to bf16, MXFP8 mids x MXFP4 down, route-weighted, bf16 partial rows summed
  over the ranks in rank order: ar_out = bf16(sum). The ranks exchange partial rows through the framework's
  symmetric peer buffers inside the launch. Logical inputs, sharding and layouts are described in inputs.py.
operator:
  name: minimax_m3_sparse_layer
  category: other
interface:
  axes:
    rows: {kind: var, min: 1, max: 16, description: "Token rows of the step (requests x tokens per request)."}
    requests: {kind: var, min: 1, max: 16, description: "Requests of the step; each has rows / requests consecutive rows."}
    ctx: {kind: var, min: 1, max: 131072,
          description: "Context of request 0 (keys of its last row, this step's included); the others draw theirs in [ctx / 2, ctx]."}
    hidden: {kind: const, value: 6144}
    head_dim: {kind: const, value: 128}
    rotary_dim: {kind: const, value: 64}
    qkv_rows: {kind: const, value: 2560, description: "A rank's fused projection rows: 16 q heads, k, v, its index q head, the index k head."}
    o_k: {kind: const, value: 2048, description: "A rank's o_proj input columns (16 heads x 128)."}
    n_routed: {kind: const, value: 128}
    experts: {kind: const, value: 129, description: "128 routed experts and the fused shared expert."}
    w13_rows: {kind: const, value: 1536, description: "Gate then up rows of a rank's intermediate slice (2 x 768)."}
    inter: {kind: const, value: 768, description: "Expert intermediate width per rank (3072 / 4)."}
    max_blocks: {kind: const, value: 1024, description: "Block-table width, the served context 131072 / 128."}
    max_positions: {kind: const, value: 131072}
    page16_bytes: {kind: const, value: 2048, description: "One page-16 of one KV head (16 tokens x 128 E4M3)."}
  derived_axes:
    q_len: rows // requests
    num_pages: requests * ceil_div(ctx, 128) + 1
    num_slots: num_pages * 128
    num_page16: num_pages * 8
  inputs:
    ar:
      kind: tensor
      shape: [rows, hidden]
      dtype: bfloat16
      distribution: {kind: generator}
      description: The previous layer's all-reduced MLP output (its residual add pending), replicated.
    res:
      kind: tensor
      shape: [rows, hidden]
      dtype: bfloat16
      distribution: {kind: generator}
      description: The residual stream, replicated.
    positions: {kind: tensor, shape: [rows], dtype: int64, role: index, distribution: {kind: generator},
                description: "Each row's position (its sequence length - 1)."}
    slot_mapping: {kind: tensor, shape: [rows], dtype: int64, role: index, distribution: {kind: generator},
                   description: "Each row's new KV slot (page * 128 + offset); every slot is > 0."}
    block_table: {kind: tensor, shape: [requests, max_blocks], dtype: int32, role: index,
                  distribution: {kind: generator}, description: "128-token page ids of each request, zero past its context."}
    seq_lens: {kind: tensor, shape: [rows], dtype: int32, role: metadata, distribution: {kind: generator},
               description: "Keys each row attends to, causal within a request: row j of a request of context c has c - q_len + 1 + j."}
    g_in: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator},
           description: "input_layernorm gain (Gemma, applied as gain + 1)."}
    w_qkv: {kind: tensor, shape: [qkv_rows, hidden], dtype: float8_e4m3fn, role: weight, distribution: {kind: generator},
            description: "The rank's fused projection, per-channel FP8, kernel-facing in shuffle_weight (16, 16) order."}
    s_qkv: {kind: tensor, shape: [qkv_rows], dtype: float32, role: weight, distribution: {kind: generator},
            description: "Its per-row scales (amax / 448)."}
    g_q: {kind: tensor, shape: [head_dim], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    g_k: {kind: tensor, shape: [head_dim], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    g_iq: {kind: tensor, shape: [head_dim], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    g_ik: {kind: tensor, shape: [head_dim], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    cos_sin: {kind: tensor, shape: [max_positions, rotary_dim], dtype: bfloat16, role: weight,
              distribution: {kind: generator}, description: "RoPE table: cos of the 32 frequencies, then sin (theta 5e6)."}
    k_scale: {kind: tensor, shape: [1], dtype: float32, role: weight, distribution: {kind: generator},
              description: "The layer's fixed K cache scale."}
    v_scale: {kind: tensor, shape: [1], dtype: float32, role: weight, distribution: {kind: generator},
              description: "The layer's fixed V cache scale."}
    w_o: {kind: tensor, shape: [hidden, o_k], dtype: float8_e4m3fn, role: weight, distribution: {kind: generator},
          description: "The rank's o_proj columns, per-channel FP8, shuffle_weight (16, 16) order."}
    s_o: {kind: tensor, shape: [hidden], dtype: float32, role: weight, distribution: {kind: generator}}
    g_post: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator},
             description: "post_attention_layernorm gain (Gemma)."}
    w_gate: {kind: tensor, shape: [n_routed, hidden], dtype: bfloat16, role: weight, distribution: {kind: generator},
             description: "Router weight, replicated."}
    bias: {kind: tensor, shape: [n_routed], dtype: float32, role: weight, distribution: {kind: generator},
           description: "Routing bias correction (selection only)."}
    w13: {kind: tensor, shape: [experts, w13_rows, hidden // 2], dtype: uint8, role: weight,
          distribution: {kind: generator},
          description: "MXFP4 e2m1 codes of the rank's gate (rows 0-767) and up (768-1535) slices, shuffle_weight (16, 16) order."}
    s13: {kind: tensor, shape: [experts, w13_rows, hidden // 32], dtype: uint8, role: weight,
          distribution: {kind: generator}, description: "e8m0 scales of w13, one per 32 hidden elements, e8m0_shuffle order."}
    w2: {kind: tensor, shape: [experts, hidden, inter // 2], dtype: uint8, role: weight, distribution: {kind: generator},
         description: "MXFP4 codes of the rank's down slice, shuffle_weight (16, 16) order."}
    s2: {kind: tensor, shape: [experts, hidden, inter // 32], dtype: uint8, role: weight,
         distribution: {kind: generator}, description: "e8m0 scales of w2, e8m0_shuffle order."}
    k_cache: {kind: tensor, shape: [num_page16, page16_bytes], dtype: float8_e4m3fn, role: state,
              distribution: {kind: generator},
              description: "The rank's K plane, page-16 SHUFFLE: page p holds slots 16 p .. 16 p + 15 as [d / 16][token][d % 16]."}
    v_cache: {kind: tensor, shape: [num_page16, page16_bytes], dtype: float8_e4m3fn, role: state,
              distribution: {kind: generator}, description: "The rank's V plane, page-16 SHUFFLE: [d][token] a page."}
    index_cache: {kind: tensor, shape: [num_slots, head_dim], dtype: float8_e4m3fn, role: state,
                  distribution: {kind: generator}, description: "The indexer's key cache (E4M3, unit scale), token-major; the same on every rank."}
  outputs:
    h_out: {shape: [rows, hidden], dtype: bfloat16, description: "bf16(ar + res), the attention block's residual."}
    h_mid: {shape: [rows, hidden], dtype: bfloat16, description: "bf16(a + h_out) with a the all-reduced attention output."}
    ar_out: {shape: [rows, hidden], dtype: bfloat16, description: "The all-reduced MoE output (the next layer's ar)."}
  mutable: [k_cache, v_cache, index_cache]
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
distributed:
  world_size: 4
  # sym_layout(4) of the kernel's layout.py (3964928 bytes) plus the guard's peer error flags (256 bytes)
  symmetric_bytes: 3965184
  shard: {file: inputs.py, symbol: shard_inputs}
  expected: {file: inputs.py, symbol: rank_expected}
  ranks_agree: [h_out, h_mid, ar_out]
reference: {file: reference.py, symbol: reference}
baseline:
  language: flydsl
  entry: baseline/kernel.py
  provenance:
    source: >-
      sgl-project/sgl-amd-mono (MiniMax-M3 gfx950 monokernel, whose kernels come from ROCm/aiter PR 6047 and whose
      top-k block selection is ROCm/ATOM's), with the AITER FlyDSL swiglu helper and FlyDSL's buffer / DPP helpers
    revision: 52486703fbf27e77f05b573e4d931d4eec87118d
    path:
      - sgl_amd_mono/minimax_m3/gfx950/post_attn.py
      - sgl_amd_mono/minimax_m3/gfx950/pre_attn.py
      - sgl_amd_mono/minimax_m3/gfx950/index_score.py
      - sgl_amd_mono/minimax_m3/gfx950/select.py
      - sgl_amd_mono/minimax_m3/gfx950/device.py
      - sgl_amd_mono/minimax_m3/gfx950/reduction.py
      - sgl_amd_mono/minimax_m3/gfx950/layout.py
      - sgl_amd_mono/minimax_m3/gfx950/config.py
      - sgl_amd_mono/common/ops.py
      - sgl_amd_mono/common/sync.py
      - sgl_amd_mono/common/guard.py
      - sgl_amd_mono/common/plan.py
      - sgl_amd_mono/common/epoch.py
      - sgl_amd_mono/common/mx.py
      - sgl_amd_mono/muse_spark/gfx950/compat.py
      - sgl_amd_mono/minimax_m3/gfx950/runner.py
      - sgl_amd_mono/minimax_m3/weights.py
    license: >-
      MIT (the minimax_m3/gfx950 kernel files, Copyright (C) 2026 Advanced Micro Devices, Inc., from ROCm/aiter PR
      6047; select.py vendored from ROCm/ATOM 454d0e3023, MIT); Apache-2.0 (sgl-amd-mono's common/ device runtime,
      adapted from ROCm/ATOM 97359d6 (MIT) by way of vLLM; the FlyDSL 0.3.2 bridge; AITER's act.py and FlyDSL's
      buffer_ops.py / dpp_utils.py, FlyDSL Project Contributors)
    notes: >-
      SGLang ROCm images pin sgl-amd-mono e52803f9, 11 commits older; the baseline is vendored from 52486703.
      act.py's swiglu_mul_batch / _sigmoid_f32 / LOG2E are ROCm/aiter aiter/ops/flydsl/kernels/act.py at
      6482901d9f2327ec7a24ce5de62bc111dd40279d (#5395, which added swiglu_mul_batch); buffer_ops.py and dpp_utils.py are ROCm/FlyDSL v0.3.2
      kernels/common copies as vendored in tasks/flydsl/attention/paged_attention_decode. kernel_symbol's
      kernel_signature is aiter kernels_common.py at the same aiter commit. End to end serving of this model on the
      monokernel path also needs the unmerged SGLang PRs #41998 (page-16 SHUFFLE K / V pool) and #41708; the task
      itself does not depend on them.
    modifications: >-
      Imports made relative to the flat baseline package. The FlyDSL >= 0.3.4 entry points the kernels call
      (fx.generic_store, fx.memory_fence, fx.AtomicOrdering, rocdl.SyncScope, the fx.Pointer global pointer) go
      through compat.py, the sgl-amd-mono muse_spark FlyDSL 0.3.2 bridge rewritten as plain functions on the llvm
      dialect (candidates may not patch modules), plus the muse_spark LDS atomic add for the selection's slot
      counter (fx.llvm.atomic_add). msgspec structs became dataclasses / named tuples; plan.py keeps
      only the execution model and a build-parameter key (no source digest: FlyDSL hashes the jit functions
      itself); guard.py has no fault-injection environment switch; index_score's float32 rounding uses math
      instead of struct. The launch takes K1's per-layer pointers as kernel arguments instead of the runner's
      device pointer table (K1_ARGS). Host-side runner, spec, peer-memory and SGLang glue are not vendored:
      kernel.py's run() builds the kernel per row count with MiniMax-M3's constants (spec._build), allocates and
      zeroes the scratch mailboxes and the epoch / guard words inside the call (the framework zeroes the peer
      buffer), expands the block table to rows (metadata.prepare_token_rows' row expansion) and launches on the
      current stream.
compare:
  h_out: {bound: baseline_relative}
  h_mid: {bound: baseline_relative}
  ar_out: {bound: baseline_relative}
  k_cache: {bound: baseline_relative}
  v_cache: {bound: baseline_relative}
  index_cache: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
