schema_version: 3
description: >-
  One Kimi-K3.1 KDA decoder layer for a wide DSpark verify step (requests x 8 rows, padded to the row bucket
  rows), on one rank of a TP8 group (8 GPUs; the collectives run inside the kernel over peer memory, and the
  residual stream is column-sharded: a rank owns 896 of the 7168 columns). Per rank and row: the previous
  layer's MoE tail (the ranks' bf16 latent partials summed in rank order, RMSNorm, scaled by the latent norm
  weight, the latent up projection of the rank's columns plus the summed shared partials, plus the prefix:
  mid); the attention AttnRes seam (softmax over 4 bank snapshots and mid of score-normed dot products, the
  bf16 mixture's output RMSNorm, all-gathered); the rank's fused in_proj (q | k | v | g of 12 heads, f_a,
  beta); the KDA verify on the ReplaySSM ring per (request, head): width-4 causal conv over the slot's conv
  state and the 8 tokens with SiLU, f_b gate with the -5 lower bound, q / k l2norm, the gated delta-rule
  recurrence from the read-only committed state, gated RMSNorm (core), the ring's k / v / gate / beta and the
  verify conv windows written; o_proj (the rank's K slice), its reduce-scatter in rank order plus mid
  (prefix_out, the rank's columns); the MLP AttnRes seam; the MoE front (the rank's 112 router experts, 448
  latent-down rows, 768 + 768 shared gate / up rows), router logits and the latent all-gathered; the top 16 of
  sigmoid(logit) + bias with the picks' sigmoids renormalized; SiTU of the shared gate / up and the rank's
  shared down partial (sh_out). See README.md for the exact semantics, layouts and shards.
operator: {name: kimi_k31_wide_kda_layer, category: other}
interface:
  axes:
    requests: {kind: var, min: 2, max: 48, description: "Requests verified in the step (8 rows each); the wide launch serves 2 .. 48."}
    q_len: {kind: const, value: 8, description: "Rows a request (DSpark's 7 draft tokens + 1)."}
    hidden: {kind: const, value: 7168}
    cols: {kind: const, value: 896, description: "A rank's columns of the residual stream (7168 / 8)."}
    lat: {kind: const, value: 3584, description: "The latent (routed-expert) width."}
    experts: {kind: const, value: 896}
    top_k: {kind: const, value: 16}
    nproj: {kind: const, value: 6288, description: "A rank's in_proj rows (6284 + 4 zero pad rows)."}
    proj: {kind: const, value: 1536, description: "A rank's 12 KDA heads x 128."}
    heads: {kind: const, value: 12}
    head_dim: {kind: const, value: 128}
    conv_ch: {kind: const, value: 4608, description: "A rank's conv channels (q | k | v)."}
    conv_tail: {kind: const, value: 3, description: "Conv state tokens (width 4 - 1)."}
    conv_taps: {kind: const, value: 4}
    front: {kind: const, value: 2096, description: "A rank's MoE front rows (112 router + 448 latent + 1536 shared gate / up)."}
    shared_inter: {kind: const, value: 768, description: "A rank's shared-expert intermediate columns."}
    bank_rows: {kind: const, value: 8, description: "AttnRes bank rows allocated a token (4 live)."}
    slots: {kind: const, value: 64, description: "KDA state slots of the pool."}
    win_rows: {kind: const, value: 64, description: "Rows of the verify conv-window buffer."}
    ring_len: {kind: const, value: 16, description: "ReplaySSM ring tokens a slot."}
    bias_len: {kind: const, value: 4480, description: "896 router biases + 3584 latent norm weights."}
    guard_words: {kind: const, value: 8}
  derived_axes:
    # the step's bucket in requests: the smallest of 2, 4, 8, 16, 32, 48 holding it (wide.REQ_BUCKETS)
    breq: >-
      2 + 2 * min(1, max(0, requests - 2)) + 4 * min(1, max(0, requests - 4)) + 8 * min(1, max(0, requests - 8))
      + 16 * min(1, max(0, requests - 16)) + 16 * min(1, max(0, requests - 32))
    rows: q_len * breq
  inputs:
    lat_p: {kind: tensor, shape: [rows, lat], dtype: bfloat16, distribution: {kind: generator},
            description: "The rank's routed-experts latent partial of the previous layer."}
    sh_p: {kind: tensor, shape: [rows, hidden], dtype: bfloat16, distribution: {kind: generator},
           description: "The rank's shared-expert partial of the previous layer."}
    w_up: {kind: tensor, shape: [cols, lat], dtype: bfloat16, role: weight, distribution: {kind: generator},
           description: "The previous layer's latent up-projection rows of the rank's columns."}
    prefix: {kind: tensor, shape: [rows, hidden], dtype: bfloat16, distribution: {kind: generator},
             description: "The residual stream before the previous layer's MoE output (the rank reads its columns)."}
    bank: {kind: tensor, shape: [rows, bank_rows, cols], dtype: bfloat16, distribution: {kind: generator},
           description: "The rank's columns of the AttnRes bank (snapshots 0 .. 3 live)."}
    cw_a: {kind: tensor, shape: [hidden], dtype: float32, role: weight, distribution: {kind: generator}}
    w_in: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    w_ip: {kind: tensor, shape: [nproj, hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    w_fb: {kind: tensor, shape: [proj, head_dim], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    conv_w: {kind: tensor, shape: [conv_ch, conv_taps], dtype: float32, role: weight, distribution: {kind: generator}}
    a_log: {kind: tensor, shape: [heads], dtype: float32, role: weight, distribution: {kind: generator}}
    dt_bias: {kind: tensor, shape: [proj], dtype: float32, role: weight, distribution: {kind: generator}}
    on_w: {kind: tensor, shape: [head_dim], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    conv_state: {kind: tensor, shape: [slots, conv_tail, conv_ch], dtype: bfloat16, role: state,
                 distribution: {kind: generator}, description: "SGLang's conv cache (read only)."}
    rstate: {kind: tensor, shape: [slots, heads, head_dim, head_dim], dtype: float32, role: state,
             distribution: {kind: generator}, description: "The committed recurrent state (read only on the ring)."}
    st_idx: {kind: tensor, shape: [breq, q_len], dtype: int32, role: index, distribution: {kind: generator}}
    num_acc: {kind: tensor, shape: [breq], dtype: int32, role: metadata, distribution: {kind: generator}}
    win_row: {kind: tensor, shape: [breq], dtype: int32, role: index, distribution: {kind: generator}}
    wo: {kind: tensor, shape: [hidden, proj], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    cw_m: {kind: tensor, shape: [hidden], dtype: float32, role: weight, distribution: {kind: generator}}
    w_ln: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    wf: {kind: tensor, shape: [front, hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    bias: {kind: tensor, shape: [bias_len], dtype: float32, role: weight, distribution: {kind: generator}}
    w_sd: {kind: tensor, shape: [hidden, shared_inter], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    epoch: {kind: tensor, shape: [guard_words], dtype: int32, role: state, distribution: {kind: generator},
            description: "The launch's epoch / guard block (read only unless a wait fails)."}
    prefix_out: {kind: tensor, shape: [rows, hidden], dtype: bfloat16, role: state, distribution: {kind: generator},
                 description: "Zeros; the rank writes its columns of the stream after the attention add."}
    ip_buf: {kind: tensor, shape: [rows, nproj], dtype: bfloat16, role: state, distribution: {kind: generator},
             description: "The in_proj merge buffer: zero before and after."}
    acc_u: {kind: tensor, shape: [rows, cols], dtype: bfloat16, role: state, distribution: {kind: generator},
            description: "The latent-up merge buffer: zero before and after."}
    ring_k: {kind: tensor, shape: [slots, heads, ring_len, head_dim], dtype: bfloat16, role: state,
             distribution: {kind: generator}}
    ring_v: {kind: tensor, shape: [slots, heads, ring_len, head_dim], dtype: bfloat16, role: state,
             distribution: {kind: generator}}
    ring_g: {kind: tensor, shape: [slots, heads, ring_len, head_dim], dtype: float32, role: state,
             distribution: {kind: generator}}
    ring_b: {kind: tensor, shape: [slots, heads, ring_len], dtype: float32, role: state,
             distribution: {kind: generator}}
    conv_win: {kind: tensor, shape: [win_rows, q_len, conv_tail, conv_ch], dtype: bfloat16, role: state,
               distribution: {kind: generator}, description: "The verify conv windows SGLang's accept reads."}
  outputs:
    mid: {shape: [rows, cols], dtype: bfloat16, description: "The rank's columns of the stream after the MoE tail."}
    core: {shape: [rows, proj], dtype: bfloat16, description: "The KDA's gated core output of the rank's heads."}
    lat_out: {shape: [rows, lat], dtype: bfloat16, description: "The gathered latent (the routed experts' input)."}
    topk_ids: {shape: [rows, top_k], dtype: int32, description: "Routed experts, best first."}
    topk_w: {shape: [rows, top_k], dtype: float32, description: "Routing weights of topk_ids."}
    logits_out: {shape: [rows, experts], dtype: float32, description: "The gathered router logits."}
    sh_out: {shape: [rows, hidden], dtype: bfloat16, description: "The rank's shared-expert down partial."}
  mutable: [prefix_out, ip_buf, acc_u, ring_k, ring_v, ring_g, ring_b, conv_win]
  generator: {file: inputs.py, symbol: make_inputs}
distributed:
  world_size: 8
  # the peer regions (two parity halves sized as wide.Wide._ensure sizes them) and the guard flags, then the
  # launch's uncached scratch, the o_proj merge buffer and the tile counters (baseline/kernel.py::_layout):
  # 4.96 / 39.3 / 117.6 MB at 16 / 128 / 384 rows, under this bound
  symmetric_bytes: "rows * 320000 + 1048576"
  shard: {file: inputs.py, symbol: shard_inputs}
  expected: {file: inputs.py, symbol: rank_expected}
  ranks_agree: [lat_out, topk_ids, topk_w, logits_out]
reference: {file: reference.py, symbol: reference}
baseline:
  language: flydsl
  entry: baseline/kernel.py
  provenance:
    source: sgl-project/sgl-amd-mono
    revision: 52486703fbf27e77f05b573e4d931d4eec87118d
    path: >-
      sgl_amd_mono/kimi_k31/gfx950/{layer,pre_attn,chain}.py,
      sgl_amd_mono/kimi_k31/gfx950/stages/{attnres,coll,gemm_coll,kda_wide,moe_front,tile,tile_mma}.py,
      sgl_amd_mono/kimi_k31/plan.py (as wide_plan.py), sgl_amd_mono/kimi_k31/wide.py (the CFGS tables and
      cfg_rows, as wide_cfg.py), sgl_amd_mono/kimi_k3/gfx950/{tag,stamps}.py,
      sgl_amd_mono/kimi_k3/gfx950/stages/dims.py, sgl_amd_mono/kimi_k3/gfx950/attention/kda.py (constants and
      load helpers), sgl_amd_mono/common/{ops,plan,sync,guard,mx}.py and
      sgl_amd_mono/muse_spark/gfx950/compat.py (the copies of tasks/flydsl/other/muse_spark_layer/tp8);
      buffer_ops.py from ROCm/aiter 652f2d4b768239aefd515c929e84817681ff598d
      aiter/ops/flydsl/kernels/buffer_ops.py and dpp_utils.py from ROCm/FlyDSL
      dd8373349e33638c8d158a9ea009b7b28598984a kernels/common/dpp_utils.py (the same copies)
    license: Apache-2.0 AND MIT (common/ and stamps.py adapted from ROCm/ATOM, see baseline/LICENSE)
    modifications: >-
      Flattened into one package (imports made relative; kimi_k31/plan.py renamed wide_plan.py beside
      common/plan.py). FlyDSL 0.3.2: the common modules are the muse_spark_layer task's adapted copies (compat.py's
      llvm-dialect pointer, load, store and launch stop called directly, plus compat.global_atomic_add, an llvm
      atomicrmw add, monotonic, for gemm_coll's and moe_front's fx.inttoptr + fx.llvm.atomic_add counters, and compat.lds_atomic_or
      (atomicrmw or, workgroup scope) for moe_front.sort_rows' fx.llvm.atomic_or; msgspec replaced by frozen dataclasses
      and a slotted class; no plan.kernel_sources digest, SOURCES = "aka-flat"), with common/ops.py's KernArgs
      restored (the layer reads its arguments through it; it returns a collections.namedtuple instead of a
      types.SimpleNamespace, types not being a candidate import). kimi_k31/plan.py's msgspec Structs are frozen
      dataclasses; kda_layer's build key lists its parameters by name instead of {**locals(), ...}. Only the device functions the layer launch calls are kept: the standalone bench builders
      (pre_attn.pre_attn, chain.post_attn and _prefetch, coll's standalone and _delay, gemm_coll's gemm_rs /
      ag_gemm / _reduce_flag / _ag_*, tile's and tile_mma's standalone), pre_attn.fold_up and kimi_k3 kda.py's K1
      launch are dropped. One kernel change: the KDA stage's 16 pointers and 13 strides, which upstream reads
      from the host-built int64 table kda_tab (pre_attn.kda_table / _KdaArgs), are 29 kernel arguments read
      through KernArgs at each use (layer._KdaKernArgs), because run() cannot build a device table (no
      host-to-device copy, no host state, graph capture); the stage code is unchanged. kernel.py is new: run()
      builds wide.Wide._build_launch's layer launch for a middle covered layer (t1, no block write, no capture,
      nvb 4 of 8 bank rows, up_norm, front_rows None, the bucket's cfg_rows configs, eps 1e-5) without the
      in-launch expert sort (SGLANG_AMD_MONO_K31_WIDE_LAUNCH_SORT=0), and passes Wide._launch_args' arguments
      with the framework's symmetric buffer as the peer buffer and, past it, as the local scratch, acc_o and
      the tile counters.
compare:
  # the baseline's split-K slices merge with float atomics in arrival order, so these outputs use SQNR bounds
  # measured over 6608 baseline re-runs on two nodes (lowest SQNR minus 3 dB): see README.md (Comparison)
  mid: {bound: sqnr, min_db: 46}
  core: {bound: sqnr, min_db: 34}
  lat_out: {bound: sqnr, min_db: 42}
  topk_ids: {bound: exact}
  # see README.md (Comparison): bf16 rounding flips of the seam output move single planted logits by up to ~1e-2
  topk_w: {bound: tolerance, rtol: 1.0e-2, atol: 1.0e-4}
  logits_out: {bound: sqnr, min_db: 40}
  sh_out: {bound: sqnr, min_db: 38}
  prefix_out: {bound: sqnr, min_db: 43}
  ip_buf: {bound: exact}
  acc_u: {bound: exact}
  ring_k: {bound: sqnr, min_db: 55}
  ring_v: {bound: sqnr, min_db: 54}
  ring_g: {bound: sqnr, min_db: 40}
  ring_b: {bound: sqnr, min_db: 40}
  conv_win: {bound: sqnr, min_db: 43}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
timeout_s: 3600
