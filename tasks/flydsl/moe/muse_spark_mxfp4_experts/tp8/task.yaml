schema_version: 3
description: >-
  The Muse Spark K3 launch for a DFlash2 verify step of `rows` rows (rows / 8 requests of 8 draft tokens),
  on one rank of a TP8 / EP8 group with TP experts (8 GPUs; the expert hand-offs and the unpooler's
  gather run inside the kernel over peer memory). Per rank, for every token's 8 routed experts of 256: the
  expert input quantized to MXFP4, gate / up on the MXFP4 (E2M1 x E8M0) weights of the rank's 512
  intermediate columns of each expert, bf16(silu(gate) up) re-quantized to MXFP4, the down projection
  (rank's 512 output columns, over the whole intermediate width gathered from the ranks), the finalize
  (per-slot post norm, score-weighted slot sum), the unpooler (4096 -> 8192) and the FFN boundary (post
  norm, the gated fp32 residual stream updated in place, the next layer's pre-attention norm). Every rank
  writes the whole stream and attention input. See README.md for the exact semantics, layouts and shards.
operator: {name: muse_spark_mxfp4_experts, category: moe}
interface:
  axes:
    rows: {kind: var, min: 8, max: 64, multiple_of: 8,
           description: "Verify rows of the step: requests x 8 draft tokens (the compiled widths 8, 16, 32, 64)."}
    hidden: {kind: const, value: 8192, description: "Model width."}
    experts: {kind: const, value: 256, description: "Routed experts."}
    top_k: {kind: const, value: 8, description: "Experts a token."}
    moe_hidden: {kind: const, value: 4096, description: "Pooled width (the experts' input and output)."}
    tp_gate_up_rows: {kind: const, value: 1024, description: "The rank's gate | up rows of an expert (2 x 4096 / 8)."}
    tp_down_rows: {kind: const, value: 512, description: "The rank's down rows of an expert (4096 / 8)."}
    packed_k: {kind: const, value: 2048, description: "E2M1 bytes of a 4096-wide expert row."}
    scale_k: {kind: const, value: 128, description: "E8M0 scales of a 4096-wide expert row."}
    guard_words: {kind: const, value: 8, description: "The launch's epoch / guard-word buffer (int32)."}
  inputs:
    xin: {kind: tensor, shape: [rows, moe_hidden], dtype: bfloat16, distribution: {kind: generator},
          description: "K2's expert input."}
    ids: {kind: tensor, shape: [rows, top_k], dtype: int32, role: index, distribution: {kind: generator},
          description: "K2's routed experts (8 distinct a token)."}
    scores: {kind: tensor, shape: [rows, top_k], dtype: float32, distribution: {kind: generator},
             description: "K2's routing weights of ids."}
    w13: {kind: tensor, shape: [experts, tp_gate_up_rows, packed_k], dtype: uint8, role: weight,
          distribution: {kind: generator}, description: "The rank's E2M1 gate | up rows of every expert."}
    s13: {kind: tensor, shape: [experts, tp_gate_up_rows, scale_k], dtype: uint8, role: weight,
          distribution: {kind: generator}, description: "Their E8M0 scales."}
    w2: {kind: tensor, shape: [experts, tp_down_rows, packed_k], dtype: uint8, role: weight,
         distribution: {kind: generator}, description: "The rank's E2M1 down rows of every expert."}
    s2: {kind: tensor, shape: [experts, tp_down_rows, scale_k], dtype: uint8, role: weight,
         distribution: {kind: generator}, description: "Their E8M0 scales."}
    pen_w: {kind: tensor, shape: [moe_hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    res: {kind: tensor, shape: [rows, hidden], dtype: float32, distribution: {kind: generator},
          description: "The residual stream, updated in place by the FFN boundary."}
    pfw: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    alpha: {kind: tensor, shape: [hidden], dtype: float32, role: weight, distribution: {kind: generator}}
    beta: {kind: tensor, shape: [hidden], dtype: float32, role: weight, distribution: {kind: generator}}
    npw: {kind: tensor, shape: [hidden], dtype: bfloat16, role: weight, distribution: {kind: generator}}
    w_unpool: {kind: tensor, shape: [hidden, moe_hidden], dtype: bfloat16, role: weight,
               distribution: {kind: generator}, description: "The unpooler (post_expert_proj), whole on every rank."}
    guard: {kind: tensor, shape: [guard_words], dtype: int32, role: state, distribution: {kind: generator},
            description: "The baseline's epoch / wait-deadline / error words (read-only unless a wait fails)."}
  outputs:
    attn_out: {shape: [rows, hidden], dtype: bfloat16, description: "The next layer's attention input."}
  mutable: [res]
  generator: {file: inputs.py, symbol: make_inputs}
distributed:
  world_size: 8
  # the baseline's peer regions and guard flags (ffn.k3_sym_layout(8) + guard.FLAG_BYTES = 47,186,176 bytes,
  # rounded up to 47,190,016) followed by its local K3 mailbox scratch (14,163,968 bytes): all of it is
  # zeroed before every call (baseline/kernel.py)
  symmetric_bytes: 61353984
  shard: {file: inputs.py, symbol: shard_inputs}
  expected: {file: inputs.py, symbol: rank_expected}
  ranks_agree: [attn_out, res]
reference: {file: reference.py, symbol: reference}
baseline:
  language: flydsl
  entry: baseline/kernel.py
  provenance:
    source: sgl-project/sgl-amd-mono
    revision: 52486703fbf27e77f05b573e4d931d4eec87118d
    path: >-
      sgl_amd_mono/muse_spark/gfx950/{build_k3,compat,config,layout,device}.py,
      sgl_amd_mono/muse_spark/gfx950/stages/{ffn,mxfp4}.py,
      sgl_amd_mono/common/{guard,epoch,ops,plan,sync,mx}.py; buffer_ops.py from ROCm/aiter
      652f2d4b768239aefd515c929e84817681ff598d aiter/ops/flydsl/kernels/buffer_ops.py (the copy of
      tasks/flydsl/attention/paged_mqa_logits); dpp_utils.py from ROCm/FlyDSL
      dd8373349e33638c8d158a9ea009b7b28598984a kernels/common/dpp_utils.py (the copy of
      tasks/flydsl/attention/paged_attention_decode)
    license: Apache-2.0 AND MIT (common/ files adapted from ROCm/ATOM, see baseline/LICENSE)
    modifications: >-
      Flattened into one package (imports made relative; the stages/ and common/ modules sit beside
      build_k3.py). FlyDSL 0.3.2: compat.py keeps the upstream bridge's llvm-dialect global pointer, load,
      store and launch stop as plain functions, which ops.global_ptr / ops.global_load, epoch.gstore and
      guard.stop_launch call directly instead of compat.install() patching flydsl.expr and the common
      modules at import. msgspec (not a candidate dependency) is replaced by frozen dataclasses for the
      build keys and a slotted class for sync.Addr; plan.kernel_sources (which reads module files to digest
      the transitive sources) is dropped, as FlyDSL hashes the helpers of a kernel's own directory and this
      package is flat; epoch.kernel_symbol uses a local stand-in for aiter's
      kernels_common.kernel_signature; the environment reads (SGLANG_AMD_MONO_MUSE_WIDTHS,
      SGLANG_AMD_MONO_FAULT_INJECT) are replaced by their defaults; the unused ops.KernArgs is removed. No
      kernel or stage code changes. These vendored modules are the ones of
      tasks/flydsl/other/muse_spark_layer/tp8. kernel.py is new: run() makes MuseMonoRunner.k3_kernel's
      build with the runner's default flags (TP experts, bf16 unpooler, not the last layer; the standalone
      launch has no pre-quantized expert input or dynamic ug queue) and passes MuseMonoRunner.launch's
      non-merged K3 arguments, with the framework's symmetric buffer as the peer buffer and, past the peer
      regions, as the local scratch (the runner's ordinary device buffer; here uncached memory that the
      framework zeroes before every call, in place of the runner's per-step epoch advance).
compare:
  attn_out: {bound: baseline_relative}
  # fp32 stream holding a bf16-rounded branch: see README.md (Comparison)
  res: {bound: sqnr, min_db: 60}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
