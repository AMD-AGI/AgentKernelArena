schema_version: 3
description: >-
  Batched MXFP4 GEMM, out[b] = dequant(x[b]) @ dequant(w[b])^T for 128 batch elements, with MXFP4 activations x
  [batch, m, 512] and weights w [batch, 128, 512], both stored as two e2m1 codes per byte (x: [batch, m, 256],
  w: [batch, 128, 256]; the even K index is the low nibble) with e8m0 scales per 32 values of K (uint8, value
  2^(s - 127)), accumulated in float32 and rounded to bfloat16. Kernel-facing layout of the FlyDSL preshuffle GEMM:
  w and w_scales preshuffled, x_scales padded to a multiple of 32 rows and shuffled (see README.md).
operator: {name: batched_gemm_afp4wfp4, category: gemm}
interface:
  axes:
    batch: {kind: const, value: 128, description: Independent GEMMs in the batch (attention heads).}
    m: {kind: var, min: 1, max: 38400, description: Rows (tokens) of each activation matrix.}
    n: {kind: const, value: 128, description: Output width per batch element.}
    k: {kind: const, value: 512, description: Contracted dimension (unpacked fp4 values).}
  inputs:
    x: {kind: tensor, shape: [batch, m, k // 2], dtype: uint8, distribution: {kind: generator}}
    x_scales: {kind: tensor, shape: [batch, (m + 31) // 32 * 32, k // 32], dtype: uint8, distribution: {kind: generator}}
    w: {kind: tensor, shape: [batch, n, k // 2], dtype: uint8, role: weight, distribution: {kind: generator}}
    w_scales: {kind: tensor, shape: [batch, n, k // 32], dtype: uint8, role: weight, distribution: {kind: generator}}
  outputs:
    out: {shape: [batch, m, n], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
  layout: {file: inputs.py, symbol: to_kernel_layout}
reference: {file: reference.py, symbol: reference}
baseline:
  language: flydsl
  entry: baseline/kernel.py
  provenance:
    source: ROCm/FlyDSL
    revision: dd8373349e33638c8d158a9ea009b7b28598984a
    path: kernels/gemm/mxfp4_preshuffle.py
    license: Apache-2.0 (kernel); MIT (launcher from ROCm/aiter)
    notes: >-
      The launcher (argument checks, default tile 128x128x256, bmn layout, fp4 activations) is the gfx950 path of
      flydsl_batched_gemm_mxfp4 in aiter/ops/flydsl/batched_gemm_mxfp4.py of ROCm/aiter at commit
      652f2d4b768239aefd515c929e84817681ff598d (MIT). FlyDSL v0.3.2 is the release of the evaluation image.
    modifications: >-
      kernel.py is the launcher of ROCm/aiter (commit 652f2d4b768239aefd515c929e84817681ff598d, file
      aiter/ops/flydsl/batched_gemm_mxfp4.py, MIT); the FlyDSL kernel is paired with it for this task, because AITER's
      gfx950 branch imports .kernels.mxfp4_preshuffle, which does not exist in AITER at that commit. Kernel unchanged except that the import of xcd_remap_bx_by from the repository-level kernels package (not part of
      the installed FlyDSL release) is removed together with the xcd_swizzle parameter and its branch, which the launcher
      never enabled (xcd_swizzle 0). Launcher: AITER's call predates the b_dtype argument of launch_gemm in v0.3.2, so
      b_dtype "fp4" is passed explicitly; the ptr_arg shim is replaced by flyc.from_c_void_p; the argument checks are
      cached per shape with functools.lru_cache; the launch runs on the current stream through run(). The output is
      allocated by the evaluator instead of by the launcher.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
