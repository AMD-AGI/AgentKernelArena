schema_version: 3
description: >-
  Single-token (decode) grouped-query attention over vLLM's paged KV cache (ROCm layout),
  out[s, h] = softmax(scale * q[s, h] . K_s^T) . V_s, where K_s and V_s are the first seq_lens[s]
  tokens of sequence s and token t lives in page block_table[s, t // 16] at slot t % 16. All 16
  query heads attend to the single KV head (head size 128). Keys are stored as
  key_cache[page, kv_head, d // 8, slot, d % 8] and values as value_cache[page, kv_head, d, slot].
  Slots past a sequence's length, unreferenced pages and the reserved page 0 hold stale values and
  must not affect the result; block_table entries past a sequence's last page are 0. Queries and
  the cache are bfloat16 and the result is rounded to bfloat16.
operator:
  name: paged_attention_decode
  category: attention
interface:
  axes:
    num_seqs: {kind: var, min: 1, max: 1024, description: Sequences decoded in the step (one query token each).}
    max_seq_len: {kind: var, min: 1, max: 16384, description: 'Longest context in the batch; the other contexts are uniform in [1, max_seq_len].'}
    num_query_heads: {kind: const, value: 16, description: Query heads per tensor-parallel rank.}
    num_kv_heads: {kind: const, value: 1, description: KV heads per tensor-parallel rank (group size 16).}
    head_size: {kind: const, value: 128, description: Head dimension of queries and the KV cache.}
    block_size: {kind: const, value: 16, description: Tokens per KV-cache page.}
    x: {kind: const, value: 8, description: Head-dimension elements per 16-byte key vector.}
  derived_axes:
    max_blocks_per_seq: ceil_div(max_seq_len, block_size)
    num_blocks: num_seqs * max_blocks_per_seq + 1
  inputs:
    query:
      kind: tensor
      shape: [num_seqs, num_query_heads, head_size]
      dtype: bfloat16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
    key_cache:
      kind: tensor
      shape: [num_blocks, num_kv_heads, head_size // x, block_size, x]
      dtype: bfloat16
      role: state
      distribution: {kind: generator}
      description: Paged keys, element d of the token in (page, slot) at [page, kv_head, d // x, slot, d % x].
    value_cache:
      kind: tensor
      shape: [num_blocks, num_kv_heads, head_size, block_size]
      dtype: bfloat16
      role: state
      distribution: {kind: generator}
      description: Paged values, element d of the token in (page, slot) at [page, kv_head, d, slot].
    block_table:
      kind: tensor
      shape: [num_seqs, max_blocks_per_seq]
      dtype: int32
      role: index
      distribution: {kind: generator}
      description: Physical page of each logical 16-token block of a sequence; 0 past its last page.
    seq_lens:
      kind: tensor
      shape: [num_seqs]
      dtype: int32
      role: metadata
      distribution: {kind: generator}
      description: Context length of each sequence, in [1, max_seq_len].
    scale: {kind: scalar, dtype: float32, default: 0.08838834764831845, description: 'Softmax scale, head_size ** -0.5.'}
  outputs:
    out: {shape: [num_seqs, num_query_heads, head_size], dtype: bfloat16}
  generator: {file: inputs.py, symbol: make_inputs}
reference: {file: reference.py, symbol: reference}
baseline:
  language: gluon
  entry: baseline/kernel.py
  provenance:
    source: ROCm/aiter
    revision: 652f2d4b768239aefd515c929e84817681ff598d
    path: aiter/ops/triton/gluon/pa_decode_gluon.py
    license: MIT
    modifications: >-
      Only the persistent-scheduling decode kernel for one KV head
      (paged_attention_decode_sliding_window_head_1) and its helpers are kept, unchanged. The
      wrapper's one-shot mode (max_context_partition_num = 1) is used, in which that kernel writes the
      final output directly, so the Triton, FlyDSL and C++ reduce kernels are not launched (a Gluon
      baseline launches only Gluon kernels). The other kernels, the flydsl and csrc imports, the aiter
      imports and the Gluon-unavailable fallback are removed, the arch query is inlined, and
      pa_decode_gluon and its kernel-selection wrapper are replaced by run() with the same dispatch for
      bf16 queries and cache, one KV head, query length 1, 16-token pages and a 256-token compute
      partition.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
