schema_version: 3
description: >-
  LLaMA feed-forward gate with fused RMSNorm: h = rms_w * x * rsqrt(mean(x^2) + epsilon) over the 4096-wide hidden
  axis, out = silu(h @ w1.T) * (h @ w3.T) with x [n_tokens, 4096], w1 and w3 [14336, 4096] and rms_w [4096] in
  float16. The products accumulate in float32 and out [n_tokens, 14336] is rounded to float16.
operator: {name: llama_ff_rmsnorm_swiglu, category: gemm}
interface:
  axes:
    n_tokens: {kind: var, min: 1, max: 16384, description: Tokens in the batch.}
    hidden_size: {kind: const, value: 4096, description: Model hidden size (normalized and contracted axis).}
    ffn_size: {kind: const, value: 14336, description: Feed-forward intermediate width.}
  inputs:
    x:
      kind: tensor
      shape: [n_tokens, hidden_size]
      dtype: float16
      distribution: {kind: normal, mean: 0.0, std: 1.0}
    w1:
      kind: tensor
      shape: [ffn_size, hidden_size]
      dtype: float16
      role: weight
      distribution: {kind: normal, mean: 0.0, std: 0.02}
    w3:
      kind: tensor
      shape: [ffn_size, hidden_size]
      dtype: float16
      role: weight
      distribution: {kind: normal, mean: 0.0, std: 0.02}
    rms_w:
      kind: tensor
      shape: [hidden_size]
      dtype: float16
      role: weight
      distribution: {kind: uniform, low: 0.5, high: 1.5}
    epsilon: {kind: scalar, dtype: float32, default: 1.0e-6}
  outputs:
    out: {shape: [n_tokens, ffn_size], dtype: float16}
reference: {file: reference.py, symbol: reference}
baseline:
  language: triton
  entry: baseline/kernel.py
  provenance:
    source: thunlp/TritonBench
    revision: unrecorded in the old task package
    path: llama_ff_triton.py
    license: Apache-2.0
    modifications: >-
      Kernel ff_llama as adapted by the previous task package; the unused fused variant, the host-side weight
      concatenation and the test harness are removed. A launcher selects the row-tile size by batch size and passes the
      weights in their [out, in] layout through strides; wrapped in the run() interface. The rms_w load uses a 1-D
      loop-index-addressed vector instead of a loop-carried [1, BLOCK_K] pointer tensor, to lower on Triton 3.8.0 ROCm.
compare:
  out: {bound: baseline_relative}
workloads: workloads.json
platform_support:
  required_arch: [gfx950]
