# KernelForge forge-rewrite-by-flydsl settings for the forge_operator2flydsl agent.
#
# Every search control lives here and nowhere else. How many correctness-only
# port sessions a campaign is worth, and where its coarse filter sits, describe
# how this agent searches rather than what the operator computes or how Arena
# scores it -- another agent implementing operator2flydsl may have neither.
model: claude-opus-5

# Arena's hard subprocess timeout. --max-hours is derived from it with a 900s
# shutdown margin so KernelForge self-stops before the kill, so this value is
# the rewrite budget plus that margin: 87300 = 24h + 15min.
timeout_seconds: 87300

permission_mode: acceptEdits

# KernelForge's coarse filter on a port before it enters the optimize loop. The
# SIKL drivers print no `SNR:` line, so it never fires for them: their verdict
# is the schema bundle's comparison callback. It stays for tasks whose driver
# does report one.
snr_threshold: 30.0
max_port_attempts: 5

# OPTIMIZE supervisor backend on stall: codex or claude.
supervisor_backend: codex

# The rewrite recipe store is deliberately absent from this file: whether it is
# reachable is a property of the environment, not of how this agent runs, so
# KernelForge and KNOWLEDGE_STORE_MODE decide it between them and Arena passes
# no flag either way. See _build_rewrite_command.
