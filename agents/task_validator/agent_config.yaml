backend: codex               # codex | claude_code; run-level agent fields override
# v2: semantic-review budget; TaskSession has already run initial task actions.
# legacy: minimum outer budget, raised to cover configured task commands.
timeout_seconds: 1200         # 0 disables the outer timeout
python_path: null             # framework interpreter, then this process's interpreter

# Already verified by the CLI integration qualification; no model discovery at run time.
model: gpt-5.6-terra
effort: medium
# Optional Claude Code run-level setting: agent.max_budget_usd

# Legacy command defaults; v2 uses TaskSpec action timeouts.
compile_timeout: 600
correctness_timeout: 600
performance_timeout: 600
