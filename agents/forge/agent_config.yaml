# One Forge integration for all v2 tasks. These are agent search controls.
workflow: auto
model: claude-opus-5
agent_backend: claude
permission_mode: acceptEdits
# Shared wall-clock cap: setup, checks, PORT and nested OPTIMIZE together.
timeout_seconds: 87300
session_timeout_seconds: 3600
max_port_attempts: 3
# HIP/Triton initialization uses Forge's own correctness-only implementer.
# Reserve the remaining campaign budget for the ordinary optimization loop.
initialization_max_attempts: 3
initialization_budget_fraction: 0.4
# Empty follows agent_backend; no accidental provider/model mismatch.
supervisor_backend: ""
# Optional executable for an environment with Hyperloom[forge] installed.
# python: /opt/forge/bin/python
