# Apex is an orchestrating kernel optimizer. Its selected backend is the only
# host agent CLI/auth state that AgentKernelArena mounts into the worker.
backend: codex
model: gpt-5.5
effort: xhigh
permission_mode: workspace_write_isolated

# APEX_ROOT is preferred at runtime. Formal Docker campaigns replace it with
# the digest-addressed `repo` inside the sealed SquashFS runtime; non-campaign
# runs may still use a caller-selected read-only checkout.
apex_root: null
python_path: null

supported_task_types:
  - triton2triton

max_iterations: 1
# Matched campaigns own repetition across fresh workspaces/sessions. Keep one
# Apex optimization attempt inside each outer session.
campaign_max_iterations: 1
max_turns: 50
timeout_seconds: 3600
compile_timeout_seconds: 3600
correctness_timeout_seconds: 3600
performance_timeout_seconds: 3600

# Controller-owned interchange limits. Apex artifacts remain outside the scored
# task workspace and AgentKernelArena independently validates the returned patch.
max_result_bytes: 8388608
max_bundle_bytes: 67108864
max_process_output_bytes: 4194304
# Apex's inner Codex supervisor currently enforces this independent per-stream
# bound; max_process_output_bytes above applies only to the outer Apex transport.
structured_stream_output_limit_bytes: 16777216
structured_stream_overflow_policy: apex_inner_supervisor_bounded_truncation
