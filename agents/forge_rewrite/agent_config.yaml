# KernelForge forge-rewrite-by-flydsl settings for the forge_rewrite agent.
#
# A task's `rewrite:` block overrides snr_threshold and max_port_attempts: the
# task knows its operator's tolerance and how many correctness-only port
# sessions it is worth.
model: claude-opus-5

# Arena's hard subprocess timeout. --max-hours is derived from it with a 900s
# shutdown margin so KernelForge self-stops before the kill, so this value is
# the rewrite budget plus that margin: 87300 = 24h + 15min.
timeout_seconds: 87300

permission_mode: acceptEdits
snr_threshold: 30.0
max_port_attempts: 3

# OPTIMIZE supervisor backend on stall: codex or claude.
supervisor_backend: codex

# Read and publish rewrite recipes. KernelForge pins this KB to the KB_STORE
# backend (cli.py, forge-rewrite-by-flydsl), so enabling it requires KB_STORE_URL
# and KB_STORE_TOKEN -- a GBRAIN-only environment fails the preflight. With it
# off, the experience store stays local and no remote credentials are validated.
rewrite_kb: false
