# KernelForge forge-rewrite-by-flydsl settings for the forge_rewrite agent.
#
# A task's `rewrite:` block overrides snr_threshold and max_port_attempts: the
# task knows its operator's tolerance and how many correctness-only port
# sessions it is worth.
# Left empty on purpose, which makes Arena omit --model and lets KernelForge
# resolve the id for whichever provider FORGE_AGENT_BACKEND selects, from
# CLAUDE_MODEL or CODEX_MODEL. A value here can only name one provider's
# deployment, so it is wrong on the other one -- and it wins over the
# environment, so the environment cannot correct it. Name a model here only to
# pin a run to one regardless of backend.
model: ""

# Arena's hard subprocess timeout. --max-hours is derived from it with a 900s
# shutdown margin so KernelForge self-stops before the kill, so this value is
# the rewrite budget plus that margin: 87300 = 24h + 15min.
timeout_seconds: 87300

permission_mode: acceptEdits
snr_threshold: 30.0
max_port_attempts: 3

# OPTIMIZE supervisor backend on stall: codex or claude.
supervisor_backend: codex

# The rewrite recipe store is deliberately absent from this file: whether it is
# reachable is a property of the environment, not of how this agent runs, so
# KernelForge and KNOWLEDGE_STORE_MODE decide it between them and Arena passes
# no flag either way. See _build_rewrite_command.
