          (131, 4003),     # alignment-stress: prime dims, multi-iteration partial tile
          (1, 65536),      # asymmetric: single row, 64 BLOCK_SIZE iterations
          (8192, 4096),    # production: Llama-2-7B prefill hidden_dim
          (2048, 11008),   # production: Llama-2-7B FFN intermediate dim
      ]
