          (131, 768, 256),      # alignment-stress: prime M=131, large group_size=256
          (1, 8192, 128),       # asymmetric: single token, very wide N=8192 (64 groups)
          (512, 4096, 128),     # production: LLaMA-7B hidden_dim=4096 prefill
          (8, 11008, 64),       # production: LLaMA-7B FFN intermediate dim decode
      ]
