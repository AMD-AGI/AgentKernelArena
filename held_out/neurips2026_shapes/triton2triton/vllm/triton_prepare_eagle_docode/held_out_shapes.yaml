          (7, 37, 131, 1019, 13),        # alignment-stress: all prime dimensions, no tile alignment
          (11, 67, 1019, 4003, 23),      # alignment-stress: odd composites and primes, misaligned for BLOCK_SIZE=1024
          (1, 8192, 256, 16384, 2),      # asymmetric: single request but very large total_tokens pool
          (8, 128, 4096, 4096, 16),      # production: Llama-7B decode, hidden_size=4096
          (4, 64, 5120, 8192, 8),        # production: Llama-13B decode, hidden_size=5120
