          (3, [37, 19, 41], 131),                                                                # alignment-stress: all-prime lengths, prime D=131
          (5, [67, 53, 71, 59, 73], 97),                                                         # alignment-stress: prime lengths, prime D=97, Lmax=73
          (1, [4096], 64),                                                                       # asymmetric: single seq with Lmax=4096, B=1
          (4, [512, 128, 256, 384], 128),                                                        # production: variable-length prefill batch, head_dim=128
          (8, [2048, 1024, 512, 2048, 768, 1536, 256, 1024], 64),                                # production: LLM serving batch, varied seq_lens, head_dim=64
