          (7, 13, 3),       # alignment-stress: prime num_reqs=7, prime tokens_per_req=13, total_output=13+3+2+5=23 not aligned to any tile
          (11, 37, 5),      # alignment-stress: prime num_reqs=11, prime tokens_per_req=37, num_pad=5 (prime), output per req ~47 not aligned to 128
          (1, 512, 1),      # asymmetric: single request with very long sequence (512 tokens), tests many token blocks (axis=1) with single grid row
