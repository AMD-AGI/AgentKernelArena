task_type: triton2triton
num_original_shapes: 1
injections:
  - file: scripts/task_runner.py
    find_marker: "TEST_SHAPES"
    replacement_code: |
      TEST_SHAPES = [
          (1, 64, 1),      # edge-case: B=1, T=BT=64 single tile, single head
          (4, 512, 8),      # scale-up: 4x T, 4x H vs original (2,128,2)
          (1, 32, 1),       # scale-down: T=32 < BT=64, partial single tile
          (2, 131, 3),      # alignment-stress: T=131 prime, H=3 odd
          (3, 97, 5),       # alignment-stress: T=97 prime, B=3 odd, H=5 odd
          (1, 4096, 1),     # asymmetric: very long seq with minimal batch/heads
          (2, 2048, 16),    # production: 16-head model prefill-like workload
          (8, 512, 32),     # production: 32-head Llama-style batch inference
      ]

      def gen_inputs(seed, device, shape=None):
          import torch
          torch.manual_seed(seed)
          if shape is None:
              B, T, H = 2, 128, 2
          else:
              B, T, H = shape
          BT = 64
          A = torch.randn(B, T, H, BT, device=device, dtype=torch.float32) * 0.1
          idx = torch.arange(BT, device=device)
          t_in_block = torch.arange(T, device=device) % BT
          mask = t_in_block[:, None] > idx[None, :]
          A = A * mask[None, :, None, :]
          return (A,), {}
