          (97, 13, 67, 48, 17),       # alignment-stress: all-prime dims stress masking and tiling
          (1, 64, 128, 512, 16),      # asymmetric: 1 token into 8192-slot cache, extreme ratio
          (512, 32, 128, 64, 16),     # production: Llama-7B prefill, 512 seq_len, 32 KV heads
          (8, 8, 64, 32, 16),         # production: Llama-7B GQA decode, batch=8, 8 KV heads
