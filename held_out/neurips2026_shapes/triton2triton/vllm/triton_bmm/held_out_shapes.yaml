          (3, 37, 131, 47),          # alignment-stress: all prime/odd dims, no multiple of 32/64/128
          (2, 199, 67, 101),         # alignment-stress: all prime dims, asymmetric aspect
          (1, 1, 4096, 64),          # asymmetric: M=1 single-row with wide N, decode-like BMM
          (8, 512, 512, 64),         # production: 8 heads, 512 seq_len, 64 head_dim attention BMM
          (2, 2048, 128, 128),       # production: 2 batches, 2048 seq_len, 128 head_dim prefill-like
