          (1, 1, 2048, 64, 8, 64, 16, 2),       # asymmetric: high GQA ratio 8:1, 64 query heads, single seq decode
          (4, 1, 2048, 32, 8, 128, 16, 4),      # production: Llama-2-7B decode, 4 seqs, 2048 context
