task_type: triton2triton
num_original_shapes: 5
injections:
  - file: rmsnorm_bwd.py
    find_marker: "raw_replace"
    old_code: |
      @pytest.mark.parametrize("in_dtype_str", ["fp16", "bf16"])
      @pytest.mark.parametrize("out_dtype_str", ["fp16", "bf16"])
      @pytest.mark.parametrize('ZERO_CENTERED_GAMMA', [True, False])
      @pytest.mark.parametrize('M, N', [
          (1, 4),
          (2, 10),
          (256, 4096),
          (1, 31744),
          (873, 1245),
      ])
    replacement_code: |
      @pytest.mark.parametrize("in_dtype_str", ["fp16", "bf16"])
      @pytest.mark.parametrize("out_dtype_str", ["fp16", "bf16"])
      @pytest.mark.parametrize('ZERO_CENTERED_GAMMA', [True, False])
      @pytest.mark.parametrize('M, N', [
          (1, 1),              # edge-case: single element, degenerate dimensions
          (4096, 16384),       # scale-up: 2x N over largest original non-degenerate shape
          (4, 64),             # scale-down: very small input, tests over-provisioning
          (127, 1019),         # alignment-stress: prime M and prime N, not multiples of 32/64/128
          (311, 4003),         # alignment-stress: larger primes, stresses masking in blocked path
          (16384, 128),        # asymmetric: M>>N by 128x, tall-skinny workload
          (2048, 4096),        # production: Llama-8B hidden_size=4096, prefill seq_len=2048
          (4096, 14336),       # production: Llama-8B intermediate_size=14336 FFN layer
      ])
  - file: rmsnorm_bwd.py
    find_marker: "raw_replace"
    old_code: |
      RMSNORM_SHAPES_FOR_PERF = [
          (256, 4096), (2048, 2048), (4096, 8192), (8192, 8192),
          (1, 31744), (1, 131072),
