task_type: triton2triton
num_original_shapes: 2
injections:
  - file: test_kernel_dot.py
    find_marker: "raw_replace"
    old_code: |
      @pytest.mark.parametrize("dtype_str", ["fp32", "fp16"])
    replacement_code: |
      @pytest.mark.parametrize("dtype_str", [
          "bf16",   # edge-case: bf16 dtype boundary for tl.dot accumulator
          "bf16",   # scale-up: bf16 tests wider accumulator precision
          "bf16",   # scale-down: bf16 minimal-resource dtype path
          "bf16",   # alignment-stress: bf16 non-native dot accumulation
          "bf16",   # alignment-stress: bf16 rounding at tile boundary
          "bf16",   # asymmetric: bf16 mixed-precision tl.dot path
          "fp32",   # production-realistic: fp32 standard training dtype
          "fp16",   # production-realistic: fp16 standard inference dtype
      ])
  - file: test_kernel_dot.py
    find_marker: "raw_replace"
    old_code: |
      @pytest.mark.parametrize("dtype_str", KERNEL_DOT_DTYPES_FOR_PERF)
      @pytest.mark.parametrize("num_warps_launch", KERNEL_DOT_NUM_WARPS_FOR_PERF)
    replacement_code: |
      @pytest.mark.parametrize("dtype_str, num_warps_launch", [
          ("bf16", 1),    # edge-case: bf16 with min warps, tl.dot bf16 accumulator boundary
          ("fp32", 16),   # scale-up: 4x max original warps, over-provisioned for 16x16 tile
          ("bf16", 2),    # scale-down: new dtype with minimal warp count
          ("fp16", 8),    # alignment-stress: 256 threads for 256 elements, 1:1 thread-element ratio
          ("fp32", 8),    # alignment-stress: high warp count stresses scheduler for tiny tile
          ("bf16", 16),   # asymmetric: extreme warp oversubscription with bf16 precision
          ("fp16", 16),   # production-realistic: fp16 high-parallelism inference config
          ("bf16", 4),    # production-realistic: bf16 standard transformer training/inference dtype
      ])
