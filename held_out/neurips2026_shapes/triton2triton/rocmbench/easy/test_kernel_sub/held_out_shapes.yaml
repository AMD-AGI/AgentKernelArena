      @pytest.mark.parametrize("N_val", [1024, 4096, 16384])
      @pytest.mark.parametrize("dtype_str", ["fp32", "fp16"])
    replacement_code: |
      @skip_if_no_target
      @pytest.mark.parametrize("N_val, dtype_str", [
          (32, "fp32"),       # edge-case: N=32, single-warp boundary, minimal arange
          (131072, "fp32"),   # scale-up: 8x largest original N, stress non-tiled grid
          (128, "fp16"),      # scale-down: 8x smaller than original min (1024)
          (64, "fp16"),       # alignment-stress: exactly one AMD wavefront width
          (256, "fp32"),      # alignment-stress: sub-1024 power-of-2, small allocation
          (65536, "fp16"),    # asymmetric: large N with fp16, precision stress at scale
          (8192, "fp32"),     # production: GPT-3 hidden dim size
          (2048, "fp16"),     # production: GPT-2 medium hidden dim size
      ])
