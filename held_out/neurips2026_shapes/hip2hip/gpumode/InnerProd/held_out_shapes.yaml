task_type: hip2hip
num_original_shapes: 5
init_constraints:
  fc_dim: 4
injections:
  - file: pytorch_code_module/py_11709_InnerProd.py
    find_marker: "def get_inputs"
    replacement_code: |
      def get_inputs():
          """
          Generate 8 held-out test cases for generalization evaluation.
          HIP kernel expects feat_img: [B, 1, C] (3D with middle dim=1) and feat_sound: [B, C, H, W]
          All test cases use C=4 to match fc_dim=4 in get_init_inputs().
          """
          configs = [
              (1, 4, 1, 1),        # edge-case: minimal single-element spatial, batch=1
              (128, 4, 128, 128),  # scale-up: 2x batch and 2x H/W vs largest original
              (2, 4, 2, 2),        # scale-down: 2x smaller than smallest original in all dims
              (3, 4, 37, 41),      # alignment-stress: prime H and W, non-power-of-2 batch
              (7, 4, 131, 17),     # alignment-stress: all prime/odd dims, tall-ish spatial
              (1, 4, 1, 65536),    # asymmetric: extreme 1D-like workload, W >> H
              (8, 4, 56, 56),      # production: ResNet conv3 feature map size
              (16, 4, 14, 14),     # production: ResNet conv4 feature map size
          ]

          for B, C, H, W in configs:
              feat_img = torch.randn([B, 1, C], dtype=torch.float32)
              feat_sound = torch.randn([B, C, H, W], dtype=torch.float32)
              yield [feat_img, feat_sound]
