# ============================================================
# Cheatsheet Configuration
#
# Two independent dimensions:
#   architecture: GPU-model → hardware spec documents + gfx arch string
#   knowledge:    target language → language best-practice guide (GPU-agnostic)
#
# prompt_builder.py combines BOTH for every task:
#   final cheatsheet = architecture[gpu_model].files + knowledge[language]
#
# `file` remains supported for single-document architecture entries.
# ============================================================

architecture:
  MI300:
    gfx_arch: gfx942
    files:
      - src/prompts/cheatsheet/CDNA3_gfx942_architecture.md
      - src/prompts/cheatsheet/MI300_series_profile.md
  MI300X:
    gfx_arch: gfx942
    files:
      - src/prompts/cheatsheet/CDNA3_gfx942_architecture.md
      - src/prompts/cheatsheet/MI300X_profile.md
  MI325:
    gfx_arch: gfx942
    files:
      - src/prompts/cheatsheet/CDNA3_gfx942_architecture.md
      - src/prompts/cheatsheet/MI325X_profile.md
  MI325X:
    gfx_arch: gfx942
    files:
      - src/prompts/cheatsheet/CDNA3_gfx942_architecture.md
      - src/prompts/cheatsheet/MI325X_profile.md
  MI300A:
    gfx_arch: gfx942
    files:
      - src/prompts/cheatsheet/CDNA3_gfx942_architecture.md
      - src/prompts/cheatsheet/MI300A_profile.md
  MI355X:
    gfx_arch: gfx950
    file: src/prompts/cheatsheet/MI355X_architecture.md
  RDNA4:
    gfx_arch: gfx1201
    file: src/prompts/cheatsheet/RDNA4_architecture.md
    knowledge_override:
      hip:    src/prompts/cheatsheet/hip_rdna_cheatsheet.md
      triton: src/prompts/cheatsheet/triton_rdna_cheatsheet.md

knowledge:
  gpu:      src/prompts/cheatsheet/gpu_cheatsheet.md
  python:   src/prompts/cheatsheet/python_cheatsheet.md
  hip:      src/prompts/cheatsheet/hip_cheatsheet.md
  triton:   src/prompts/cheatsheet/triton_cheatsheet.md
  flydsl:   src/prompts/cheatsheet/flydsl_cheatsheet.md
  tilelang: src/prompts/cheatsheet/tilelang_cheatsheet.md
